  untracked: { label: 'Not tracked', short: '·', cls: 'u' },
  pending: { label: 'Today, nothing yet', short: '…', cls: 'n' },
  future: { label: '', short: '', cls: 'f' },
  // by the clock (shown on the day; the day itself counts as worked)
  late: { label: 'Late or left early (hours of pay)', short: 'h', cls: 'w' },
  noout: { label: 'No clock-out', short: '?', cls: 'w' },
  noclock: { label: 'Worked, not clocked in', short: '!', cls: 'w' }
};
const fmtMonthLong = (mk) => fmtD(new Date(mk + '-01T00:00:00'), { month: 'long', year: 'numeric' });
const monthDays = (mk) => { const d = new Date(mk + '-01T00:00:00'); const n = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return Array.from({ length: n }, (_, i) => mk + '-' + pad2(i + 1)); };
const shiftMonth = (mk, n) => { const d = new Date(mk + '-01T00:00:00'); d.setMonth(d.getMonth() + n); return ymd(d).slice(0, 7); };
const payOf = (s) => (s.pay = s.pay && typeof s.pay === 'object' ? s.pay : {});
// weekly day off: what was set for salary, else the days with no capacity (tailors), else Friday
function offDaysOf(s) {
  const p = s.pay || {};
  if (Array.isArray(p.offDays)) return p.offDays;
  const cap = s.cap || [];
  return cap.some((v) => num(v) > 0) ? [0, 1, 2, 3, 4, 5, 6].filter((i) => !(num(cap[i]) > 0)) : [5];
}
const attDoc = (sid, ds) => S.attendance.find((a) => a.id === sid + '_' + ds) || null;
const payrollDoc = (sid, mk) => S.payroll.find((p) => p.id === sid + '_' + mk) || null;
function payrollFor(sid, mk) { let p = payrollDoc(sid, mk); if (!p) { p = { id: sid + '_' + mk, staffId: sid, month: mk, bonus: [], deductions: [], paid: null }; S.payroll.push(p); } p.bonus = p.bonus || []; p.deductions = p.deductions || []; return p; }

// the days each person did something in the POS, within [from, to]
function activityDays(from, to) {
  const out = {};
  S.staff.forEach((s) => { out[s.id] = {}; });
  const hit = (id, name, iso) => {
    if (!iso) return; const d = localDate(iso); if (d < from || d > to) return;
    const s = staffFor({ id: id || '', name: name || '' });
    if (s && out[s.id]) out[s.id][d] = 1;
  };
  S.orders.forEach((o) => { o.events.forEach((e) => hit(e.byId, e.by, e.at)); o.payments.forEach((p) => hit(p.byId, p.by, p.at)); });
  S.expenses.forEach((e) => { hit(e.createdBy, e.createdByName, e.createdAt); (e.log || []).forEach((l) => hit(l.byId, l.by, l.at)); });
  S.closures.forEach((c) => hit(c.byId, c.by, c.at));
  S.attendance.forEach((a) => { if (a.seen && out[a.staffId] && a.date >= from && a.date <= to) out[a.staffId][a.date] = 1; });
  return out;
}
function dayStatus(s, ds, act) {
  const a = attDoc(s.id, ds);
  if (a && a.mark && ATT[a.mark]) return a.mark;
  const T = todayStr();
  if (ds > T) return 'future';
  // by the clock: clocked in = worked; work done without clocking in is flagged (11f-clock.js), never absent
  if (typeof isClockDay === 'function' && isClockDay(ds)) {
    if (a && a.in) return 'present';
    if (offDaysOf(s).indexOf(weekday(ds)) >= 0) return 'off';
    if (act && act[ds]) return 'present';
    return ds === T ? 'pending' : 'absent';
  }
  if (act && act[ds]) return 'present';
  const start = S.settings.attFrom || '';
  if (!start || ds < start) return 'untracked';
  if (offDaysOf(s).indexOf(weekday(ds)) >= 0) return 'off';
  return ds === T ? 'pending' : 'absent';
}
// signing in counts as being at the shop that day
function attSeen(sid) {
  if (!isWorker(findStaff(sid))) return; // the owner is not counted
  const T = todayStr(); let a = attDoc(sid, T);
  // a shop that switched sign-in on before attendance existed starts counting from the first day anyone signed in
  if (!S.settings.attFrom && !S.settings.attOff) { const first = S.attendance.filter((x) => x.seen).map((x) => x.date).sort()[0]; S.settings.attFrom = first && first < T ? first : T; save(); }
  if (a && a.seen) return;
  if (!a) { a = { id: sid + '_' + T, staffId: sid, date: T, mark: '' }; S.attendance.push(a); }
  a.seen = nowISO(); save();
}

// one person's salary for a month (from the paid snapshot once it has been paid)
function salaryFor(s, mk, act) {
  const days = monthDays(mk);
  if (!act) act = activityDays(days[0], days[days.length - 1])[s.id] || {};
  const pay = s.pay || {};
  const monthly = round2(num(pay.monthly)), rate = round2(monthly / 30);
  const count = { present: 0, off: 0, leave: 0, absent: 0, untracked: 0, pending: 0, future: 0 };
  const list = days.map((ds) => { const st = dayStatus(s, ds, act); count[st]++; return { ds: ds, st: st }; });
  const pr = payrollDoc(s.id, mk) || { bonus: [], deductions: [], paid: null };
  const line = (x) => ({ id: x.id, label: x.label || '—', amount: round2(num(x.amount)) });
  const allowances = (pay.allowances || []).filter((x) => num(x.amount)).map(line);
  const bonus = (pr.bonus || []).map(line), deductions = (pr.deductions || []).map(line);
  const advances = S.expenses.filter((e) => e.kind === 'advance' && e.staffId === s.id && e.date >= days[0] && e.date <= days[days.length - 1])
    .map((e) => ({ id: e.id, label: 'Advance · ' + fmtDay(e.date) + (e.memo ? ' · ' + e.memo : ''), amount: round2(num(e.amount)) }));
  const sum = (l) => round2(l.reduce((t, x) => t + x.amount, 0));
  const absentDed = round2(count.absent * rate);
  // arriving late and leaving early, by the clock: hours × (monthly ÷ 30 ÷ working hours)
  const lt = lateFor(s, days, act), H = shopHours();
  const hourly = H.workH ? monthly / 30 / H.workH : 0, lateDed = round2(lt.hours * hourly);
  const c = { mk: mk, monthly: monthly, rate: rate, count: count, absentDed: absentDed, allowances: allowances, bonus: bonus, advances: advances, deductions: deductions,
    late: lt.hours, lateDays: lt.list.length, hourly: round2(hourly), workH: H.workH, lateDed: lateDed, lateList: lt.list, flags: lt.flags,
    add: round2(sum(allowances) + sum(bonus)), less: round2(absentDed + lateDed + sum(advances) + sum(deductions)) };
  c.net = round2(monthly + c.add - c.less);
  const live = Object.assign({ s: s, days: list, pr: pr, paid: pr.paid || null, snapshot: false }, c);
  if (pr.paid && pr.paid.slip) return Object.assign(live, pr.paid.slip, { s: s, days: list, pr: pr, paid: pr.paid, snapshot: true });
  return live;
}

// ----- the salary slip: printed, or sent on WhatsApp -----
function slipLines(c) {
  const out = [];
  const sec = (title, list, sign) => { if (!list.length) return; out.push({ h: title }); list.forEach((x) => out.push({ l: x.label, n: x.amount, sign: sign })); };
  out.push({ l: 'Monthly salary', n: c.monthly, sign: '', b: true });
  out.push({ l: 'Daily rate (monthly ÷ 30)', n: c.rate, sign: '', sm: true });
  out.push({ t: 'Days: worked ' + c.count.present + ' · days off ' + c.count.off + ' · paid leave ' + c.count.leave + ' · absent ' + c.count.absent + (c.count.untracked ? ' · not tracked ' + c.count.untracked : '') });
  if (c.count.absent) out.push({ l: 'Absent ' + c.count.absent + ' day' + (c.count.absent > 1 ? 's' : '') + ' × ' + money2(c.rate), n: c.absentDed, sign: '-', ab: true });
  if (c.lateDed) out.push({ l: 'Late / left early ' + num(c.late) + ' h (' + c.lateDays + ' day' + (c.lateDays > 1 ? 's' : '') + ') × ' + money2(c.hourly), n: c.lateDed, sign: '-', ab: true });
  sec('Allowances', c.allowances, '+'); sec('Bonus / overtime', c.bonus, '+'); sec('Advances', c.advances, '-'); sec('Other deductions', c.deductions, '-');
  return out;
}
function slipSpec(c) {
  const s = c.s;
  const rows = shopHead().concat([tk.sep(), tk.c('SALARY SLIP', 'n', true), tk.r('Name', s.name, 'n', true), tk.r('Job', s.role || (ACCESS[s.access] || {}).label || ''), tk.r('Month', fmtMonthLong(c.mk)), tk.sep()]);
  slipLines(c).forEach((x) => { if (x.h) rows.push(tk.l(x.h.toUpperCase(), 'sm', true)); else if (x.t) rows.push(tk.l(x.t, 'sm')); else rows.push(tk.r(x.l, x.sign + money2(x.n), x.sm ? 'sm' : 'n', !!x.b, !x.b && !x.sm && !x.ab)); });
  rows.push(tk.sep(), tk.r('NET PAY', S.settings.currency + ' ' + money2(c.net), 'lg', true));
  if (c.paid) rows.push(tk.r('Paid', fmtDay(localDate(c.paid.at), true) + ' · ' + (c.paid.from === 'cash' ? 'cash' : 'other'), 'sm'));
  rows.push(tk.sep(), tk.r('Employee', '______________', 'sm'), tk.r('For the shop', '______________', 'sm'));
  return rows;
}
function slipText(c) {
  return ['Salary slip · ' + fmtMonthLong(c.mk) + ' · ' + (S.settings.shopName || ''), 'Name: ' + c.s.name, '']
    .concat(slipLines(c).map((x) => (x.h ? '\n' + x.h + ':' : x.t ? x.t : x.l + ': ' + (x.sign === '-' ? '−' : x.sign) + money(x.n))))
    .concat(['', '*Net pay: ' + money(c.net) + '*']).concat(c.paid ? ['Paid on ' + fmtDay(localDate(c.paid.at), true)] : []).join('\n');
}

}

// ===== 11f-clock.js =====
// ---------- Clocking in and out; shop hours; pay lost for arriving late or leaving early ----------
// Staff clock in when they arrive and out when they leave, on a shop device, with their PIN. From the day clocking is
// switched on (Settings → Hours & attendance) a working day is counted from the clock:
//  - no clock-in on a working day is absent (unless it is marked leave); the weekly day off is paid;
//  - arriving after opening or leaving before closing costs pay: every 15 minutes or part costs 1 hour, so one
//    minute late costs an hour; more than 2 hours costs the whole day; late and early on the same day add up, at
//    most one day's pay; an hour is the monthly salary ÷ 30 ÷ the working hours (closing − opening − break);
//  - a grace time (one for arriving, one for leaving) costs nothing; past it, the time counts from opening / closing;
//  - a day with no clock-out is flagged and counted as leaving at closing until it is fixed; a day with work done in
//    the POS but no clock-in is flagged instead of counted absent.
// The owner or a partner (anyone allowed to change attendance) can correct the times, each change recorded, and
// excuse a day. Every number above is a setting of the shop.
const HOURS0 = { open: '10:00', close: '22:00', breakMin: 120, graceIn: 0, graceOut: 0, stepMin: 15, stepHours: 1, fullDayMin: 120, from: '' };
const hm2min = (t) => { const x = /^(\d{1,2}):(\d{2})/.exec(String(t || '').trim()); return x ? Math.min(1439, +x[1] * 60 + +x[2]) : 0; };
function shopHours() {
  const h = Object.assign({}, HOURS0, (S.settings && S.settings.hours) || {});
  h.openMin = hm2min(h.open); h.closeMin = hm2min(h.close);
  h.breakMin = Math.max(0, num(h.breakMin));
  h.workMin = Math.max(60, h.closeMin - h.openMin - h.breakMin);
  h.workH = round2(h.workMin / 60);
  h.stepMin = Math.max(1, num(h.stepMin) || 15); h.stepHours = Math.max(0, num(h.stepHours));
  h.fullDayMin = Math.max(0, num(h.fullDayMin)); h.graceIn = Math.max(0, num(h.graceIn)); h.graceOut = Math.max(0, num(h.graceOut));
  return h;
}
const hoursOf = () => (S.settings.hours = S.settings.hours && typeof S.settings.hours === 'object' ? S.settings.hours : {});
const clockFrom = () => ((S.settings && S.settings.hours) || {}).from || '';
const clockOn = () => !!clockFrom();
const isClockDay = (ds) => clockOn() && ds >= clockFrom();
const minOfDay = (iso) => { const d = new Date(iso); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const nowMin = () => minOfDay(new Date().toISOString());
const hmOf = (iso) => (iso ? fmtHM(new Date(iso)) : '');
const fmtH = (h) => { const v = Math.round(h * 100) / 100; return v + (v === 1 ? ' hour' : ' hours'); };
const fmtMins = (m) => (m >= 60 ? Math.floor(m / 60) + ' h ' + pad2(m % 60) + ' min' : m + (m === 1 ? ' minute' : ' minutes'));

// hours of pay lost for minutes late (or early): nothing within the grace time; past it every 15 minutes or part
// costs stepHours, counted from opening (closing); more than the full-day limit costs the whole day
function lostHours(min, grace, H) {
  min = Math.floor(min);
  if (min <= 0 || min <= grace) return 0;
  if (H.fullDayMin > 0 && min > H.fullDayMin) return H.workH;
  return Math.min(H.workH, Math.ceil(min / H.stepMin) * H.stepHours);
}
// one person's day by the clock: the times, minutes late and early, pay lost (hours), and what needs a look
function clockDay(s, ds, act) {
  const a = attDoc(s.id, ds), st = dayStatus(s, ds, act);
  const r = { ds: ds, st: st, a: a, in: (a && a.in) || '', out: (a && a.out) || '', lateMin: 0, earlyMin: 0, lateH: 0, earlyH: 0, hours: 0, flag: '', excused: !!(a && a.excused), dayOff: false };
  if (!isClockDay(ds) || st !== 'present') return r;
  if (!r.in) { if (!(a && a.mark)) r.flag = 'noclock'; return r; }
  if (offDaysOf(s).indexOf(weekday(ds)) >= 0 && !(a && a.mark)) { r.dayOff = true; return r; } // came in on the day off
  const H = shopHours();
  if (localDate(r.in) === ds) r.lateMin = Math.max(0, Math.floor(minOfDay(r.in) - H.openMin));
  if (r.out) { if (localDate(r.out) === ds && r.out > r.in) r.earlyMin = Math.max(0, Math.floor(H.closeMin - minOfDay(r.out))); }
  else if (ds < todayStr() || nowMin() > H.closeMin + 60) r.flag = 'noout'; // counted as leaving at closing until fixed
  r.lateH = lostHours(r.lateMin, H.graceIn, H); r.earlyH = lostHours(r.earlyMin, H.graceOut, H);
  r.hours = r.excused ? 0 : Math.min(H.workH, r.lateH + r.earlyH);
  return r;
}
// a month (or any days): the hours of pay lost, the days they came from, and the days to check
function lateFor(s, days, act) {
  let hours = 0; const list = [], flags = [];
  days.forEach((ds) => { const r = clockDay(s, ds, act); if (r.hours > 0) { hours += r.hours; list.push(r); } if (r.flag) flags.push(r); });
  return { hours: round2(hours), list: list, flags: flags };
}
// what the clock says about a day, in a few words
function clockNote(r) {
  if (r.flag === 'noclock') return 'Worked without clocking in — not counted absent; enter the times or mark the day';
  if (!r.in) return '';
  const parts = [];
  if (r.dayOff) return 'Came in on the weekly day off — nothing is deducted';
  if (r.lateMin > 0) parts.push(fmtMins(r.lateMin) + ' late' + (r.lateH ? ' → ' + fmtH(r.lateH) : ' (within the grace time)'));
  if (r.earlyMin > 0) parts.push('left ' + fmtMins(r.earlyMin) + ' early' + (r.earlyH ? ' → ' + fmtH(r.earlyH) : ' (within the grace time)'));
  if (r.flag === 'noout') parts.push('no clock-out: counted as leaving at closing');
  if (r.excused && (r.lateH || r.earlyH)) parts.push('excused');
  return parts.length ? parts.join(' · ') : 'On time';
}

// ----- clocking: this device's clock screen (anyone with a PIN, signed in or not) -----
const Clock = { open: false, picking: '', pin: '', err: '', fails: 0, until: 0, done: null, timer: null };
const clockers = () => S.staff.filter((s) => isWorker(s) && s.pinHash);
function clockState(s) {
  const a = attDoc(s.id, todayStr());
  return !a || !a.in ? 'Not in yet' : a.out ? 'Out at ' + hmOf(a.out) : 'In since ' + hmOf(a.in);
}
// in, out, or back in after clocking out by mistake (the clock-out is cancelled)
function clockNow(s) {
  const T = todayStr(), at = nowISO();
  let a = attDoc(s.id, T);
  if (!a) { a = { id: s.id + '_' + T, staffId: s.id, date: T, mark: '' }; S.attendance.push(a); }
  a.log = Array.isArray(a.log) ? a.log : [];
  let kind;
  if (!a.in) { a.in = at; kind = 'in'; a.log.unshift({ at: at, by: s.name, byId: s.id, text: 'Clocked in' }); }
  else if (!a.out) { a.out = at; kind = 'out'; a.log.unshift({ at: at, by: s.name, byId: s.id, text: 'Clocked out' }); }

  async out(specs, opts) {
    // the printer helper may have started after the app (the PC was just switched on): ask it once more
    if (!Remote.canPrint() && Helper.on && !Helper.ok) await Helper.connect(1500);
    if (Remote.canPrint()) {
      try {
        await printFonts();
        for (const sp of specs) await Remote.printPNG(await canvasPNG(specCanvas(sp, num(Remote.printerCfg().width) || 576)), opts);
        toast(specs.length > 1 ? specs.length + ' tickets sent to the printer' : 'Sent to the printer');
        return true;
      } catch (e) {
        const where = Remote.kind === 'pc' ? 'is connected to the shop PC' : 'is connected to this PC, and that the printer helper is running';
        Modal.open({ title: 'Printer problem', render: () => '<div>' + esc(e.message) + '</div><div class="small muted">Check the printer is on, has paper, ' + where + '. Printer settings are under Settings → Printer &amp; devices.</div>', footer: () => '<button type="button" class="btn" data-act="modal:close">Close</button><button type="button" class="btn dark" data-act="modal:ok">Use the browser print dialog</button>', onOk: () => { Modal.close(); Print.browser(specs); } });
        return false;
      }
    }
    // a Claude page can't open the print dialog: show the tickets and offer them as an image
    if (inClaudeFrame()) { this.preview(specs, opts); return true; }
    this.browser(specs);
    return true;
  },
  preview(specs, opts) {
    const name = ((opts && opts.name) || 'ticket').replace(/[^A-Za-z0-9_.-]+/g, '-');
    Modal.open({
      title: specs.length > 1 ? specs.length + ' tickets' : 'Ticket',
      render: () => '<div class="tk-prev">' + specs.map((sp) => '<div class="tk-paper">' + specHTML(sp) + '</div>').join('') + '</div>' +
        '<div class="small muted">Printing straight to the receipt printer comes with the PC program. For now, download the ticket as an image.</div>',
      footer: () => '<button type="button" class="btn" data-act="modal:close">Close</button><button type="button" class="btn dark" data-act="modal:ok">' + ico('download') + '<span>Download image</span></button>',
      onOk: async () => {
        await printFonts();
        const parts = specs.map((sp) => specCanvas(sp, 576));
        const gap = 40;
        const cv = document.createElement('canvas');
        cv.width = 576; cv.height = parts.reduce((h, c) => h + c.height, 0) + gap * (parts.length - 1);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
        let y = 0;
        parts.forEach((c, i) => {
          ctx.drawImage(c, 0, y); y += c.height;
          if (i < parts.length - 1) { ctx.setLineDash([8, 8]); ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(0, y + gap / 2); ctx.lineTo(576, y + gap / 2); ctx.stroke(); ctx.setLineDash([]); y += gap; }
        });
        const ok = await downloadText(name + '.png', await canvasPNG(cv), 'image/png');
        if (ok) { Modal.close(); toast('Image downloaded'); }
      }
    });
  },
  browser(specs) {
    const p = $('#print'); if (!p) return;
    p.innerHTML = specs.map(specHTML).join('<div class="cut"></div>');
    setTimeout(() => { try { window.print(); } catch (e) { console.warn(e); } }, 60);
  }
};
window.addEventListener('afterprint', () => { const p = $('#print'); if (p) p.innerHTML = ''; });

// When sign-in is on and the person's role doesn't allow an action, an admin can approve it once with their PIN.
const ACTION_PERMS = {
  'order:edit': ['edit', 'Edit an order'], 'order:due': ['edit', 'Change the ready date'], 'draft:task-price': ['edit', 'Change a price'],
  'order:done': ['done', 'Mark an order done'], 'bulk:done': ['done', 'Mark orders done'], 'order:undo-done': ['done', 'Mark an order not done'],
  'order:collect': ['collect', 'Hand over an order'], 'bulk:collect': ['collect', 'Hand over orders'], 'order:pay': ['collect', 'Take a payment'], 'pay:onaccount': ['collect', 'Hand over on account'], 'order:undo-collect': ['collect', 'Undo a collection'], 'draft:pay': ['collect', 'Take a payment'],
  'draft:discount': ['discount', 'Give a discount'], 'disc:preset': ['discount', 'Give a discount'],
  'order:void': ['void', 'Void an order'], 'order:delete': ['delete', 'Delete an order'], 'order:restore': ['void', 'Restore a voided order'],
  'order:dup': ['new', 'Start a new order'], 'customer:neworder': ['new', 'Start a new order'],
  'customer:new': ['customers', 'Add a customer'], 'customer:edit': ['customers', 'Edit a customer'],
  'cash:collect': ['cashclose', 'Collect the cash'], 'cash:del': ['cashclose', 'Delete a cash collection'],
  'exp:edit': ['expense', 'Change an expense'], 'exp:delete': ['expense', 'Delete an expense'], 'exp:approve': ['expense', 'Approve a change to an expense'], 'exp:reject': ['expense', 'Turn down a change to an expense'],
  'att:pick': ['money', 'Change attendance'], 'pay:paid': ['money', 'Pay a salary'], 'pay:undo': ['money', 'Undo a salary payment'], 'pay:advance': ['money', 'Give an advance'], 'pay:bonus': ['money', 'Add a bonus'], 'pay:deduct': ['money', 'Add a deduction'],
  'pay:rm-bonus': ['money', 'Change a salary'], 'pay:rm-advance': ['expense', 'Remove an advance'], 'pay:rm-deduct': ['money', 'Change a salary'], 'pay:off': ['money', 'Change a salary'], 'pay:allow-add': ['money', 'Change a salary'], 'pay:allow-rm': ['money', 'Change a salary'],
  'backup:sample': ['settings', 'Load sample data'], 'backup:reset': ['settings', 'Delete everything']
};
Object.keys(ACTION_PERMS).forEach((k) => {
  const fn = Actions[k]; if (!fn) return;
  const perm = ACTION_PERMS[k][0], what = ACTION_PERMS[k][1];
  Actions[k] = (d, el, e) => Auth.need(perm, what, () => fn(d, el, e));
});
const CHANGE_PERMS = { 'pay:monthly': 'money', 'pay:allow': 'money', 'pay:phone': 'money', 'att:from': 'money', 'att:time': 'money', 'att:excuse': 'money', 'hours:on': 'settings', 'hours:from': 'settings', 'hours:set': 'settings' };
Object.keys(CHANGE_PERMS).forEach((k) => {
  const fn = Changes[k]; if (!fn) return;
  Changes[k] = (el) => { if (Auth.can(CHANGE_PERMS[k])) return fn(el); toast('Your role can’t change this — ask an admin'); rerender(); };
});

// ===== 13-main.js =====
// ---------- boot ----------
async function init() {
  $('#app').innerHTML = '<div class="boot">Loading…</div>';
  let shared = false;
  if (await Remote.detect()) {
    try { await Remote.start(); shared = true; }
    catch (e) {
      console.warn('shared data not usable', e);
      if (Remote.kind === 'cloud' && (Cloud.fire || Cloud.supa)) { Cloud.problemScreen(e); return; } // never fall back to a separate local copy
      if (Remote.kind === 'cloud') setTimeout(() => toast('Online data could not be loaded — working on this device only. Reload to try again.'), 300);
      Remote.on = false; Remote.kind = '';
    }
  }
  if (!shared) {
    let loaded = null;
    try { loaded = await Store.get(); } catch (e) { loaded = null; }
    S = migrate(loaded);
    if (!loaded) save();
  }
  Auth.restore(); // stay signed in on this device unless it was idle too long
  parseHash();
  render();
  // online version on the shop PC: the printer helper, when this device uses it
  if (shared) Helper.start().then((ok) => { if (ok && UI.view === 'settings') rerender(); });
  if (Remote.on && Remote.kind === 'pc' && !Remote.online) toast('Could not reach the shop PC');
  window.addEventListener('beforeunload', () => { if (saveTimer) save(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) save(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
