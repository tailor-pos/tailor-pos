  // ----- sending this device's changes -----
  ops() {
    const out = [];
    this.DOCS.forEach((dn) => {
      if (this.snap.docs[dn] === undefined && !this.setupOk) return; // not seen the server's copy yet
      const js = canon(this.docValue(dn));
      if (js !== this.snap.docs[dn]) out.push({ path: 'app/' + dn, body: { value: JSON.parse(js) }, done: () => { this.snap.docs[dn] = js; } });
    });
    const ids = {};
    S.catalogue.forEach((g) => {
      if (!SEG_OK.test(String(g.id))) return;
      ids[g.id] = 1;
      const im = g.image || null;
      if (im === (this.snap.photos[g.id] || null)) return;
      out.push(im ? { path: 'photos/' + g.id, body: { image: im }, done: () => { this.snap.photos[g.id] = im; } }

    Object.keys(this.snap.photos).forEach((gid) => { if (!ids[gid]) out.push({ path: 'photos/' + gid, del: true, done: () => { delete this.snap.photos[gid]; } }); });

  // comparing every record is costly with a year of orders, so it only runs after this device changed something or a send failed

  async run(ops) {
    const db = this.db;

    if (this.fire) {
      // the write lands in the offline cache straight away and syncs on its own; only report failures
      ops.forEach((op) => {

  },
  writeFailed(e, op) {

    else if (c === 'invalid-argument') toast('Could not save one ' + op.path.split('/')[0].replace(/s$/, '') + ' — it is too large (try a smaller photo)');
    else if (c === 'resource-exhausted') { if (!this.quotaWarned) { this.quotaWarned = true; toast('Today\'s free database limit is used up — changes are kept and saved later'); } }

  push() {

    // online with Supabase: everything not sent yet is kept on the device first, also while a send is still running
    const ops = this.supa ? this.keep() : null;

    this.pushing = (async () => {
      try {
        this.touched = false;

          await Supa.ensureSession(); // never send as nobody (a login that could not be renewed without internet)
        }

        const list = ops && !numbered ? ops : this.ops();
        if (numbered && this.supa) this.keep(list); // the new orders' numbers are kept too, before they are sent

  async flush() { for (let i = 0; i < 5; i++) { if (this.pushing) await this.pushing; else if (this.dirty()) await this.push(); else break; } },

  // ----- order numbers: reserved one at a time through a short lock on meta/counter -----
  async lease(ref) {
    for (let i = 0; i < 24; i++) {
      let r;

      catch (e) { if (e && (e.code === 'capability_removed' || e.code === 'invalid_argument')) return; throw e; }
      if (r && r.acquired) return;

  async assignNumbers() {
    const prov = S.orders.filter((o) => o._prov);
    const userNext = num(S.settings.nextOrderNo) !== this.counterNext ? Math.max(1, Math.round(num(S.settings.nextOrderNo))) : 0;
    if (!prov.length && !userNext) return false;
    if (this.fire) return this.fireNumbers(prov, userNext);
    if (this.supa) return this.supaNumbers(prov, userNext);
    const ref = this.db.doc('meta/counter');
    await this.lease(ref);
    const cur = await this.retry(() => ref.get());
    let next = userNext || (cur.exists && num((cur.data() || {}).next)) || num(S.settings.nextOrderNo) || 1001;
    const prefix = S.settings.orderPrefix || '';

    if (prov.length) {
      let maxEx = 0;
      S.orders.forEach((o) => {
        if (o._prov) return;
        const s = String(o.no || '');
        if (s.indexOf(prefix) === 0 && /^\d+$/.test(s.slice(prefix.length))) maxEx = Math.max(maxEx, +s.slice(prefix.length));

      next = Math.max(next, maxEx + 1);
      prov.slice().sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1)).forEach((o) => { plan.push([o, prefix + next]); next++; });
    }
    await this.retry(() => ref.set({ next: next }));
    plan.forEach(([o, no]) => { o.no = no; delete o._prov; });
    this.counterNext = next; S.settings.nextOrderNo = next;
    if (plan.length) Remote.pendingUI = true;
    return true;
  },

  // Supabase: the database hands out a range of numbers in one step, so two devices never get the same one
  async supaNumbers(prov, userNext) {
    if (userNext) { await Supa.setNext(userNext); this.counterNext = userNext; }
    if (prov.length) {
      const prefix = S.settings.orderPrefix || '';
      let maxEx = 0;
      S.orders.forEach((o) => {
        if (o._prov) return;
        const s = String(o.no || '');
        if (s.indexOf(prefix) === 0 && /^\d+$/.test(s.slice(prefix.length))) maxEx = Math.max(maxEx, +s.slice(prefix.length));
      });
      const first = await Supa.numbers(prov.length, maxEx + 1);
      const moved = [];
      prov.slice().sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1)).forEach((o, i) => {
        const old = o.no, no = prefix + (first + i);
        // a temporary number that was shown (or printed) a while, or made without internet, and is no longer free
        // (another device used it meanwhile); a number changed within moments of saving is not worth a note
        const seen = this.offIds[o.id] || Date.now() - (Date.parse(o.createdAt) || Date.now()) > 20000;
        o.no = no; delete o._prov; delete this.offIds[o.id];
        if (old && old !== no && seen) { logEvent(o, 'Order number changed from ' + old + ' to ' + no + ' when it was saved online (' + old + ' was no longer free)'); moved.push([old, no]); }
      });

      if (moved.length === 1) this.moved = 'Order ' + moved[0][0] + ' is now ' + moved[0][1] + ': ' + moved[0][0] + ' was no longer free when it was saved online';
      else if (moved.length) this.moved = moved.length + ' orders got new numbers when they were saved online (' + moved.map((m) => m[0] + ' → ' + m[1]).join(', ') + ')';

  // Firestore: one transaction reads the counter and the waiting orders, so two devices can never
  // hand out the same number. Any signed-in device may number any order still waiting for one.
  async fireNumbers(prov, userNext) {
    if (!Remote.online) return false; // numbers are given out once the device is back online
    const db = this.db;
    const synced = await Promise.race([db.waitForPendingWrites().then(() => true), sleep(8000).then(() => false)]);
    if (!synced) return false;
    const counterRef = db.doc('meta/counter');
    const prefix = S.settings.orderPrefix || '';
    let maxEx = 0;
    S.orders.forEach((o) => {
      if (o._prov) return;
      const s = String(o.no || '');
      if (s.indexOf(prefix) === 0 && /^\d+$/.test(s.slice(prefix.length))) maxEx = Math.max(maxEx, +s.slice(prefix.length));
    });

      const c = await tx.get(counterRef);

      let next = userNext || (c.exists && num((c.data() || {}).next)) || num(S.settings.nextOrderNo) || 1001;

      if (list.length) {
        next = Math.max(next, maxEx + 1);
        list.forEach((o, i) => {
          const s = snaps[i];
          if (s.exists && (s.data() || {})._prov !== true) return; // another device numbered it already
          const no = prefix + next; next++;
          const body = JSON.parse(canon(Object.assign({}, o, { no: no })));
          delete body._prov;
          tx.set(db.doc('orders/' + o.id), body);
          plan.push([o, no, canon(body)]);
        });
      }
      tx.set(counterRef, { next: next });
      return { plan: plan, next: next };
    });
    out.plan.forEach(([o, no, js]) => {
      const old = o.no;
      o.no = no; delete o._prov;
      this.snap.cols.orders[o.id] = js;
      if (old !== no) logEvent(o, 'Order number changed from ' + old + ' to ' + no + ' (' + old + ' was taken on another device)');

  },

  // ----- Supabase: what is not sent yet, kept on the device (IndexedDB) until it is -----

  // on top of the device's copy (replay) and sends them. Written after each change, one write at a time.
  keep(ops) {
    if (!this.supa || !this.snap || !Supa.shop || Supa.lost) return ops || null;
    ops = ops || this.ops();
    const list = ops.map((op) => (op.del ? { path: op.path, del: true } : { path: op.path, body: op.body }));
    const prov = S.orders.filter((o) => o._prov).map((o) => clone(o));
    if (!Remote.online) prov.forEach((o) => { this.offIds[o.id] = 1; }); // made without internet: its number may change
    const next = num(S.settings.nextOrderNo) !== this.counterNext ? Math.max(1, Math.round(num(S.settings.nextOrderNo))) : 0;
    const p = list.length || prov.length || next ? { v: 1, at: Date.now(), ops: list, prov: prov, next: next } : null;
    const js = p ? JSON.stringify([list, prov, next]) : '';
    const n = p ? list.length + prov.length + (next ? 1 : 0) : 0;

    if (js !== this.keptJs) {

      const write = () => Supa.keepPending(p);

    return ops;
  },
  replay(p) {
    const docs = {}, photos = {};
    let n = 0;
    (p.ops || []).forEach((op) => {
      const i = String(op.path).indexOf('/'), c = op.path.slice(0, i), id = op.path.slice(i + 1);
      if (!id) return;
      if (c === 'app') { if (this.DOCS.indexOf(id) >= 0 && !op.del && op.body && op.body.value !== undefined) { docs[id] = clone(op.body.value); n++; } return; }
      if (c === 'photos') { photos[id] = op.del ? null : ((op.body || {}).image || null); n++; return; }
      if (this.COLS.indexOf(c) < 0) return;
      const at = S[c].findIndex((x) => x.id === id);
      if (op.del) { if (at >= 0) S[c].splice(at, 1); }
      else if (op.body && typeof op.body === 'object') { if (at >= 0) S[c][at] = clone(op.body); else S[c].push(clone(op.body)); }
      n++;
    });
    if (docs.settings) { const next = S.settings.nextOrderNo; Remote.replaceDoc('settings', Object.assign(defaultSettings(), docs.settings)); S.settings.nextOrderNo = next; S.settings.orderPrefix = Supa.shop.letter + '-'; }
    if (docs.staff && Array.isArray(docs.staff)) { fixStaff(docs.staff); Remote.replaceDoc('staff', docs.staff); }
    if (docs.catalogue && Array.isArray(docs.catalogue)) {
      docs.catalogue.forEach((g) => { g.tasks = g.tasks || []; g.tasks.forEach((t) => { t.variants = t.variants || []; }); g.image = this.snap.photos[g.id] || null; });
      Remote.replaceDoc('catalogue', docs.catalogue);
    }
    Object.keys(photos).forEach((gid) => { const g = findCat(gid); if (g) g.image = photos[gid]; });
    (p.prov || []).forEach((o) => { if (o && o.id && !S.orders.some((x) => x.id === o.id)) { const r = clone(o); r._prov = true; S.orders.push(r); this.offIds[r.id] = 1; n++; } });

  // ----- replace everything (restore a backup / delete everything) -----
  async restore(state) {
    if (this.pushing) await this.pushing;

    try {
      const db = this.db;
      const next = migrate(clone(state));
      // into a shop with a letter: its plain order numbers get the letter in front (647 → N-647)
      if (this.supa) {
        const prefix = Supa.shop.letter + '-';
        let top = 0;
        next.orders.forEach((o) => { if (/^\d+$/.test(String(o.no))) { top = Math.max(top, +o.no); o.no = prefix + o.no; } });
        next.settings.orderPrefix = prefix;
        next.settings.nextOrderNo = Math.max(num(next.settings.nextOrderNo) || 1001, top + 1);
      }
      const existing = [];
      for (const c of this.COLS.concat(['photos'])) {
        const q = await this.retry(() => db.collection(c).get());
        q.docs.forEach((d) => existing.push(c + '/' + d.id));
      }
      this.DOCS.forEach((dn) => Remote.replaceDoc(dn, next[dn]));
      this.COLS.forEach((c) => { S[c].splice(0, S[c].length, ...next[c]); });
      const keep = {};
      this.COLS.forEach((c) => S[c].forEach((r) => { keep[c + '/' + r.id] = 1; }));
      S.catalogue.forEach((g) => { if (g.image) keep['photos/' + g.id] = 1; });

      this.COLS.forEach((c) => { this.snap.cols[c] = {}; });
      await this.run(existing.filter((p) => !keep[p]).map((p) => ({ path: p, del: true, done: () => {} })));
      this.counterNext = num(S.settings.nextOrderNo) || 1001;
      this.setupOk = true;
      if (this.fire) db.doc('meta/counter').set({ next: this.counterNext }).catch((e) => this.writeFailed(e, { path: 'meta/counter' }));
      else await this.retry(() => db.doc('meta/counter').set({ next: this.counterNext }));
      await this.run(this.ops());
      if (this.supa) this.keep([]); // nothing from before the restore is waiting any more
      if (!this.fire) Remote.setOnline(true);
    } finally { this.restoring = false; }
  },

// ===== 01d-supa.js =====
// ---------- online mode 'supa': every shop in one Supabase database ----------
// The website build with window.TAILORPOS_SUPABASE = { url, key, title }. People sign in with their own
// email login; the database itself lets each login open only the shops it was given (supabase/setup.sql).
// One shop is open at a time. Its records are the same documents the other online modes keep (orders,
// customers, app/settings…), one row each in the 'docs' table; Cloud runs on top through the small
// document interface below. Changes arrive live (Realtime) and every 30 s a catch-up fills any gap.
// A login with several shops also sees them all together (All shops, 05c-view-shops.js): the other shops' records
// are fetched for that page only (peek) and never mixed into the open shop.
// Each device keeps its own copy of the shops it opens (LocalCopy): opening the app reads the copy and fetches only
// what changed online since, instead of every record each time.
// Without internet: a device that has opened its shop before opens from that copy (the login, the list of shops, the
// owner's and partners' names and the order counter are kept with it). Changes not sent yet are kept on the device too
// (Cloud.keepPending), so closing or reloading the app loses nothing; they are sent when the internet is back.

// ---------- this device's copy of a shop's records ----------
// Quicker on a phone, and the free plan's monthly downloads stay small however many orders pile up. Every few days a
// device fetches everything again anyway, so a copy can never drift for long. Signing out wipes every copy; a shop
// this login can no longer open is wiped at the next start. Without storage (private browsing…) the app works as before.
const LocalCopy = {
  NAME: 'tailorpos-copy', STORE: 'shops', FULL_EVERY: 3 * 86400000, dbp: null,
  open() {
    if (!this.dbp) this.dbp = new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.NAME, 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore(this.STORE); } catch (e) { /* already there */ } };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
        setTimeout(() => resolve(null), 2500); // a browser that never answers: work without a copy
      } catch (e) { resolve(null); }
    });
    return this.dbp;
  },
  async tx(mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise((resolve) => {
      try {
        const t = db.transaction(this.STORE, mode), st = t.objectStore(this.STORE);
        let out = null;
        const r = fn(st);
        if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => resolve(out === undefined ? null : out);
        t.onerror = t.onabort = () => resolve(null);
        setTimeout(() => resolve(out), 5000);
      } catch (e) { resolve(null); }
    });
  },
  get(key) { return this.tx('readonly', (st) => st.get(key)); },
  set(key, val) { return this.tx('readwrite', (st) => st.put(val, key)); },
  del(key) { return this.tx('readwrite', (st) => st.delete(key)); },
  keys() { return this.tx('readonly', (st) => st.getAllKeys()); },
  clear() { return this.tx('readwrite', (st) => st.clear()); },
  // only this login's copies of the shops it can still open stay
  async prune(uid, shopIds) {
    const keys = (await this.keys()) || [];
    await Promise.all(keys.filter((k) => { const p = String(k).split(':'); return p[0] !== uid || shopIds.indexOf(p[2]) < 0; }).map((k) => this.del(k)));
  },
  usable(c) { return !!c && c.v === 1 && Array.isArray(c.rows) && Date.now() - (c.fullAt || 0) < this.FULL_EVERY; }
};

const Supa = {
  sb: null, cfg: null, user: null, shops: [], shop: null, members: [],
  rows: {}, cursor: 0, subs: [], counterCb: null, ch: null, live: false, catching: false, catchAgain: false, timer: null,
  peeks: {}, peekTimer: null, offline: false, peopleOk: false, copyPeople: null, copyCounter: 0,
  AUTH_KEY: 'tailorpos-auth', SHOPS_KEY: 'tailorpos_shops:',
  SHOP_KEY: 'tailorpos_shop', START_KEY: 'tailorpos_start', OPEN_KEY: 'tailorpos_open', NOTE_KEY: 'tailorpos_note', PAGE: 1000,
  get multi() { return this.shops.length > 1; },
  // the open shop as a shop device (staff PINs) or as its owner / a partner (email login, every right)
  get device() { return !!this.shop && this.shop.role === 'device'; },
  get manager() { return !!this.shop && (this.shop.role === 'owner' || this.shop.role === 'partner'); },
  roleLabel(r) { return r === 'owner' ? 'Owner' : r === 'partner' ? 'Partner' : 'Shop device'; },
  // what this device shows when the app is opened: 'all' (All shops), 'last' (the shop used last) or one shop's id
  startPref() {
    let v = '';
    try { v = localStorage.getItem(this.START_KEY) || ''; } catch (e) { v = ''; }
    return v === 'last' || this.shops.some((x) => x.id === v) ? v : 'all';
  },
  setStartPref(v) { try { localStorage.setItem(this.START_KEY, v); } catch (e) { /* storage blocked */ } },
  key(c, id) { return c + '/' + id; },
  err(e, status) {
    const x = new Error((e && e.message) || 'Could not reach the database');
    const pg = (e && e.code) || '';
    x.code = pg === '42501' ? 'permission-denied' : status === 429 ? 'resource_exhausted'
      : /fetch|network|load failed|timeout/i.test(x.message) || status === 0 || status >= 500 ? 'unavailable' : pg || 'error';
    x.pg = e; return x;
  },
  // a request that never reached the database (no internet, the server unreachable)
  netErr(e) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
    if (!e) return false;
    return e.status === 0 || e.code === 'unavailable' || /fetch|network|timeout|load failed|retryable/i.test(String(e.message || '') + ' ' + String(e.name || ''));
  },
  offlineFirst() { const e = new Error('No internet, and this device has not opened the shop before'); e.code = 'offline-first'; return e; },
  // a request that hangs (Wi-Fi without internet) counts as no internet after a while, so the app still opens
  limit(p, ms) {
    return Promise.race([p, sleep(ms).then(() => { const e = new Error('No answer from the database (timeout)'); e.code = 'unavailable'; throw e; })]);
  },
  // the login kept on this device (the library's own storage), used to open the shop's copy without internet
  keptSession() { try { const s = JSON.parse(localStorage.getItem(this.AUTH_KEY) || 'null'); return s && s.user && s.user.id && s.access_token ? s : null; } catch (e) { return null; } },
  keepShops(list) { try { localStorage.setItem(this.SHOPS_KEY + this.user.id, JSON.stringify(list)); } catch (e) { /* storage blocked */ } },
  keptShops() { try { const l = JSON.parse(localStorage.getItem(this.SHOPS_KEY + this.user.id) || 'null'); return Array.isArray(l) && l.length ? l : null; } catch (e) { return null; } },
  forgetShops() { try { Object.keys(localStorage).forEach((k) => { if (k.indexOf(this.SHOPS_KEY) === 0) localStorage.removeItem(k); }); } catch (e) { /* storage blocked */ } },
  // signed in right now (the library refreshes an old login here; without internet that fails and there is none)
  async authed() { try { const r = await this.sb.auth.getSession(); return !!(r && r.data && r.data.session && r.data.session.access_token); } catch (e) { return false; } },
  // before sending: never send as nobody (a login that could not be refreshed yet counts as no internet)
  async ensureSession() {
    if (await this.authed()) return;
    const e = new Error('No internet'); e.code = this.keptSession() ? 'unavailable' : 'signed-out'; throw e;
  },

  // ----- signing in and choosing the shop -----
  async init() {
    const cfg = this.cfg = window.TAILORPOS_SUPABASE || {};
    if (!window.supabase || typeof window.supabase.createClient !== 'function') { const e = new Error('The app could not load its online parts'); e.code = 'no-sdk'; throw e; }
    this.sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'tailorpos-auth' } });
    // an expired login is renewed online first; without internet that can take a while, so the wait is limited
    // (and skipped when the device knows it has no connection at all)
    let s = null;
    const kept = this.keptSession();
    if (kept && navigator.onLine === false) { s = kept; this.offline = true; }
    else {
      const got = await Promise.race([this.sb.auth.getSession().catch((e) => ({ data: { session: null }, error: e })), sleep(7000).then(() => ({ data: { session: null }, error: { name: 'AuthRetryableFetchError', message: 'timeout' } }))]);
      s = got && got.data && got.data.session;
      if (!s && kept && this.netErr(got && got.error)) { s = kept; this.offline = true; }
    }
    if (!s) { await new Promise((resolve) => this.loginScreen(resolve)); s = (await this.sb.auth.getSession()).data.session; }
    this.user = s.user;
    Cloud.user = { email: s.user.email || '', id: s.user.id };
    this.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && !this.converting) location.reload(); });
    this.boot('Opening your shops…');
    await this.loadShops();
    if (!this.offline) await LocalCopy.prune(this.user.id, this.shops.map((x) => x.id));
    if (!this.shops.length && this.offline) throw this.offlineFirst();
    while (!this.shops.length) await this.firstShop();
    // opening the app (not a reload while working) goes to the start page chosen in Settings; a reload stays where it was
    let fresh = true;
    try { fresh = !sessionStorage.getItem(this.OPEN_KEY); sessionStorage.setItem(this.OPEN_KEY, '1'); } catch (e) { fresh = true; }
    const pref = this.startPref();
    let saved = '';
    try { saved = localStorage.getItem(this.SHOP_KEY) || ''; } catch (e) { saved = ''; }
    if (fresh && this.multi && pref !== 'all' && pref !== 'last') saved = pref;
    this.shop = this.shops.find((x) => x.id === saved) || (this.shops.length === 1 || pref === 'all' ? this.shops[0] : null);
    if (!this.shop) this.shop = await this.chooseShop();
    // changes made in another shop without internet and not sent yet: that shop opens, so they go out first
    const waiting = await this.pendingShops();
    if (waiting.length && waiting.indexOf(this.shop.id) < 0) {
      const w = this.shops.find((x) => waiting.indexOf(x.id) >= 0);
      if (w) { this.shop = w; setTimeout(() => toast(w.name + ' opened: it has changes from without internet still to send', 6000), 900); }
    }
    try { localStorage.setItem(this.SHOP_KEY, this.shop.id); } catch (e) { /* storage blocked */ }

    if (fresh && this.multi && pref === 'all' && (!h || h === 'home')) { try { history.replaceState(null, '', location.pathname + location.search + '#shops'); } catch (e) { location.hash = '#shops'; } }
    // a half-made order belongs to its shop
    Remote.DRAFT_KEY = 'tailorpos_draft_v2_' + this.shop.id;
    // a message from before the reload (a new shop is ready…)
    const note = this.takeNote();
    if (note) setTimeout(() => toast(note), 700);
    this.boot('Loading ' + this.shop.name + '…');
    const me = this.shop.role === 'owner' || this.shop.role === 'partner';
    await Promise.all([this.offline ? Promise.resolve(false) : this.limit(this.loadPeople(), 8000).catch(() => false), this.loadAll()]);
    if (!this.peopleOk && this.copyPeople) this.members = this.copyPeople;
    // the owner and partners work as themselves, with every right in their shop; a shop device uses staff PINs
    if (me) {
      const m = this.members.find((x) => x.user_id === this.user.id) || {};
      Auth.member = { id: 'm_' + this.user.id, name: m.name || (this.user.email || '').split('@')[0] || 'Owner', access: 'admin', member: this.shop.role, email: this.user.email || '' };
    }
    return this.db();
  },
  takeNote() { let n = ''; try { n = sessionStorage.getItem(this.NOTE_KEY) || ''; sessionStorage.removeItem(this.NOTE_KEY); } catch (e) { n = ''; } return n; },
  boot(text) { const b = document.querySelector('#app .boot'); if (b) b.textContent = text; else $('#app').innerHTML = '<div class="boot">' + esc(text) + '</div>'; },
  async loadShops() {

  card(inner) { $('#app').innerHTML = '<div class="login"><div class="login-card">' + '<div class="login-mark" aria-hidden="true">' + ico('scissors') + '</div>' + inner + '</div></div>'; },

      if (e.code === 'permission-denied') { Remote.setOnline(false, 'access withdrawn'); toast('This login no longer has access to ' + this.shop.name + ' — sign in again'); }
      else if (Remote.online) Remote.setOnline(false, e.message);
    } finally {
      this.catching = false;
      if (this.catchAgain) { this.catchAgain = false; setTimeout(() => this.catchUp(), 200); }
    }
  },
  apply(rows) {
    const by = {};
    rows.forEach((r) => {
      const k = this.key(r.coll, r.id), old = this.rows[k];
      const t = Date.parse(r.updated_at || '') || 0;
      if (old && old.t && t && t < old.t) return; // an older copy arriving late
      const same = !!old && old.deleted === !!r.deleted && canon(old.data) === canon(r.data || {});
      this.put(r);
      if (same) return;
      (by[r.coll] || (by[r.coll] = [])).push({ type: r.deleted ? 'removed' : 'modified', doc: { id: r.id, exists: !r.deleted, data: () => clone(r.data || {}) } });
    });
    Object.keys(by).forEach((c) => this.subs.forEach((s) => { if (s.c === c) { try { s.cb({ metadata: { fromCache: false }, docChanges: () => by[c] }); } catch (e) { console.warn(e); } } }));
    if (rows.length) this.saveCopy();
  },

  // ----- the other shops, for the All shops page -----
  // Their records without photos, fetched once and then only what changed since; never mixed into the open shop.
  peek(id) {
    const p = this.peeks[id] || (this.peeks[id] = { rows: {}, cursor: 0, st: null, at: 0, busy: null, err: '' });
    if (!p.busy) p.busy = this.peekLoad(id, p).finally(() => { p.busy = null; });
    return p.busy;
  },
  async peekLoad(id, p) {
    const hadSt = !!p.st;
    try {
      if (!p.tried) {
        p.tried = true;
        const c = await LocalCopy.get(this.copyKey('peek', id));
        if (LocalCopy.usable(c) || (this.offline && c && c.v === 1 && Array.isArray(c.rows))) {
          c.rows.forEach((r) => { p.rows[this.key(r.coll, r.id)] = r; });
          p.cursor = c.cursor || 0; p.fullAt = c.fullAt; p.st = this.stateOf(p.rows); p.from = 'copy'; p.okAt = c.savedAt;
        }
      }
      const full = !p.st, t0 = Date.now();
      let got = [];
      if (full) {
        for (let from = 0; ; from += this.PAGE) {
          const { data, error, status } = await this.sb.from('docs').select('coll,id,data,deleted,updated_at').eq('shop_id', id).neq('coll', 'photos').order('coll').order('id').range(from, from + this.PAGE - 1);
          if (error) throw this.err(error, status);
          got = got.concat(data || []);
          if (!data || data.length < this.PAGE) break;
        }
      } else got = await this.changedSince(id, p.cursor, true);
      p.fetched = got.length;
      let changed = full || !!p.err || !hadSt;
      got.forEach((r) => {
        const k = this.key(r.coll, r.id), old = p.rows[k], t = Date.parse(r.updated_at || '') || 0;
        if (old && old.t && t && t < old.t) return;
        if (t > p.cursor) p.cursor = t;
        if (!old || old.deleted !== !!r.deleted || canon(old.data) !== canon(r.data || {})) changed = true;
        p.rows[k] = { coll: r.coll, id: r.id, data: r.data || {}, deleted: !!r.deleted, t: t };
      });
      if (full) { p.cursor = Math.min(p.cursor || t0, t0) - 60000; p.fullAt = Date.now(); p.from = 'full'; }
      if (changed) p.st = this.stateOf(p.rows);
      p.at = p.okAt = Date.now(); p.err = '';
      if (got.length || full) LocalCopy.set(this.copyKey('peek', id), { v: 1, cursor: p.cursor, fullAt: p.fullAt || 0, savedAt: Date.now(), rows: Object.keys(p.rows).map((k) => p.rows[k]) });
      return changed;
    } catch (e) {
      console.warn('could not load a shop for All shops', e);
      p.at = Date.now(); p.err = e.code === 'permission-denied' ? 'no access' : 'offline';
      return true;
    }
  },
  // the same state the app builds for the open shop (Cloud.build), from these rows
  stateOf(rows) {
    const app = {}, cols = {};
    Object.keys(rows).forEach((k) => {
      const r = rows[k];
      if (r.deleted) return;
      if (r.coll === 'app') { if (Cloud.DOCS.indexOf(r.id) >= 0 && r.data && r.data.value !== undefined) app[r.id] = clone(r.data.value); }
      else if (Cloud.COLS.indexOf(r.coll) >= 0) (cols[r.coll] || (cols[r.coll] = [])).push(clone(r.data));
    });
    return Cloud.build(app, cols, null);
  },
  // every other shop, unless it was fetched in the last 20 s; done() runs when one of them changed
  peekAll(done) {
    this.shops.forEach((x) => {
      if (x.id === this.shop.id) return;
      const p = this.peeks[x.id];
      if (p && (p.busy || Date.now() - p.at < 20000)) return;
      this.peek(x.id).then((changed) => { if (changed && done) done(); });
    });
    if (!this.peekTimer) {
      this.peekTimer = setInterval(() => { if (UI.view === 'shops' && !document.hidden) this.peekAll(done); }, 30000);
      document.addEventListener('visibilitychange', () => { if (UI.view === 'shops' && !document.hidden) this.peekAll(done); });
    }
  },

  // ----- adding a shop -----
  // records written straight into a shop that is not the open one (a new shop's first records)
  async upsertTo(shopId, rows) {
    for (let i = 0; i < rows.length;) {
      let j = i, size = 0;
      while (j < rows.length && j - i < 300 && (j === i || size < 900000)) { size += JSON.stringify(rows[j].data).length; j++; }
      const body = rows.slice(i, j).map((r) => ({ shop_id: shopId, coll: r.coll, id: r.id, data: r.data, deleted: false }));
      await Cloud.retry(async () => { const { error, status } = await this.sb.from('docs').upsert(body, { onConflict: 'shop_id,coll,id' }); if (error) throw this.err(error, status); });
      i = j;
    }
  },
  // a new shop's details, no staff, and its price list: copied from another shop (garments, jobs, prices, photos) or empty
  async seedShop(id, info, fromId) {
    const settings = Object.assign(defaultSettings(), { shopName: info.name, branch: '', address: info.address || '', phone: info.phone || '', orderPrefix: info.letter + '-' });
    delete settings.nextOrderNo;
    let cat = [];
    const photos = {};
    if (fromId && fromId === this.shop.id) {
      cat = clone(S.catalogue.map((g) => Object.assign({}, g, { image: null })));
      S.catalogue.forEach((g) => { if (g.image) photos[g.id] = g.image; });
    } else if (fromId) {
      const { data, error, status } = await this.sb.from('docs').select('coll,id,data,deleted').eq('shop_id', fromId).in('coll', ['app', 'photos']);
      if (error) throw this.err(error, status);
      (data || []).forEach((r) => {
        if (r.deleted || !r.data) return;
        if (r.coll === 'app' && r.id === 'catalogue' && Array.isArray(r.data.value)) cat = r.data.value.map((g) => Object.assign({}, g, { image: null }));
        if (r.coll === 'photos' && r.data.image) photos[r.id] = r.data.image;
      });
    }
    const rows = [{ coll: 'app', id: 'settings', data: { value: settings } }, { coll: 'app', id: 'catalogue', data: { value: cat } }, { coll: 'app', id: 'staff', data: { value: [] } }];
    cat.forEach((g) => { if (photos[g.id] && SEG_OK.test(String(g.id))) rows.push({ coll: 'photos', id: String(g.id), data: { image: photos[g.id] } }); });
    await this.upsertTo(id, rows);
    return { garments: cat.length, photos: rows.length - 3 };
  },

  // ----- backups of shops that are not open -----
  // everything of one shop, photos included, as a backup holds it
  async fullState(id) {
    const rows = {};
    for (let from = 0; ; from += this.PAGE) {
      const { data, error, status } = await this.sb.from('docs').select('coll,id,data,deleted').eq('shop_id', id).order('coll').order('id').range(from, from + this.PAGE - 1);
      if (error) throw this.err(error, status);
      (data || []).forEach((r) => { rows[this.key(r.coll, r.id)] = { coll: r.coll, id: r.id, data: r.data || {}, deleted: !!r.deleted }; });
      if (!data || data.length < this.PAGE) break;
    }
    const st = this.stateOf(rows);
    st.catalogue.forEach((g) => { const p = rows[this.key('photos', g.id)]; g.image = (p && !p.deleted && p.data.image) || null; });
    const c = await this.sb.rpc('next_numbers', { p_shop: id, p_count: 0 });
    if (!c.error && c.data) st.settings.nextOrderNo = num(c.data);
    return st;
  },
  // the time of the last backup goes into that shop's settings (read just before, so nothing else there is lost)
  async markBackup(id, info) {
    const { data, error, status } = await this.sb.from('docs').select('data').eq('shop_id', id).eq('coll', 'app').eq('id', 'settings');
    if (error) throw this.err(error, status);
    const cur = data && data[0] && data[0].data && data[0].data.value;
    if (!cur) return;
    cur.lastBackup = info;
    await this.upsertTo(id, [{ coll: 'app', id: 'settings', data: { value: cur } }]);
    if (this.peeks[id]) this.peeks[id].at = 0;
  }
};

// ===== 01e-helper.js =====
// ---------- the printer helper on the shop PC (online version) ----------
// A website can't reach the receipt printer itself. TailorPOS-Printer.exe on the shop PC listens on that PC only
// (127.0.0.1:47300) and prints what the app sends it: receipts and store copies drawn here as images, and the
// cash drawer signal. It keeps no records. Each device remembers whether it uses it (only the shop PC does);
// without it, or when it doesn't answer, printing opens the browser's print window as before.
// The first time, the browser asks to let this site use apps on this device (Chrome: "Allow").
const Helper = {
  BASE: 'http://127.0.0.1:47300', KEY: 'tailorpos_helper',
  on: false, ok: false, refused: false, info: null, printer: null, err: '', checking: null,
  usable() { return Remote.on && Remote.kind === 'cloud' && !inClaudeFrame(); },
  wanted() { try { return localStorage.getItem(this.KEY) === '1'; } catch (e) { return false; } },
  remember(v) { try { if (v) localStorage.setItem(this.KEY, '1'); else localStorage.removeItem(this.KEY); } catch (e) { /* storage blocked */ } this.on = !!v; if (!v) this.ok = false; },
  async api(path, opts) {
    opts = opts || {};
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = setTimeout(() => { if (ctl) ctl.abort(); }, opts.timeout || 10000);
    let r;
    try { r = await fetch(this.BASE + path, Object.assign({ cache: 'no-store', mode: 'cors', signal: ctl ? ctl.signal : undefined }, opts)); }
    catch (e) {
      this.ok = false;
      throw new Error(e && e.name === 'AbortError' ? 'The printer helper did not answer' : 'The printer helper is not running on this PC, or the browser was not allowed to reach it');
    } finally { clearTimeout(t); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 403 && j.refused) { this.ok = false; this.refused = true; } // this website's address is not allowed there yet
      throw new Error(j.error || ('Printer helper: HTTP ' + r.status));
    }
    return j;
  },
  // asks the helper who it is and how the printer is set; true when it answered
  connect(timeout) {
    if (this.checking) return this.checking;
    this.checking = (async () => {
      this.refused = false;
      try {
        const j = await this.api('/api/ping', { timeout: timeout || 4000 });
        if (!j || j.app !== 'tailorpos-printer') throw new Error('Another program answers on this PC, not the Tailor POS printer helper');
        this.info = j; this.printer = j.printer || null; this.ok = true; this.refused = false; this.err = '';
      } catch (e) { this.ok = false; this.err = e.message; }
      return this.ok;
    })().finally(() => { this.checking = null; });
    return this.checking;
  },
  // on start, on the device that uses it
  async start() {
    if (!this.usable() || !this.wanted()) return false;
    this.on = true;
    return this.connect(3000);
  },
  ready() { return this.on && this.ok && !!this.printer && !!this.printer.mode && this.printer.mode !== 'off'; },
  print(blob, opts) {
    const q = [];
    if (opts && opts.drawer) q.push('drawer=1');
    if (opts && opts.noCut) q.push('cut=0');
    return this.api('/api/print' + (q.length ? '?' + q.join('&') : ''), { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob, timeout: 30000 });
  }
};

// ===== 03-model.js =====
// ---------- state ----------
let S = defaultState();

// fill in what older versions didn't save: working days, sign-in role (from the job title) and daily capacity in AED.
// Used on load and on every staff list that arrives from another device, so all devices agree.
function fixStaff(list) {
  (Array.isArray(list) ? list : []).forEach((s) => {
    if (!Array.isArray(s.hours) || s.hours.length !== 7) s.hours = [480, 480, 480, 480, 480, 0, 480];
    if (!s.access) s.access = accessFromTitle(s.role);
    if (!Array.isArray(s.cap) || s.cap.length !== 7) s.cap = s.hours.map((h) => (num(h) > 0 ? 400 : 0));
  });
  return list;
}
// people saved before sign-in existed: guess their sign-in role from the job title
function accessFromTitle(title) {
  const t = String(title || '').toLowerCase();
  if (/admin|owner|manager|boss|partner|director/.test(t)) return 'admin';
  if (/desk|cashier|counter|reception|front|sales|accounts/.test(t)) return 'desk';
  return 'tailor';
}
function migrate(state) {
  if (!state || typeof state !== 'object' || state.v !== 2) return defaultState();
  const out = Object.assign(defaultState(), state);
  out.settings = Object.assign(defaultSettings(), state.settings || {});
  // the footer the app used to suggest gives way to the one of the shop's receipt format
  if (out.settings.receiptFooter === 'Balance payable on collection. Please bring this receipt to collect.') out.settings.receiptFooter = defaultSettings().receiptFooter;
  if (!Array.isArray(out.settings.discountPresets)) out.settings.discountPresets = defaultSettings().discountPresets;
  ['staff', 'customers', 'orders', 'closures', 'timesheet', 'expenses', 'attendance', 'payroll'].forEach((k) => { if (!Array.isArray(out[k])) out[k] = []; });
  // the starter price list only when there is none at all (a shop may start with an empty one and add its own)
  if (!Array.isArray(out.catalogue)) out.catalogue = defaultCatalogue();
  out.catalogue.forEach((g) => { g.tasks = g.tasks || []; g.tasks.forEach((t) => { t.variants = t.variants || []; }); });
  fixStaff(out.staff);
  out.settings.login = Object.assign({ required: false, idleMin: 5, perms: null, recoveryHash: '' }, out.settings.login || {});
  out.orders.forEach((o) => { o.items = o.items || []; o.payments = o.payments || []; o.events = o.events || []; if (!o.status) o.status = 'open'; });
  out.draft = state.draft && typeof state.draft === 'object' && Array.isArray(state.draft.items) ? state.draft : null;
  out.v = 2;
  return out;
}

// ---------- money / totals ----------
const NF0 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }), NF2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => { const v = round2(n); return (S.settings.currency || 'AED') + ' ' + (Number.isInteger(v) ? NF0 : NF2).format(v); };
const money2 = (n) => round2(n).toFixed(2);
const taskLabel = (t) => t.name + (t.variant ? ' / ' + t.variant : '');
const itemUnit = (it) => (it.tasks || []).reduce((s, t) => s + num(t.price), 0);
const itemTotal = (it) => round2(num(it.qty) * itemUnit(it));
const itemMinutes = (it) => num(it.qty) * (it.tasks || []).reduce((s, t) => s + num(t.minutes), 0);
const orderMinutes = (o) => (o.items || []).reduce((s, it) => s + itemMinutes(it), 0);
// work value: garment prices × qty, before rush fee and discount. Workload and capacity are measured in this, not in time.
const itemWork = (it) => itemTotal(it);
const orderWork = (o) => round2((o.items || []).reduce((s, it) => s + itemWork(it), 0));
const orderPieces = (o) => (o.items || []).reduce((s, it) => s + num(it.qty), 0);
const discountLabel = (d) => (!d ? '' : (d.label ? d.label + ' · ' : '') + (d.type === 'pct' ? num(d.value) + '%' : money(d.value)));

// VAT as it was set up when the order was taken (o.vat), so switching VAT on or off later never changes old orders
const currentVat = () => ({ rate: S.settings.vatOn ? num(S.settings.vatRate) : 0, incl: S.settings.vatInclusive !== false });
function calcTotals(items, rush, discount, payments, vatCfg) {
  const st = S.settings;
  const vc = vatCfg && typeof vatCfg === 'object' ? vatCfg : currentVat();
  const subtotal = round2((items || []).reduce((s, it) => s + itemTotal(it), 0));
  const rushFee = rush ? round2(subtotal * num(st.rushPct) / 100) : 0;
  const base = subtotal + rushFee;
  let disc = 0;
  if (discount && num(discount.value) > 0) disc = discount.type === 'pct' ? round2(base * Math.min(100, num(discount.value)) / 100) : Math.min(base, round2(num(discount.value)));
  const net = round2(base - disc);
  const rate = num(vc.rate) / 100;
  let total, vat;
  if (vc.incl || rate === 0) { total = net; vat = round2(total - total / (1 + rate)); }
  else { vat = round2(net * rate); total = round2(net + vat); }
  const paid = round2((payments || []).reduce((s, p) => s + num(p.amount), 0));
  return { subtotal: subtotal, rushFee: rushFee, discount: disc, net: net, vat: vat, vatRate: num(vc.rate), vatIncl: !!vc.incl, total: total, paid: paid, balance: round2(Math.max(0, total - paid)), over: round2(Math.max(0, paid - total)) };
}
// orders saved before the VAT switch existed carry no VAT
const NO_VAT = { rate: 0, incl: true };
const orderTotals = (o) => calcTotals(o.items, o.rush, o.discount, o.payments, o.vat || NO_VAT);
const vatLabel = (t) => (t.vatIncl ? 'Includes VAT ' : 'VAT ') + t.vatRate + '%';

// ---------- lookups ----------
const findOrder = (id) => S.orders.find((o) => o.id === id);
// customers by id, rebuilt once per screen: every order row looks its customer up
let CIDX = { gen: -1, arr: null, len: -1, map: null };
const findCustomer = (id) => {
  if (!id) return undefined;
  if (CIDX.gen !== GEN || CIDX.arr !== S.customers || CIDX.len !== S.customers.length) { const m = new Map(); S.customers.forEach((c) => m.set(c.id, c)); CIDX = { gen: GEN, arr: S.customers, len: S.customers.length, map: m }; }
  return CIDX.map.get(id);
};
const findStaff = (id) => S.staff.find((s) => s.id === id);
// the owner (Admin) is not one of the shop's workers: no daily capacity, attendance or salary
const isWorker = (s) => !!s && s.access !== 'admin';
const shopWorkers = () => S.staff.filter(isWorker);
const staffName = (id) => { const s = findStaff(id); return s ? s.name : ''; };
const findCat = (id) => S.catalogue.find((c) => c.id === id);
const orderCustomer = (o) => findCustomer(o.customerId) || { id: null, name: o.customerName || 'Walk-in', phone: o.customerPhone || '', card: '', notes: '' };
const orderState = (o) => (o.voided ? 'voided' : o.status);
const isOpen = (o) => !o.voided && o.status === 'open';
const isReady = (o) => !o.voided && o.status === 'done';
const isLive = (o) => !o.voided;
const statusChip = (o) => { const k = orderState(o); return '<span class="st s-' + k + '">' + STATUS[k].label + '</span>'; };
function orderSummary(o) {
  return (o.items || []).map((it) => it.qty + ' × ' + it.garment + ' (' + it.tasks.map(taskLabel).join(', ') + ')').join('; ') || 'No items';
}
function orderShort(o) {
  const parts = (o.items || []).map((it) => it.qty + ' × ' + it.garment);
  return parts.length > 3 ? parts.slice(0, 3).join(', ') + ' +' + (parts.length - 3) : parts.join(', ') || 'No items';
}
function dueInfo(o) {
  const T0 = todayStr();
  if (o.voided) return { kind: 'void', text: 'Voided', color: '#A11D1D', weight: 400 };
  if (o.status === 'collected') return { kind: 'done', text: 'Collected ' + fmtDay(localDate(o.collectedAt)), color: '#5A6472', weight: 400 };
  if (o.status === 'done') return { kind: 'ready', text: 'Ready since ' + fmtDay(localDate(o.doneAt)), color: '#0E6B3C', weight: 500 };
  if (!o.dueDate) return { kind: 'later', text: 'No date', color: '#5A6472', weight: 400 };
  const diff = daysBetween(T0, o.dueDate);
  if (diff < 0) return { kind: 'overdue', text: 'Overdue · ' + fmtDay(o.dueDate), color: '#B42318', weight: 600 };
  if (diff === 0) return { kind: 'today', text: 'Due today', color: '#A04F00', weight: 600 };
  if (diff === 1) return { kind: 'tomorrow', text: 'Due tomorrow', color: '#A04F00', weight: 600 };
  return { kind: 'later', text: 'Due ' + fmtDay(o.dueDate), color: '#5A6472', weight: 400 };
}
// every customer's numbers in one pass over the orders (kept for the current screen only)
let CSTATS = { gen: -1, map: null };
function customerStatsMap() {
  if (CSTATS.gen === GEN && CSTATS.map) return CSTATS.map;
  const map = new Map();
  S.orders.forEach((o) => {

// ---------- workload / capacity (money: value of work due vs value the staff can finish that day) ----------
// ---------- capacity: entered per weekday, or the average value of work each person really finished ----------
// A 0 in the weekday grid is always a day off. In 'auto' mode a working day is worth the person's average:
// work they marked done ÷ their working days in the period (yesterday back to 7 days, 30 days or the first order),
// plus an equal share of work marked done by people without capacity or with sign-in off.
// With no finished work to go on, the amount entered is used.

function capAuto() {
  const T = todayStr(), per = S.settings.capPeriod || 'month';
  const key = T + '|' + per + '|' + S.orders.length + '|' + S.staff.map((x) => x.id + x.access + (x.cap || []).join(',')).join(';');
  if (capCache.val && capCache.key === key && Date.now() - capCache.at < 5000) return capCache.val;
  const first = S.orders.reduce((m, o) => { const d = o.createdAt ? localDate(o.createdAt) : ''; return d && (!m || d < m) ? d : m; }, '');
  const to = addDays(T, -1);

  if (first && from < first) from = first;
  const res = { from: from, to: to, ok: false, total: 0, shared: 0, people: {} };
  if (from && from <= to) {
    const workers = S.staff.filter((x) => isWorker(x) && (x.cap || []).some((v) => num(v) > 0));

  const pays = [], cards = [];
  S.orders.forEach((o) => o.payments.forEach((p) => { if (!after(p.at)) return; if (p.method === 'Cash') pays.push({ o: o, p: p }); else cards.push({ o: o, p: p }); }));
  const exps = S.expenses.filter((e) => e.paidFrom === 'cash' && after(e.createdAt));
  const cashIn = round2(pays.reduce((s, x) => s + Math.max(0, x.p.amount), 0));
  const cashOut = round2(pays.reduce((s, x) => s + Math.max(0, -x.p.amount), 0));
  const expenses = round2(exps.reduce((s, e) => s + num(e.amount), 0));
  const float = last ? round2(num(last.left)) : 0;
  return { last: last, since: since, float: float, pays: pays, exps: exps, cashIn: cashIn, cashOut: cashOut, expenses: expenses,
    expected: round2(float + cashIn - cashOut - expenses), other: round2(cards.reduce((s, x) => s + x.p.amount, 0)), otherN: cards.length };
}

// ---------- staff sign-in (PIN), roles and permissions ----------
// Every person in Settings → Staff can get a PIN. When sign-in is switched on, each device asks
// "who is working?" and everything done afterwards (orders, payments, jobs done…) is recorded to that person.
// PINs are stored as SHA-256 hashes; this keeps staff honest at a shared counter, it is not bank-grade security.

function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const maxWord = Math.pow(2, 32);
  let result = '';
  const words = [];
  const bitLen = ascii.length * 8;
  const hash0 = sha256.h = sha256.h || [];
  const k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash0[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  let hash = hash0.slice(0, 8);
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); if (j >> 8) return ''; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = (bitLen / maxWord) | 0;
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += (b < 16 ? '0' : '') + b.toString(16); }
  return result;
}

          : '<div class="stack" style="gap:8px"><button type="button" class="btn rowbtn" data-act="acct:pin">' + ico('edit') + '<span>Change my PIN</span></button><button type="button" class="btn rowbtn" data-act="acct:lock">' + ico('logout') + '<span>Lock · switch user</span></button></div>')
    });

};

// what a person did in a period (orders booked, jobs done, payments taken); older records match by name
// who booked / finished / handed over an order: the recorded person, or (older records) the author of that event
function actor(o, kind) {
  const ev = (start, oldest) => { const list = o.events.filter((e) => String(e.text || '').indexOf(start) === 0); const e = oldest ? list[list.length - 1] : list[0]; return e ? { id: e.byId || '', name: e.by || '' } : { id: '', name: '' }; };
  if (kind === 'created') return o.createdBy || o.createdByName ? { id: o.createdBy || '', name: o.createdByName || '' } : ev('Order created', true);
  if (kind === 'done') return o.doneBy || o.doneByName ? { id: o.doneBy || '', name: o.doneByName || '' } : ev('Marked done');
  return o.collectedBy || o.collectedByName ? { id: o.collectedBy || '', name: o.collectedByName || '' } : ev('Collected');
}
// whose work a record is: the staff member with that id or, when nobody on the list has the id (people brought in
// from the old software, someone removed and added again), the one person with that name
const nameKey = (n) => String(n || '').trim().toLowerCase();
function staffFor(a) {
  if (!a) return null;
  const s = a.id ? findStaff(a.id) : null;
  if (s) return s;
  const k = nameKey(a.name); if (!k) return null;
  const hits = S.staff.filter((x) => nameKey(x.name) === k);
  return hits.length === 1 ? hits[0] : null;
}
// the line someone's work goes on: their staff id; 'name:<name>' for someone not on the staff list; '' with sign-in off
function creditKey(a) {
  const s = staffFor(a); if (s) return s.id;
  const n = String((a && a.name) || '').trim();
  return n && (a.id || nameKey(n) !== nameKey(S.settings.cashier || 'Cashier')) ? 'name:' + n : '';
}
// someone on past records who is not on the staff list; the old software's owner login keeps that title
// the owner and partners (their own logins, not on the staff list) keep their names and say who they are
const memberRoleOf = (n) => (typeof Supa !== 'undefined' && Supa.members.length ? Supa.memberRole(n) : '');
const isOwnerName = (n) => nameKey(n) === 'owner';
const formerName = (n) => (isOwnerName(n) ? 'Owner' : memberRoleOf(n) ? n : n + ' (no longer on staff)');
const formerRole = (n) => { const r = memberRoleOf(n); return isOwnerName(n) || r === 'owner' ? 'Owner' : r === 'partner' ? 'Partner' : 'No longer on staff'; };
// someone added to the staff list whose name is on past records under an id nobody has (people brought in from the
// old software, someone removed and added again) takes that id over, so their earlier work and days are theirs again
function staffIdFor(name) {
  const k = nameKey(name); if (!k) return '';
  const n = {};
  const see = (id, who) => { if (id && nameKey(who) === k && /^[A-Za-z0-9_]+$/.test(id) && !findStaff(id)) n[id] = (n[id] || 0) + 1; };
  S.orders.forEach((o) => {
    see(o.createdBy, o.createdByName); see(o.doneBy, o.doneByName); see(o.collectedBy, o.collectedByName);
    o.events.forEach((e) => see(e.byId, e.by)); o.payments.forEach((p) => see(p.byId, p.by));
  });
  S.expenses.forEach((e) => { see(e.createdBy, e.createdByName); (e.log || []).forEach((l) => see(l.byId, l.by)); });
  S.closures.forEach((c) => see(c.byId, c.by));
  const ids = Object.keys(n);
  return ids.length ? sortBy(ids, (id) => n[id], true)[0] : '';
}
function myStats(id, from, to) {
  const mine = (a) => { const s = staffFor(a); return !!s && s.id === id; };
  const inR = (iso) => { if (!iso) return false; const d = localDate(iso); return d >= from && d <= to; };
  const out = { booked: 0, bookedValue: 0, done: 0, doneValue: 0, collected: 0, payments: 0, paid: 0, discount: 0 };
  S.orders.forEach((o) => {
    if (o.voided) return;
    if (inR(o.createdAt) && mine(actor(o, 'created'))) { const t = orderTotals(o); out.booked++; out.bookedValue += t.total; out.discount += t.discount; }
    if (o.doneAt && inR(o.doneAt) && mine(actor(o, 'done'))) { out.done++; out.doneValue += orderWork(o); }
    if (o.collectedAt && inR(o.collectedAt) && mine(actor(o, 'collected'))) out.collected++;
    o.payments.forEach((p) => { if (inR(p.at) && mine({ id: p.byId || '', name: p.by || '' })) { out.payments++; out.paid += p.amount; } });
  });
  ['bookedValue', 'doneValue', 'paid', 'discount'].forEach((k) => { out[k] = round2(out[k]); });
  return out;
}

}

const shortMoney = (v) => { v = round2(v); return v >= 1000 ? String(Math.round(v / 10) / 100) + 'k' : String(Math.round(v)); };

// workload for the next days as columns: grey track = daily capacity (AED), fill = value of work already due that day
function workloadChart(days) {
  const rows = [];
  for (let i = 0; i < days; i++) {
    const ds = addDays(todayStr(), i);
    rows.push({ ds: ds, l: dayLoad(ds, 0, null), n: S.orders.filter((o) => isOpen(o) && o.dueDate === ds).length });
  }
  const overdue = S.orders.filter((o) => isOpen(o) && o.dueDate && o.dueDate < todayStr());
  const overdueVal = round2(overdue.reduce((s, o) => s + orderWork(o), 0));
  if (!overdue.length && !rows.some((r) => r.l.booked || r.l.cap)) return '<div class="wl-empty">' + ico('calendar') + '<span>' + (S.staff.some((s) => s.access === 'tailor') ? 'No work due in the next ' + days + ' days.' : 'No work due yet. Add tailors and how much each finishes a day in Settings → Staff &amp; capacity to see work against what the shop can finish.') + '</span></div>';
  const max = Math.max(60, ...rows.map((r) => Math.max(r.l.booked, r.l.cap)));
  const cols = rows.map((r) => {
    const capPct = r.l.cap ? r.l.cap / max * 100 : 0;
    const bookPct = Math.min(100, r.l.booked / max * 100);
    const lv = r.l.level;
    const tip = fmtDay(r.ds) + ': ' + money(r.l.booked) + ' of work due' + (r.l.cap ? ' of ' + money(r.l.cap) + ' capacity' : '') + ' · ' + plural(r.n, 'order');
    const day = r.ds === todayStr() ? 'Today' : fmtD(new Date(r.ds + 'T00:00:00'), { weekday: 'short' });
    return '<a class="wl-row lv-' + lv + (r.ds === todayStr() ? ' is-today' : '') + '" href="#orders" data-act="dash:day" data-date="' + r.ds + '" title="' + esc(tip) + '">' +
      '<span class="wl-val">' + (lv === 'closed' ? 'Off' : r.l.booked ? esc(shortMoney(r.l.booked)) : '–') + '</span>' +
      '<span class="wl-track">' + (capPct ? '<span class="wl-cap" style="height:' + capPct.toFixed(1) + '%"></span>' : '') + '<span class="wl-bar" style="height:' + bookPct.toFixed(1) + '%"></span></span>' +
      '<span class="wl-day">' + esc(day) + '</span><span class="wl-date">' + esc(r.ds.slice(8)) + '</span></a>';
  }).join('');
  return (overdue.length ? '<a class="wl-over" href="#orders" data-act="dash:overdue">' + ico('alert') + '<span><b>' + esc(money(overdueVal)) + '</b> of overdue work · ' + plural(overdue.length, 'order') + '</span></a>' : '') +
    '<div class="wl">' + cols + '</div>' +
    '<div class="wl-legend"><span><i class="lg-cap"></i>Daily capacity</span><span><i class="lg-ok"></i>Room</span><span><i class="lg-busy"></i>Busy</span><span><i class="lg-full"></i>Full</span></div>' +
    (shopWorkers().length ? '' : '<div class="small muted">Add staff and their daily capacity in Settings → Staff &amp; capacity to compare work with what the shop can finish.</div>');
}

// ---------- helpers shared by the home views ----------
const ordersBookedIn = (from, to) => S.orders.filter((o) => !o.voided && localDate(o.createdAt) >= from && localDate(o.createdAt) <= to);
const sumBy = (arr, f) => round2(arr.reduce((s, x) => s + f(x), 0));
// work finished per person in a period, by value: nobody is assigned, so whoever marks an order done gets its work
function tailorOutput(from, to) {
  const out = {};
  S.orders.forEach((o) => {
    if (o.voided || !o.doneAt || o.status === 'open') return;
    const d = localDate(o.doneAt); if (d < from || d > to) return;
    // someone not on the staff list (e.g. from the old software) keeps their own line under their name
    const id = creditKey(actor(o, 'done')), st = id && id.indexOf('name:') !== 0 ? findStaff(id) : null;
    const r = out[id] || (out[id] = { value: 0, count: 0, pieces: 0, due: 0, onTime: 0, name: st ? st.name : id.slice(5) });
    r.value += orderWork(o); r.count++; r.pieces += orderPieces(o);
    if (o.dueDate) { r.due++; if (d <= o.dueDate) r.onTime++; }
  });
  Object.keys(out).forEach((k) => { out[k].value = round2(out[k].value); });
  return out;
}

  // ----- tailor: the shop's work (nobody is assigned: anyone picks an order and marks it done) -----
  mine() {

// ===== 05b-view-business.js =====
// ---------- Business home: the shop's money and work for one period, compared with the period before ----------
// The period picked at the top drives every figure on the page except the ones that are "now" (work in the shop,
// what customers still owe). The page is about sales, money coming in, work done and customers: the shop's expenses are
// few (staff salaries, rent every few months), so they only show as two lines in the money summary.
// Sales are the orders booked in the period (voided orders left out). Money is counted on the day it moved:
// payments on the day they were taken, refunds on the day the money went back, expenses on their date.
// Work done is the catalogue value of the orders marked done in the period.
const BIZ_RANGES = [['today', 'Today', 'Today'], ['week', 'This week', 'Week'], ['month', 'This month', 'Month'], ['lastmonth', 'Last month', 'Last month'], ['year', 'This year', 'Year']];
const BIZ_METRICS = [['sales', 'Sales'], ['in', 'Money in'], ['work', 'Work done']];
// the period is remembered on this device
UI.bizRange = (() => { try { const v = localStorage.getItem('tailorpos_bizrange'); return BIZ_RANGES.some((r) => r[0] === v) ? v : 'today'; } catch (e) { return 'today'; } })();
UI.bizMetric = 'sales';

// totals of each order, worked out once per drawing of the page
let BIZ_T = null;
const bizTot = (o) => { if (!BIZ_T) return orderTotals(o); let t = BIZ_T.get(o); if (!t) { t = orderTotals(o); BIZ_T.set(o, t); } return t; };
const bizRun = (fn) => { BIZ_T = new Map(); try { return fn(); } finally { BIZ_T = null; } };

const monthStart = (ds, n) => { const d = new Date(ds.slice(0, 7) + '-01T00:00:00'); d.setMonth(d.getMonth() + (n || 0)); return ymd(d); };
const monthName = (ds, withYear) => fmtD(new Date(ds.slice(0, 7) + '-01T00:00:00'), withYear ? { month: 'long', year: 'numeric' } : { month: 'long' });
// "Thu 6 Nov", "1 – 6 Nov", "27 Oct – 2 Nov"; the year only when it is not this year
function fmtSpan(from, to) {
  const Y = todayStr().slice(0, 4);
  const f = (s, o) => fmtD(new Date(s + 'T00:00:00'), o);
  const yr = from.slice(0, 4) !== Y || to.slice(0, 4) !== Y;
  if (from === to) return f(from, yr ? { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'short' });
  const end = f(to, yr ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
  const start = from.slice(0, 7) === to.slice(0, 7) ? String(+from.slice(8)) : f(from, from.slice(0, 4) === to.slice(0, 4) ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  return start + ' – ' + end;
}

// the period, the one it is compared with, and the days the chart shows (c… = chart, cp… = the chart's earlier period)
function bizRange(key) {
  const T0 = todayStr(), M1 = monthStart(T0), Y = T0.slice(0, 4), PY = String(+Y - 1);
  let r;
  if (key === 'week') {
    const w = startOfWeek(T0);
    r = { from: w, to: T0, pFrom: addDays(w, -7), pTo: addDays(T0, -7), word: 'this week', vs: 'vs last week', cur: 'This week', prev: 'Last week', same: 'last week', by: 'day', cFrom: w, cTo: addDays(w, 6), cpFrom: addDays(w, -7), cpTo: addDays(w, -1) };
  } else if (key === 'month') {
    const pm = monthStart(T0, -1), pmEnd = addDays(M1, -1);
    r = { from: M1, to: T0, pFrom: pm, pTo: [pm.slice(0, 8) + T0.slice(8), pmEnd].sort()[0], word: 'this month', vs: 'vs last month', cur: 'This month', prev: 'Last month', same: 'last month', by: 'day', cFrom: M1, cTo: addDays(monthStart(T0, 1), -1), cpFrom: pm, cpTo: pmEnd };
  } else if (key === 'lastmonth') {
    const f = monthStart(T0, -1), pf = monthStart(T0, -2);
    r = { from: f, to: addDays(M1, -1), pFrom: pf, pTo: addDays(f, -1), word: 'last month', vs: 'vs ' + monthName(pf), cur: monthName(f), prev: monthName(pf), by: 'day', label: monthName(f, true), pLabel: monthName(pf, true) };
    r.cFrom = r.from; r.cTo = r.to; r.cpFrom = r.pFrom; r.cpTo = r.pTo;
  } else if (key === 'year') {
    r = { from: Y + '-01-01', to: T0, pFrom: PY + '-01-01', pTo: PY + (T0.slice(5) === '02-29' ? '-02-28' : T0.slice(4)), word: 'this year', vs: 'vs last year', cur: Y, prev: PY, same: 'last year', by: 'month', cFrom: Y + '-01-01', cTo: Y + '-12-31', cpFrom: PY + '-01-01', cpTo: PY + '-12-31' };
  } else {
    key = 'today';
    r = { from: T0, to: T0, pFrom: addDays(T0, -1), pTo: addDays(T0, -1), word: 'today', vs: 'vs yesterday', cur: 'Today', prev: 'Yesterday', by: 'day', cFrom: addDays(T0, -13), cTo: T0, cpFrom: '', cpTo: '' };
  }
  r.key = key;
  r.label = r.label || fmtSpan(r.from, r.to);
  r.pLabel = r.pLabel || fmtSpan(r.pFrom, r.pTo);
  // a period still running is compared up to the same time of day: 11 in the morning against yesterday's 11, not its whole day
  if (key !== 'lastmonth') {
    const now = new Date();
    r.cut = { day: r.pTo, iso: new Date(r.pTo + 'T' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds())).toISOString(), at: fmtHM(now) };
  }
  r.note = 'Compared with ' + (key === 'today' ? 'yesterday up to ' + r.cut.at + ' (' + r.pLabel + ')' : r.same ? 'the same days ' + r.same + ' (' + r.pLabel + ', up to ' + r.cut.at + ')' : r.pLabel);
  const all = [r.from, r.to, r.pFrom, r.pTo, r.cFrom, r.cTo, r.cpFrom, r.cpTo].filter(Boolean).sort();
  r.spanFrom = all[0]; r.spanTo = all[all.length - 1];
  return r;
}

// ---------- figures per day, in one pass over the orders, payments and expenses ----------
const BZ0 = () => ({ sales: 0, n: 0, pcs: 0, disc: 0, rush: 0, vat: 0, inn: 0, pays: 0, cash: 0, card: 0, bank: 0, oth: 0, ref: 0, out: 0, ne: 0, staff: 0, done: 0, doneN: 0, donePcs: 0 });
// salaries and salary advances: the shop's one big cost
const isStaffPay = (e) => e.kind === 'salary' || e.kind === 'advance' || /salar/i.test(String(e.category || ''));
// D: each day's figures; C (with a cut): the cut day up to the cut time, its expenses whole
function bizDays(from, to, cut) {
  const D = {}, C = cut ? BZ0() : null;
  const at = (ds) => D[ds] || (D[ds] = BZ0());
  const addOrder = (x, o, t) => { x.sales += t.total; x.n++; x.pcs += orderPieces(o); x.disc += t.discount; x.rush += t.rushFee; x.vat += t.vat; };
  const addDone = (x, o, w) => { x.done += w; x.doneN++; x.donePcs += orderPieces(o); };
  const addPay = (x, a, p) => {
    if (a < 0) { x.ref -= a; return; }
    x.inn += a; x.pays++;
    if (p.method === 'Cash') x.cash += a; else if (p.method === 'Card') x.card += a; else if (p.method === 'Transfer') x.bank += a; else x.oth += a;
  };
  S.orders.forEach((o) => {
    if (!o.voided) {
      const d = localDate(o.createdAt);
      if (d >= from && d <= to) { const t = bizTot(o); addOrder(at(d), o, t); if (C && d === cut.day && o.createdAt <= cut.iso) addOrder(C, o, t); }
      // work done: whoever marked it done, on the day it was marked (as in Tailor productivity)
      if (o.doneAt && o.status !== 'open') {
        const dd = localDate(o.doneAt);
        if (dd >= from && dd <= to) { const w = orderWork(o); addDone(at(dd), o, w); if (C && dd === cut.day && o.doneAt <= cut.iso) addDone(C, o, w); }
      }
    }
    // money that came in counts even if the order was voided later (a refund shows as money back)
    (o.payments || []).forEach((p) => {
      const d = localDate(p.at); if (!d || d < from || d > to) return;
      const a = num(p.amount);
      addPay(at(d), a, p);
      if (C && d === cut.day && p.at <= cut.iso) addPay(C, a, p);
    });
  });
  S.expenses.forEach((e) => { if (!e.date || e.date < from || e.date > to) return; const x = at(e.date), a = num(e.amount); x.out += a; x.ne++; if (isStaffPay(e)) x.staff += a; });
  if (C && D[cut.day]) { C.out = D[cut.day].out; C.ne = D[cut.day].ne; C.staff = D[cut.day].staff; }
  return { D: D, C: C };
}
// totals of the days from..to; with C, the last day counts only up to the cut
function bizSum(D, from, to, C) {
  const s = BZ0();
  const add = (x) => { for (const k in s) s[k] += x[k]; };
  if (from && to) Object.keys(D).forEach((d) => { if (d < from || d > to || (C && d === to)) return; add(D[d]); });
  if (C && from && to) add(C);
  ['sales', 'disc', 'rush', 'vat', 'inn', 'cash', 'card', 'bank', 'oth', 'ref', 'out', 'staff', 'done'].forEach((k) => { s[k] = round2(s[k]); });
  s.other = round2(s.out - s.staff);
  s.net = round2(s.inn - s.ref - s.out);
  return s;
}
// what sold in the period: by garment and by kind of work (list prices)
function bizDetail(from, to) {
  const g = {}, k = {};
  S.orders.forEach((o) => {
    if (o.voided) return;
    const d = localDate(o.createdAt); if (d < from || d > to) return;
    (o.items || []).forEach((it) => {
      const q = num(it.qty);
      const gr = g[it.garment] || (g[it.garment] = { v: 0, q: 0 }); gr.v += itemTotal(it); gr.q += q;
      (it.tasks || []).forEach((x) => { const kk = x.group || 'Other'; const kr = k[kk] || (k[kk] = { v: 0, n: 0 }); kr.v += q * num(x.price); kr.n += q; });
    });
  });
  return { g: g, k: k };
}
// the day each customer first ordered (to tell new customers from returning ones), kept for one screen
let FIRSTO = { gen: -1, map: null };
function firstOrderDays() {
  if (FIRSTO.gen === GEN && FIRSTO.map) return FIRSTO.map;
  const m = new Map();
  S.orders.forEach((o) => { if (o.voided || !o.customerId) return; const d = localDate(o.createdAt); const x = m.get(o.customerId); if (!x || d < x) m.set(o.customerId, d); });
  FIRSTO = { gen: GEN, map: m };
  return m;
}
// who ordered in a period (the last day up to the cut): named customers once each, every walk-in order, and the new ones
function bizCustomers(from, to, cut) {
  const first = firstOrderDays(), ids = new Map();
  let walkin = 0;
  S.orders.forEach((o) => {
    if (o.voided) return;
    const d = localDate(o.createdAt); if (d < from || d > to) return;
    if (cut && d === cut.day && o.createdAt > cut.iso) return;
    if (!o.customerId) { walkin++; return; }
    const c = ids.get(o.customerId) || { v: 0, n: 0 }; c.v += bizTot(o).total; c.n++; ids.set(o.customerId, c);
  });
  let newN = 0; ids.forEach((c, id) => { if ((first.get(id) || '') >= from) newN++; });
  return { ids: ids, named: ids.size, walkin: walkin, newN: newN, served: ids.size + walkin };
}
// what customers still owe on orders, as of now
function owedNow() {
  let v = 0, n = 0;
  S.orders.forEach((o) => { if (o.voided) return; const b = bizTot(o).balance; if (b > 0) { v += b; n++; } });
  return { v: round2(v), n: n };
}
const pctOf = (v, all) => (all > 0 ? Math.round(v / all * 100) : 0);
// the home shows whole dirhams (the reports and the cash drawer keep the fils)
const wMoney = (v) => money(Math.round(v));
const avgOrder = (s) => (s.n ? Math.round(s.sales / s.n) : 0);

// ---------- pieces of the page ----------
const bizSeg = (r) => '<div class="seg biz-seg" role="tablist" aria-label="Period">' + BIZ_RANGES.map((x) => '<button type="button" role="tab" aria-selected="' + (x[0] === r.key) + '" class="' + (x[0] === r.key ? 'on' : '') + '" data-act="biz:range" data-v="' + x[0] + '"><span class="rb-l">' + x[1] + '</span><span class="rb-s">' + x[2] + '</span></button>').join('') + '</div>';
function bizBar(r) {
  return '<div class="biz-bar">' + bizSeg(r) + '<div class="biz-when">' + ico('calendar') + '<span><b>' + esc(r.label) + '</b><span class="biz-vs">' + esc(r.note) + '</span></span></div></div>';
}
// a KPI card with the change against the earlier period under it
function bizTile(o) {
  return (o.href ? '<a class="kpi link t-' + o.tone + '" href="' + o.href + '"' + (o.act ? ' data-act="' + o.act + '"' + (o.t ? ' data-t="' + o.t + '"' : '') : '') + '>' : '<div class="kpi t-' + o.tone + '">') +
    '<div class="kpi-top"><span class="kpi-ic">' + ico(o.icon) + '</span><span class="label">' + esc(o.label) + '</span></div>' +
    '<div class="value' + (o.value.length > 10 ? ' long' : '') + '">' + esc(o.value) + '</div>' + (o.sub ? '<div class="sub">' + esc(o.sub) + '</div>' : '') + (o.foot || '') + (o.href ? '</a>' : '</div>');
}
// ▲ 12% vs yesterday; with nothing in the earlier period it says so ("none" when counting people)
function bizDelta(cur, prev, r, count) {
  cur = Math.round(cur); prev = Math.round(prev);
  if (!prev) return '<div class="kpi-d"><span class="kpi-vs">' + esc(r.prev) + ': ' + (count ? 'none' : 'nothing') + (cur ? '' : ' either') + '</span></div>';
  const d = cur - prev, dir = d > 0 ? 1 : d < 0 ? -1 : 0;
  const p = Math.round(Math.abs(d) / prev * 100), txt = !dir ? '0%' : p ? p + '%' : 'under 1%';
  return '<div class="kpi-d"><span class="delta ' + (dir > 0 ? 'up' : dir < 0 ? 'down' : 'flat') + '">' + (dir > 0 ? '▲ ' : dir < 0 ? '▼ ' : '') + esc(txt) + '</span><span class="kpi-vs">' + esc(r.vs) + '</span></div>';
}
function bizKpis(r, S0, P0, C0, CP) {
  const split = ['Cash ' + wMoney(S0.cash), 'Card ' + wMoney(S0.card)].concat(S0.bank ? ['Bank ' + wMoney(S0.bank)] : []).concat(S0.oth ? ['Other ' + wMoney(S0.oth)] : []).join(' · ');
  return '<div class="kpis biz-kpis">' +

// ---------- day by day (month by month for a year): one measure at a time, the earlier period as a thin line ----------
function bizChart(r, D) {
  const T0 = todayStr();
  const m = BIZ_METRICS.some((x) => x[0] === UI.bizMetric) ? UI.bizMetric : 'sales';
  const val = (x) => (!x ? 0 : m === 'sales' ? x.sales : m === 'in' ? x.inn : x.done);
  const cols = [];
  if (r.by === 'month') {
    const MS = {};
    Object.keys(D).forEach((d) => { const k = d.slice(0, 7); const a = MS[k] || (MS[k] = BZ0()); const x = D[d]; for (const f in a) a[f] += x[f]; });
    const Y = r.cFrom.slice(0, 4), PY = r.cpFrom.slice(0, 4);
    for (let i = 1; i <= 12; i++) {
      const k = Y + '-' + pad2(i), pk = PY + '-' + pad2(i), dt = new Date(k + '-01T00:00:00');
      cols.push({ x: MS[k], px: MS[pk] || BZ0(), future: k > T0.slice(0, 7), now: k === T0.slice(0, 7), label: monthName(k, true), plabel: monthName(pk, true), xl: fmtD(dt, { month: 'short' }), xs: fmtD(dt, { month: 'narrow' }), show: true });
    }
  } else {
    const n = daysBetween(r.cFrom, r.cTo) + 1;
    for (let i = 0; i < n; i++) {
      const ds = addDays(r.cFrom, i), pds = r.cpFrom ? addDays(r.cpFrom, i) : '', hasP = !!pds && pds <= r.cpTo, dn = +ds.slice(8);
      cols.push({ x: D[ds], px: hasP ? (D[pds] || BZ0()) : null, future: ds > T0, now: ds === T0, label: fmtDayY(ds), plabel: hasP ? fmtDayY(pds) : '',
        xl: n <= 7 ? fmtD(new Date(ds + 'T00:00:00'), { weekday: 'short' }) : String(dn), show: n <= 7 || (n <= 14 ? (n - 1 - i) % 2 === 0 : dn === 1 || dn % 5 === 0) });
    }
  }
  const vals = cols.map((c) => (c.future ? 0 : Math.max(0, round2(val(c.x)))));
  const pvals = cols.map((c) => (c.px ? Math.max(0, round2(val(c.px))) : null));
  const max = Math.max(0, ...vals, ...pvals.filter((v) => v != null));
  const word = m === 'sales' ? 'booked' : m === 'in' ? 'received' : 'of work done';
  if (!(max > 0)) return '<div class="rchart-empty">' + emptyState(m === 'work' ? 'scissors' : 'reports', (m === 'sales' ? 'No orders booked ' : m === 'in' ? 'No money received ' : 'No work marked done ') + (r.key === 'today' ? 'in the last 14 days' : r.word), r.key === 'today' || r.key === 'lastmonth' ? '' : 'They show here as soon as there are some.') + '</div>';
  const ax = niceAxis(max, [4, 3]), top = ax.top;
  const ticks = []; for (let i = ax.n; i >= 0; i--) ticks.push(i / ax.n);
  const html = cols.map((c, i) => {
    const v = vals[i], pv = pvals[i];
    let tip = '';
    if (!c.future) {
      tip = c.label + ': ' + wMoney(v) + ' ' + word;
      if (m === 'sales' && c.x && c.x.n) tip += ' · ' + plural(c.x.n, 'order');
      if (m === 'in' && c.x && c.x.ref) tip += ' · refunds ' + wMoney(c.x.ref);
      if (m === 'work' && c.x && c.x.doneN) tip += ' · ' + plural(c.x.doneN, 'order');
    }
    if (pv != null) tip += (tip ? ' · ' : c.label + ' · ') + c.plabel + ': ' + wMoney(pv);
    return '<div class="bz-col' + (c.now ? ' now' : '') + (c.future ? ' future' : '') + '"' + (tip ? ' tabindex="0" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '"' : '') + '>' +
      (v > 0 ? '<span class="bz-bar" style="height:' + Math.max(1.5, v / top * 100).toFixed(1) + '%"></span>' : '') +
      (pv ? '<span class="bz-pv" style="bottom:' + (pv / top * 100).toFixed(1) + '%"></span>' : '') +
      (c.show ? '<span class="bz-x">' + (r.by === 'month' ? '<span class="x-l">' + esc(c.xl) + '</span><span class="x-s">' + esc(c.xs) + '</span>' : esc(c.xl)) + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="bzchart m-' + m + (cols.length > 20 ? ' dense' : '') + '" role="group" aria-label="' + esc(BIZ_METRICS.find((x) => x[0] === m)[1] + ', ' + (r.by === 'month' ? 'month by month' : 'day by day') + '. Move along the columns to hear each value.') + '">' +
    '<div class="bz-y" aria-hidden="true">' + ticks.map((t) => '<span>' + esc(shortNum(top * t)) + '</span>').join('') + '</div>' +
    '<div class="bz-plot"><div class="bz-grid" aria-hidden="true">' + ticks.map(() => '<i></i>').join('') + '</div><div class="bz-cols">' + html + '</div></div></div>' +
    '<div class="bz-legend"><span><i class="bz-sw m-' + m + '"></i>' + esc(r.key === 'today' ? 'Last 14 days' : r.cur) + '</span>' + (r.cpFrom ? '<span><i class="bz-tk"></i>' + esc(r.prev) + '</span>' : '') + '<span class="bz-unit">' + esc(S.settings.currency || 'AED') + '</span></div>';
}
function bizChartCard(r, D) {
  const m = BIZ_METRICS.some((x) => x[0] === UI.bizMetric) ? UI.bizMetric : 'sales';
