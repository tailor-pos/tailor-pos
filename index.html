// ---------- money summary: the period next to the one before, like a simple profit and loss ----------
function bizMoneyCard(r, S0, P0, D, owed) {
  // amounts taken off show a minus sign; a net below zero keeps its sign
  const amt = (v, minus) => { v = Math.round(v); return v ? (minus || v < 0 ? '−' : '') + esc(money(Math.abs(v))) : '<span class="faint">—</span>'; };
  const row = (label, a, b, o) => {
    o = o || {};
    const f = o.count ? (v) => (v ? String(v) : '<span class="faint">—</span>') : (v) => amt(v, o.minus);
    const lab = o.href ? '<a href="' + o.href + '"' + (o.t ? ' data-act="biz:reports" data-t="' + o.t + '"' : '') + '>' + label + '</a>' : label;
    return '<tr' + (o.cls ? ' class="' + o.cls + '"' : '') + '><th scope="row">' + lab + '</th><td' + (o.vcls ? ' class="' + o.vcls + '"' : '') + '>' + f(a) + '</td><td class="pl-pv">' + f(b) + '</td></tr>';
  };
  const sec = (label) => '<tr class="pl-sec"><th scope="rowgroup" colspan="3">' + label + '</th></tr>';
  const showVat = !!S.settings.vatOn || S0.vat || P0.vat;
  const body = sec('Sales') +
    row('Orders booked', S0.sales, P0.sales, { href: '#reports', t: 'sales', cls: 'pl-main' }) +
    row('Number of orders', S0.n, P0.n, { count: true, cls: 'pl-sub' }) +
    row('Average order', avgOrder(S0), avgOrder(P0), { cls: 'pl-sub' }) +
    row('Discounts given', S0.disc, P0.disc, { cls: 'pl-sub', minus: true }) +
    (S0.rush || P0.rush ? row('Rush fees', S0.rush, P0.rush, { cls: 'pl-sub' }) : '') +
    (showVat ? row('VAT in orders', S0.vat, P0.vat, { cls: 'pl-sub' }) : '') +
    sec('Money in and out') +
    row('Money received', S0.inn, P0.inn, { href: '#reports', t: 'payments', cls: 'pl-main' }) +
    row('Cash', S0.cash, P0.cash, { cls: 'pl-sub' }) + row('Card', S0.card, P0.card, { cls: 'pl-sub' }) +
    (S0.bank || P0.bank ? row('Bank transfer', S0.bank, P0.bank, { cls: 'pl-sub' }) : '') +
    (S0.oth || P0.oth ? row('Other', S0.oth, P0.oth, { cls: 'pl-sub' }) : '') +
    (S0.ref || P0.ref ? row('Refunds', S0.ref, P0.ref, { cls: 'pl-main', minus: true }) : '') +
    row('Expenses', S0.out, P0.out, { href: '#expenses', cls: 'pl-main', minus: true }) +
    row('Net', S0.net, P0.net, { cls: 'pl-tot', vcls: Math.round(S0.net) < 0 ? 'bad' : '' }) +
    '<tr class="pl-note"><td colspan="3">Money received, minus refunds and expenses' + (S0.inn > 0 && S0.net > 0 ? ' · ' + pctOf(S0.net, S0.inn) + '% of what came in' : '') + '</td></tr>';
  // at this pace: the month or year so far, stretched to the whole of it
  let pace = '';
  if (r.key === 'month' || r.key === 'year') {
    const done = daysBetween(r.from, r.to) + 1, all = daysBetween(r.cFrom, r.cTo) + 1;
    if (done >= 3 && done < all && (S0.sales || S0.inn)) {
      const est = (v) => { v = v * all / done; return v >= 1000 ? Math.round(v / 100) * 100 : Math.round(v); };
      const whole = bizSum(D, r.cpFrom, r.cpTo);
      pace = '<div class="biz-pace">' + ico('trend') + '<span>At this pace: about <b>' + esc(wMoney(est(S0.sales))) + '</b> of orders and <b>' + esc(wMoney(est(S0.inn))) + '</b> received by the end of the ' + (r.key === 'month' ? 'month' : 'year') + '.' + (whole.sales ? ' ' + esc(r.prev) + ' in full: ' + esc(wMoney(whole.sales)) + ' of orders.' : '') + '</span></div>';
    }
  }
  return '<section class="card hb-money"><div class="card-h"><h2>Money summary</h2><span class="card-sub">' + esc(r.note) + '</span></div><div class="card-b stack">' +
    '<table class="pl"><thead><tr><td></td><th scope="col">' + esc(r.cur) + '</th><th scope="col" class="pl-pv">' + esc(r.prev) + '</th></tr></thead><tbody>' + body + '</tbody></table>' + pace +
    '<div class="biz-now">' + (owed.v ? '<a class="kv link biz-line" href="#reports" data-act="dash:owing"><span>' + ico('wallet') + 'Still to collect from customers</span><span class="num">' + esc(wMoney(owed.v)) + '</span></a>' : '') +

    '<a class="card-link biz-more" href="#reports" data-act="biz:reports" data-t="overview">Full reports' + ico('chevron') + '</a></div></section>';
}

    return { sales: s.sales, n: s.n, inn: s.inn, done: s.done, owed: owed.v, owedN: owed.n, drawer: dr.expected };

const RANGES = [['all', 'All dates'], ['overdue', 'Overdue'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'Next 7 days'], ['thisweek', 'This week'], ['month', 'This month'], ['last30', 'Last 30 days'], ['custom', 'Custom dates']];
if (!UI.ordersView) UI.ordersView = 'list';
function rangeBounds(r, from, to) {
  const T0 = todayStr();
  switch (r) {
    case 'overdue': return ['0000-00-00', addDays(T0, -1)];
    case 'today': return [T0, T0];
    case 'tomorrow': return [addDays(T0, 1), addDays(T0, 1)];
    case 'week': return [T0, addDays(T0, 6)];
    case 'thisweek': return [startOfWeek(T0), addDays(startOfWeek(T0), 6)];
    case 'month': return [T0.slice(0, 8) + '01', T0.slice(0, 8) + '31'];
    case 'last30': return [addDays(T0, -29), T0];
    case 'custom': return [from || '0000-00-00', to || '9999-12-31'];
    default: return null;
  }
}
const orderDateFor = (o, by) => (by === 'created' ? localDate(o.createdAt) : o.dueDate || '');
function orderMatches(o, q) {
  if (!q) return true;
  const qd = digits(q);
  const c = orderCustomer(o);
  return o.no.toLowerCase().indexOf(q) >= 0 || c.name.toLowerCase().indexOf(q) >= 0 || (qd.length >= 3 && digits(c.phone).indexOf(qd) >= 0) || orderSummary(o).toLowerCase().indexOf(q) >= 0;
}
function filteredOrders() {
  const tab = ORDER_TABS.find((x) => x.id === UI.ordersTab) || ORDER_TABS[0];
  const q = UI.ordersQ.trim().toLowerCase();
  const b = rangeBounds(UI.ordersRange, UI.ordersFrom, UI.ordersTo);
  let rows = S.orders.filter(tab.test).filter((o) => {
    if (b) { const dt = orderDateFor(o, UI.ordersBy); if (!dt || dt < b[0] || dt > b[1]) return false; }
    return orderMatches(o, q);

  const asc = UI.ordersBy === 'due' && (UI.ordersTab === 'open' || UI.ordersTab === 'done');
  rows = sortBy(rows, (o) => (UI.ordersBy === 'created' ? o.createdAt : (o.dueDate || '9999') + o.createdAt), !asc);
  return rows;
}

        '<div class="sumbar"><span><b>' + rows.length + '</b> orders</span><span><b>' + pieces + '</b> pieces</span><span class="spacer"></span><span>Value <b class="num">' + esc(money(value)) + '</b></span><span>Balance due <b class="num' + (due > 0 ? ' bad' : '') + '">' + esc(money(due)) + '</b></span></div></section>'
        : '<section class="card">' + emptyState(UI.ordersQ ? 'search' : 'inbox', UI.ordersQ ? 'No orders match “' + UI.ordersQ + '”' : 'No orders here', UI.ordersRange !== 'all' ? 'Try another date range or tab.' : 'Orders appear here as soon as they are saved.') + '</section>';
      return list + bulk;
    }
  }
};
Actions['orders:view'] = (d) => { UI.ordersView = d.v; UI.sel = {}; rerender(); };
Actions['orders:tab'] = (d) => { UI.ordersTab = d.t; UI.sel = {}; if (d.t !== 'open' && UI.ordersRange === 'overdue') UI.ordersRange = 'all'; refresh('ofilters,orders'); };
Actions['orders:by'] = (d) => { UI.ordersBy = d.v; refresh('ofilters,orders'); };
Changes['orders:range'] = (el) => { UI.ordersRange = el.value; if (el.value === 'overdue') { UI.ordersTab = 'open'; UI.ordersBy = 'due'; } refresh('ofilters,orders'); };
Changes['orders:date'] = (el) => { bindSet(el.dataset.bind, el.value); refresh('orders'); };
Changes['orders:sel'] = (el) => { if (el.checked) UI.sel[el.dataset.id] = true; else delete UI.sel[el.dataset.id]; refresh('orders'); };
Changes['orders:selall'] = (el) => { UI.sel = {}; if (el.checked) filteredOrders().forEach((o) => { UI.sel[o.id] = true; }); refresh('orders'); };
Actions['bulk:clear'] = () => { UI.sel = {}; refresh('orders'); };
Actions['bulk:done'] = () => { let n = 0; Object.keys(UI.sel).forEach((id) => { const o = findOrder(id); if (o && isOpen(o)) { markDone(o); n++; } }); UI.sel = {}; commit(); toast(plural(n, 'order') + ' marked done'); };
Actions['bulk:collect'] = () => {
  const list = Object.keys(UI.sel).map(findOrder).filter((o) => o && !o.voided && o.status !== 'collected');
  const owing = list.filter((o) => orderTotals(o).balance > 0);
  const go = () => { list.forEach(markCollected); UI.sel = {}; Modal.close(); commit(); toast(plural(list.length, 'order') + ' marked collected'); };
  if (!list.length) return toast('Nothing to collect in the selection');
  if (owing.length) Modal.confirm('Collect with balances?', plural(owing.length, 'order') + ' still ' + (owing.length === 1 ? 'has' : 'have') + ' a balance (' + esc(money(owing.reduce((s, o) => s + orderTotals(o).balance, 0))) + '). ' + (owing.length === 1 ? 'It' : 'They') + ' will stay on the customer\'s account.', 'Mark collected', go);
  else go();
};
Actions['bulk:print'] = () => { const list = Object.keys(UI.sel).map(findOrder).filter(Boolean); if (list.length) Print.jobs(list); };
Actions['orders:export'] = () => {
  const rows = UI.ordersView === 'board' ? S.orders.filter((o) => isOpen(o) || isReady(o)) : filteredOrders();
  const out = [['Order', 'Status', 'Customer', 'Phone', 'Ordered', 'Ready date', 'Pieces', 'Garments', 'Discount', 'Total', 'Paid', 'Balance', 'Done', 'Collected']];
  rows.forEach((o) => { const c = orderCustomer(o); const t = orderTotals(o); out.push([o.no, STATUS[orderState(o)].label, c.name, c.phone, localDate(o.createdAt), o.dueDate, orderPieces(o), orderSummary(o), t.discount, t.total, t.paid, t.balance, o.doneAt ? localDate(o.doneAt) : '', o.collectedAt ? localDate(o.collectedAt) : '']); });
  downloadCSV('orders-' + todayStr() + '.csv', out).then((ok) => { if (ok) toast(plural(rows.length, 'order') + ' exported'); });
};

// ===== 06b-view-pickup.js =====
// ---------- Pickup: find the customer's order, take the balance, hand over ----------
UI.pickupQ = UI.pickupQ || '';
UI.pickupF = UI.pickupF || 'all';
UI.pickupSort = UI.pickupSort || 'wait';
// ways to narrow the ready orders: [key, label, test(order, totals, days waiting), shown when nothing matches]
const PICKUP_FILTERS = [
  ['all', 'All ready', () => true, ''],
  ['due', 'To collect', (o, t) => t.balance > 0, 'Every ready order is paid'],
  ['paid', 'Paid', (o, t) => t.balance <= 0, 'No fully paid orders waiting'],
  ['untold', 'Not told yet', (o) => !o.notifiedAt, 'Everyone waiting has been told'],
  ['old', 'Waiting a week+', (o, t, days) => days >= 7, 'Nobody has waited a week or more']
];
const PICKUP_SORTS = [['wait', 'Waiting longest first'], ['new', 'Ready most recently'], ['due', 'Promised date'], ['amount', 'Most to collect'], ['name', 'Customer name A–Z']];
Views.pickup = {
  title: () => 'Pickup',
  render() {
    const ready = S.orders.filter(isReady);
    const due = ready.reduce((s, o) => s + orderTotals(o).balance, 0);
    return topbar('Pickup', plural(ready.length, 'order') + ' ready' + (due > 0 ? ' · ' + esc(money(due)) + ' to collect' : ''), '') +
      '<div class="content">' +
      '<label class="search grow pk-search">' + ico('search') + '<input type="search" data-bind="ui.pickupQ" data-refresh="pickup" placeholder="Customer name, mobile or order number" aria-label="Find an order to collect" value="' + esc(UI.pickupQ) + '"></label>' +
      '<div id="r-pickup">' + this.regions.pickup() + '</div></div>';
  },
  regions: {
    pickup() {
      const q = UI.pickupQ.trim().toLowerCase();
      const T0 = todayStr();
      const all = S.orders.filter((o) => isReady(o) && orderMatches(o, q)).map((o) => ({ o: o, t: orderTotals(o), days: daysBetween(localDate(o.doneAt), T0) }));
      const f = PICKUP_FILTERS.find((x) => x[0] === UI.pickupF) || PICKUP_FILTERS[0];
      const sortKey = { wait: (x) => x.o.doneAt || '', new: (x) => x.o.doneAt || '', due: (x) => x.o.dueDate || '9999', amount: (x) => x.t.balance, name: (x) => nameKey(orderCustomer(x.o).name) }[UI.pickupSort] || ((x) => x.o.doneAt || '');
      const ready = sortBy(all.filter((x) => f[2](x.o, x.t, x.days)), sortKey, UI.pickupSort === 'new' || UI.pickupSort === 'amount').map((x) => x.o);
      const bar = all.length ? '<div class="ofilters pk-filters"><div class="tabs-pill" role="tablist" aria-label="Show">' + PICKUP_FILTERS.map((x) => '<button type="button" role="tab" class="pill' + (f[0] === x[0] ? ' on' : '') + '" data-act="pickup:f" data-f="' + x[0] + '" aria-selected="' + (f[0] === x[0]) + '">' + x[1] + ' <span class="cnt">' + all.filter((y) => x[2](y.o, y.t, y.days)).length + '</span></button>').join('') + '</div>' +
        '<div class="filters"><select class="sel" data-onchange="pickup:sort" aria-label="Sort">' + PICKUP_SORTS.map((s) => '<option value="' + s[0] + '"' + (UI.pickupSort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>').join('') + '</select></div></div>' : '';
      const notReady = q ? sortBy(S.orders.filter((o) => isOpen(o) && orderMatches(o, q)), (o) => o.dueDate || '9999') : [];
      const today = q ? [] : sortBy(S.orders.filter((o) => !o.voided && o.status === 'collected' && localDate(o.collectedAt) === T0), (o) => o.collectedAt, true);
      const card = (o) => {
        const c = orderCustomer(o); const t = orderTotals(o);
        const days = daysBetween(localDate(o.doneAt), T0);
        const wa = waLink(c.phone, waMessage(o, S.settings.whatsappReady));
        return '<article class="pk-card' + (days >= 7 ? ' old' : '') + '">' +
          '<div class="pk-main"><div class="pk-top"><a class="mono strong" href="#order-' + o.id + '">' + esc(o.no) + '</a>' + statusChip(o) + (o.notifiedAt ? '<span class="chip ok">' + ico('whatsapp') + 'Notified</span>' : '') + '</div>' +
          '<div class="pk-cust">' + avatar(c.name) + '<div style="min-width:0"><b class="ellipsis" style="display:block">' + esc(c.name) + '</b><span class="small muted">' + esc(c.phone || 'No mobile') + '</span></div></div>' +
          '<div class="small muted ellipsis">' + esc(orderShort(o)) + '</div>' +
          '<div class="xsmall ' + (days >= 7 ? 'bad strong' : 'muted') + '">' + (days ? 'Waiting ' + plural(days, 'day') : 'Ready today') + '</div></div>' +
          '<div class="pk-side"><div class="pk-bal"><span class="eyebrow">' + (t.balance > 0 ? 'Amount to collect' : 'Paid') + '</span><b class="num ' + (t.balance > 0 ? 'bad' : 'ok') + '">' + esc(money(t.balance > 0 ? t.balance : t.total)) + '</b></div>' +
          '<div class="pk-act">' + (wa && !o.notifiedAt ? '<a class="btn sm icon" href="' + esc(wa) + '" target="_blank" rel="noopener" data-act="order:wa" data-id="' + o.id + '" title="Send WhatsApp: ready" aria-label="Send WhatsApp ready message">' + ico('whatsapp') + '</a>' : '') + '<button type="button" class="btn primary" data-act="order:collect" data-id="' + o.id + '">' + ico('bag') + '<span>' + (t.balance > 0 ? 'Collect & hand over' : 'Hand over') + '</span></button></div></div></article>';
      };
      let html = bar + (ready.length ? '<div class="pk-list">' + ready.map(card).join('') + '</div>'
        : all.length ? '<section class="card">' + emptyState('bag', f[3], (q ? 'Searching “' + esc(UI.pickupQ) + '” · ' : '') + 'Try another filter.') + '</section>'
        : '<section class="card">' + emptyState('bag', q ? 'Nothing ready matches “' + UI.pickupQ + '”' : 'Nothing waiting for pickup', q ? '' : 'Orders appear here as soon as they are marked done.') + '</section>');
      if (notReady.length) html += '<section class="card"><div class="card-h"><h2>Not ready yet</h2><span class="card-sub">Matching orders still being worked on</span></div><div class="olist compact">' + notReady.slice(0, 10).map((o) => orderRow(o, false)).join('') + '</div></section>';
      if (today.length) html += '<section class="card"><div class="card-h"><h2>Collected today</h2><span class="badge">' + today.length + '</span></div><div class="list pk-today">' + today.map((o) => { const c = orderCustomer(o); return '<div>' + avatar(c.name, 'sm') + '<div style="flex:1;min-width:0"><a class="strong" href="#order-' + o.id + '" style="color:inherit">' + esc(c.name) + '</a><div class="xsmall muted"><span class="mono">' + esc(o.no) + '</span> · ' + esc(fmtDT(o.collectedAt).slice(-5)) + (o.collectedByName ? ' · by ' + esc(o.collectedByName) : '') + '</div></div><span class="num small">' + esc(money(orderTotals(o).total)) + '</span></div>'; }).join('') + '</div></section>';
      return html;
    }
  }
};
Actions['pickup:f'] = (d) => { UI.pickupF = d.f; refresh('pickup'); };
Changes['pickup:sort'] = (el) => { UI.pickupSort = el.value; refresh('pickup'); };

// ---------- Order screen ----------
Views.order = {
  title: () => { const o = findOrder(UI.id); return o ? 'Order ' + o.no : 'Order'; },

    const c = orderCustomer(o);
    const t = orderTotals(o);

    const live = !o.voided && o.status !== 'collected';

      (wa ? '<a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener" data-act="order:wa" data-id="' + o.id + '">' + ico('whatsapp') + '<span>' + (o.status === 'done' ? 'WhatsApp: ready' : 'WhatsApp') + '</span></a>' : '') +

    const header = topbar('<span class="mono">' + esc(o.no) + '</span> ' + statusChip(o) + (o.rush ? ' <span class="tag rush">' + ico('bolt') + 'Rush</span>' : ''), esc(c.name) + ' · ordered ' + esc(fmtDT(o.createdAt)), actions, '#orders', { noSearch: true, crumb: '<a href="#orders">Orders</a>' + ico('chevron') + '<span>Order ' + esc(o.no) + '</span>' });

        (it.note ? '<div class="oitem-f"><span class="oitem-note">' + ico('edit') + esc(it.note) + '</span></div>' : '') + '</div></div>'; }).join('') +

      '<div class="balance-row"><span>' + (t.balance > 0 ? 'Balance due' : 'Balance') + '</span><span class="big ' + (t.balance > 0 ? 'bad' : 'ok') + '">' + esc(money(t.balance)) + '</span></div></div>' +
      (o.payments.length ? '<div class="paylines">' + o.payments.map((p) => '<div class="payline"><span class="pl-ic">' + ico(p.amount < 0 ? 'undo' : p.method === 'Cash' ? 'cash' : p.method === 'Card' ? 'wallet' : 'receipt') + '</span><div style="flex:1;min-width:0"><b class="small">' + esc(p.note || 'Payment') + ' · ' + esc(methodLabel(p.method)) + '</b><div class="xsmall muted">' + esc(fmtDT(p.at)) + (p.by ? ' · ' + esc(p.by) : '') + '</div></div><span class="num strong' + (p.amount < 0 ? ' bad' : '') + '">' + esc(money(p.amount)) + '</span></div>').join('') + '</div>' : '') +
      (!o.voided && t.balance > 0 ? '<button type="button" class="btn dark lg block" data-act="order:pay" data-id="' + o.id + '">' + ico('cash') + '<span>Take payment</span></button>' : '') +

      (c.card ? '<div class="kv"><span>Measurement card</span><span class="mono">' + esc(c.card) + '</span></div>' : '') + (c.notes ? '<div class="cust-note">' + esc(c.notes) + '</div>' : '') + '</div></section>';

function openPaymentModal(o, collect) {

// Desktop: catalogue on the left, a full-height ticket on the right. Phone: catalogue, then the ticket, with a bottom bar.
function draft() { if (!S.draft) S.draft = newDraft(); return S.draft; }
const targetItem = (d) => d.items.find((i) => i.id === d.target) || null;
const draftMinutes = (d) => d.items.reduce((s, it) => s + itemMinutes(it), 0); // kept for later; workload uses value
const shortMoneyPos = (v) => { v = round2(v); return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(v)); };
const draftWork = (d) => round2(d.items.reduce((s, it) => s + itemWork(it), 0));
const taskFrom = (t) => { if (!t.variants.length) return { minutes: num(t.minutes), price: num(t.price) }; return { minutes: Math.min.apply(null, t.variants.map((v) => num(v.minutes))), price: Math.min.apply(null, t.variants.map((v) => num(v.price))) }; };
// garment picture or icon at a fixed size (also used by the catalogue editor)
function catImage(g, size) {
  const px = size || 56;
  if (g.image) return '<img class="gthumb" src="' + esc(g.image) + '" alt="" style="width:' + px + 'px;height:' + px + 'px">';
  return '<span class="gicon" style="width:' + px + 'px;height:' + px + 'px">' + garmentIcon(g.icon) + '</span>';
}
// garment art that fills its container (tiles, ticket lines, search results)
const posArt = (g) => (g && g.image ? '<img src="' + esc(g.image) + '" alt="">' : garmentIcon(g ? g.icon : 'generic'));
function firstDayWithRoom(start, extra, excludeId) {
  for (let i = 0; i < 90; i++) { const dstr = addDays(start, i); const l = dayLoad(dstr, extra, excludeId); if (l.level !== 'full' && l.level !== 'closed') return dstr; }
  return start;
}
function addTaskToDraft(d, g, t, v) {
  let it = targetItem(d);
  if (!it || it.catId !== g.id) {
    it = { id: uid(), catId: g.id, garment: g.name, qty: 1, tasks: [], note: '' };
    d.items.push(it); d.target = it.id;
  }
  const ex = it.tasks.find((x) => x.taskId === t.id);
  const make = () => ({ id: uid(), taskId: t.id, variantId: v ? v.id : '', name: t.name, variant: v ? v.name : '', group: t.group, minutes: num(v ? v.minutes : t.minutes), price: num(v ? v.price : t.price) });
  if (ex && (!v || ex.variantId === v.id)) {
    it.tasks.splice(it.tasks.indexOf(ex), 1);
    if (!it.tasks.length) { d.items.splice(d.items.indexOf(it), 1); d.target = null; }
    return 'Removed ' + t.name + (v ? ' / ' + v.name : '');
  }
  if (ex) { Object.assign(ex, make(), { id: ex.id }); return g.name + ': ' + t.name + ' changed to ' + v.name; }
  it.tasks.push(make());
  return g.name + ': ' + t.name + (v ? ' / ' + v.name : '') + ' added';
}

// remember where the ticket list was scrolled, so a re-render doesn't jump
function posKeepTicketScroll(d) {

// the garment strip keeps its scroll, and the garment being worked on stays in view
function posKeepStrip() {
  const s0 = $('#r-pickbody .gstrip'); const prev = s0 ? s0.scrollLeft : 0;
  requestAnimationFrame(() => {
    const s = $('#r-pickbody .gstrip'); if (!s) return;
    s.scrollLeft = prev;
    const on = s.querySelector('.gchip.on'); if (!on) return;
    const sr = s.getBoundingClientRect(), cr = on.getBoundingClientRect();
    if (cr.left < sr.left) s.scrollLeft -= sr.left - cr.left + 24;
    else if (cr.right > sr.right) s.scrollLeft += cr.right - sr.right + 24;
  });

    cal() {
      const d = draft();
      const extra = draftWork(d);
      const T0 = todayStr();
      const month = d.calMonth || (d.dueDate || T0).slice(0, 7);
      const first = month + '-01';
      const startPad = weekday(first);
      const dim = new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0).getDate();
      const cells = [];
      for (let i = 0; i < startPad; i++) cells.push('<span class="day-pad"></span>');
      for (let day = 1; day <= dim; day++) {
        const ds = month + '-' + pad2(day);
        const past = ds < T0;
        const l = dayLoad(ds, extra, d.editingId);
        const lb = dayLoad(ds, 0, d.editingId);
        const sel = ds === d.dueDate;
        const pct = lb.cap ? Math.round(lb.booked / lb.cap * 100) : 0;
        const sub = l.level === 'unknown' ? (lb.booked ? shortMoneyPos(lb.booked) : '') : l.level === 'closed' ? 'Closed' : (lb.cap ? pct + '%' : '');
        const bar = !past && (l.level === 'free' || l.level === 'busy' || l.level === 'full') ? '<span class="dbar"><i style="width:' + Math.max(4, Math.min(100, l.pct || 0)) + '%"></i></span>' : '<span class="dbar none"></span>';
        const label = fmtDay(ds) + (l.level === 'closed' ? ', closed' : l.level !== 'unknown' ? ', ' + LOAD_STYLE[l.level].label + ' ' + (l.pct || 0) + '% with this order' : '');
        cells.push('<button type="button" class="day lv-' + l.level + (sel ? ' sel' : '') + (ds === T0 ? ' today' : '') + '" data-act="draft:pick-date" data-date="' + ds + '"' + (past ? ' disabled' : '') + ' aria-pressed="' + sel + '" aria-label="' + esc(label) + '" title="' + esc(label) + '"><span class="dn">' + day + '</span><span class="dl">' + esc(past ? '' : sub) + '</span>' + bar + '</button>');
      }
      const mlabel = fmtD(new Date(first + 'T00:00:00'), { month: 'long', year: 'numeric' });
      let detail = '';
      if (d.dueDate) {
        const l = dayLoad(d.dueDate, extra, d.editingId);
        const diff = daysBetween(T0, d.dueDate);
        const rel = diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : diff > 1 ? 'in ' + diff + ' days' : 'in the past';
        const people = shopWorkers().filter((s) => num((s.cap || [])[weekday(d.dueDate)]) > 0).map((s) => s.name);
        const head = '<div class="cd-day">' + ico('calendar') + '<span><b>' + esc(fmtDay(d.dueDate, true)) + '</b><span class="muted"> · ' + rel + '</span></span></div>';
        if (l.level === 'unknown') detail = head + '<div class="cd-txt">' + esc(money(l.booked)) + ' of work already due, this order adds ' + esc(money(extra)) + '. <span class="muted">Add staff and their daily capacity in Settings → Staff &amp; capacity to see how full the day is.</span></div>';
        else {
          const tone = l.level === 'closed' ? '' : posLevelTone(l.level);
          const cap = l.cap || 1;
          detail = head + '<div class="cd-meter"><span class="cd-track"><i class="cd-booked" style="width:' + Math.min(100, l.booked / cap * 100) + '%"></i><i class="cd-this ' + tone + '" style="left:' + Math.min(100, l.booked / cap * 100) + '%;width:' + Math.max(0, Math.min(100 - l.booked / cap * 100, extra / cap * 100)) + '%"></i></span><span class="chip ' + tone + '">' + esc(l.level === 'closed' ? 'Nobody working' : LOAD_STYLE[l.level].label + (l.pct != null ? ' · ' + l.pct + '%' : '')) + '</span></div>' +
            '<div class="cd-txt">Already due ' + esc(money(l.booked)) + ' + this order ' + esc(money(extra)) + ' of ' + esc(money(l.cap)) + ' daily capacity' + (people.length ? ' <span class="muted">(' + esc(people.join(', ')) + ')</span>' : '') + '</div>';
        }
      } else detail = '<div class="cd-txt muted">Pick the day the order will be ready.</div>';
      return '<div class="cal-h"><div class="cal-nav"><button type="button" class="btn icon sm" data-act="draft:cal" data-delta="-1" aria-label="Previous month">' + ico('back') + '</button><b class="cal-m">' + esc(mlabel) + '</b><button type="button" class="btn icon sm" data-act="draft:cal" data-delta="1" aria-label="Next month">' + ico('arrowRight') + '</button></div><button type="button" class="btn sm" data-act="draft:earliest">' + ico('sparkle') + '<span>Earliest day with room</span></button></div>' +
        '<div class="cal">' + DAYS.map((x) => '<span class="dow">' + x + '</span>').join('') + cells.join('') + '</div>' +
        '<div class="legend">' + (shopWorkers().length ? '<span><i class="lg lg-free"></i>Room</span><span><i class="lg lg-busy"></i>Busy</span><span><i class="lg lg-full"></i>Full</span><span><i class="lg lg-closed"></i>Closed</span><span class="lg-note">% = work already booked that day · bar includes this order</span>' : '<span class="lg-note">Times show work already booked for that day.</span>') + '</div>' +
        '<div class="cal-detail">' + detail + '</div>';

// Picking a garment that is already on the order adds to that piece (a second piece of the same garment
// is rare: "Another …" starts one). After a job is added the screen goes back to all garments.
function posPickTarget(dr, catId) {
  const cur = targetItem(dr);
  if (cur && cur.catId === catId) return;
  const last = dr.items.filter((x) => x.catId === catId).slice(-1)[0];

}
function posAdded(dr, msg) {
  if (/^Removed /.test(msg)) return; // un-ticking a job stays on the list

  requestAnimationFrame(() => { const p = $('#r-picker'), tb = $('.topbar'); if (!p) return; const off = (tb ? tb.getBoundingClientRect().height : 0) + 8; const top = p.getBoundingClientRect().top; if (top < off) window.scrollTo({ top: Math.max(0, window.scrollY + top - off) }); });
}

  const dr = draft();
  if (dr.custMode === 'new' && !String(dr.newCustomer.name || '').trim() && String(dr.newCustomer.phone || '').trim()) return toast('Enter the customer\'s name');
  const dup = dr.custMode === 'new' && String(dr.newCustomer.name || '').trim() ? customerWithPhone(dr.newCustomer.phone) : null;
  if (dup && dr.dupOk !== phoneKey(dr.newCustomer.phone)) return draftDupAsk(dr, dup);
  const pr = dr.printReceipt, pj = dr.printJob;
  if (Actions['draft:save'].busy) return;
  let res;
  try { res = saveDraft(dr); } catch (e) { toast(e.message); refresh('pay'); return; }
  const p = save();
  if (Remote.on) {
    // wait for the shop PC to confirm and give the order its number before printing
    Actions['draft:save'].busy = true;
    toast('Saving…');

      Actions['draft:save'].busy = false;
      nav('#order-' + res.order.id);
      toast(Remote.online ? (res.created ? 'Order ' + res.order.no + ' saved' : 'Changes saved') : (Remote.kind === 'cloud' ? 'Saved on this device — it goes online when the connection is back' : 'Saved on this device — will reach the shop PC when connected'));
      if ((pr || pj) && (Remote.online || Remote.kind === 'cloud')) setTimeout(() => (pr && pj ? Print.both(res.order) : pr ? Print.receipt(res.order) : Print.job(res.order)), 200);

  }
  nav('#order-' + res.order.id);

};

function garmentPriceRange(g) {
  const ps = [];
  g.tasks.forEach((t) => { if (t.variants.length) t.variants.forEach((v) => ps.push(num(v.price))); else ps.push(num(t.price)); });
  const nz = ps.filter((x) => x > 0);
  if (!nz.length) return '';
  const lo = Math.min(...nz), hi = Math.max(...nz);
  return lo === hi ? money(lo) : money(lo) + ' – ' + money(hi);
}

function shrinkImage(dataUrl, max, cb) {
  try {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        // a white background, so see-through parts of a PNG don't turn black in the JPEG
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.85));
      } catch (e) { cb(dataUrl); }
    };
    img.onerror = () => cb(dataUrl);
    img.src = dataUrl;
  } catch (e) { cb(dataUrl); }
}

// there must always be an Admin (and, while sign-in is on, one who can sign in)
const lastAdminCheck = (s, what) => {
  if (s.access !== 'admin') return true;
  const others = Auth.admins().filter((a) => a.id !== s.id);
  if (!others.length) { toast('Keep at least one Admin — ' + what); return false; }
  if (S.settings.login.required && !others.some((a) => a.pinHash)) { toast('Keep at least one Admin with a PIN while sign-in is on — ' + what); return false; }
  return true;
};
Actions['user:make-admin'] = (d) => { const s = findStaff(d.id); if (!s) return; s.access = 'admin'; commit(); toast(s.name + ' is now Admin' + (s.pinHash ? '' : ' — set a PIN next')); if (!s.pinHash) pinModal(s, false); };
function newRecoveryKey() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let raw = '';
  const rnd = new Uint32Array(12);
  try { crypto.getRandomValues(rnd); } catch (e) { for (let i = 0; i < 12; i++) rnd[i] = Math.floor(Math.random() * 4294967296); }
  for (let i = 0; i < 12; i++) raw += abc[rnd[i] % abc.length];
  S.settings.login.recoveryHash = sha256u('recovery:' + raw);
  return raw.slice(0, 4) + '-' + raw.slice(4, 8) + '-' + raw.slice(8);
}
function showRecoveryKey(key, then) {
  Modal.open({
    title: 'Recovery key', data: {},
    render: () => '<div class="small">If every admin forgets their PIN, this key unlocks the POS as admin from the sign-in screen (Forgot PIN?). Write it down and keep it away from the counter.</div><div class="rkey mono">' + esc(key) + '</div><div class="small muted">It is shown only now. You can make a new one later in Settings → Users &amp; sign-in.</div>',
    footer: () => '<button type="button" class="btn" data-act="rkey:copy" data-k="' + esc(key) + '">' + ico('copy') + '<span>Copy</span></button><button type="button" class="btn primary" data-act="modal:ok">I’ve written it down</button>',
    onOk: () => { Modal.close(); if (then) then(); }
  });
}
Actions['rkey:copy'] = (d) => { try { navigator.clipboard.writeText(d.k).then(() => toast('Recovery key copied'), () => toast('Copy it by hand')); } catch (e) { toast('Copy it by hand'); } };
Changes['login:required'] = (el) => {
  const L = S.settings.login;
  if (el.checked) {
    if (!Auth.admins().some((a) => a.pinHash)) { el.checked = false; return toast('Give an admin a PIN first'); }
    L.required = true;
    if (!S.settings.attFrom) S.settings.attFrom = todayStr(); // attendance is counted from today
    const key = L.recoveryHash ? '' : newRecoveryKey();
    commit();
    const after = () => { toast('Sign-in is on — sign in with your PIN'); Auth.lock(); };
    if (key) showRecoveryKey(key, after); else after();
  } else {
    L.required = false; Auth.uid = ''; Auth.persist(); commit(); toast('Sign-in is off — actions are recorded as ' + (S.settings.cashier || 'Cashier'));
  }
};

Actions['login:recovery'] = () => Modal.confirm('Make a new recovery key?', 'The old key stops working.', 'Make new key', () => { const key = newRecoveryKey(); commit(); showRecoveryKey(key); });
Changes['user:access'] = (el) => {

};

  Modal.confirm('Remove ' + s.name + '’s PIN?', 'They won’t be able to sign in until they get a new PIN.', 'Remove PIN', () => { delete s.pinHash; delete s.pinLen; Modal.close(); commit(); toast('PIN removed'); }, true);
};

  S.staff.push(s); UI.newUser = { name: '', role: '', access: 'tailor' }; commit();

  const i = list.indexOf(el.dataset.perm);

// ===== 10c-import.js =====
// ---------- bring in the records of the shop's old POS (a Needle Studio backup file) ----------
// The old backup holds the item list (garments, their jobs with prices, photos), customers, orders with payments,
// staff names and clock-ins. Everything brought in gets a stable id starting "ns-", so bringing in a newer backup
// later (on the day the shop switches over) updates the same records instead of adding them twice.
const OLD_POS = 'Needle Studio';
const isOldBackup = (x) => !!x && typeof x === 'object' && !Array.isArray(x) && Array.isArray(x.items) && Array.isArray(x.orders) && Array.isArray(x.customers) &&
  x.orders.every((o) => o && typeof o === 'object' && 'orderNumber' in o && Array.isArray(o.items));
const isFromOld = (r) => !!r && String(r.id || '').indexOf('ns_') === 0;
const oldTime = (t) => {
  if (t && typeof t === 'object' && isFinite(t.seconds)) return new Date(t.seconds * 1000).toISOString();
  if (typeof t === 'string' && t && !isNaN(Date.parse(t))) return new Date(t).toISOString();
  return null;
};
const oldSlug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'x';
const oldSafeId = (s) => String(s || '').replace(/[^A-Za-z0-9_]/g, '_').slice(0, 120) || uid();
const oldMethod = (m) => { m = String(m || '').toLowerCase(); return m === 'card' ? 'Card' : /bank|transfer/.test(m) ? 'Transfer' : m === 'cash' || !m ? 'Cash' : m.charAt(0).toUpperCase() + m.slice(1); };
// UAE mobiles become 050 123 4567, the way the shop types them, so searching by number keeps working; others stay as typed
function oldPhone(raw) {
  const show = String(raw == null ? '' : raw).trim();
  const p = phoneKey(show);
  if (!p) return { key: '', show: show };
  return { key: p, show: /^05\d{8}$/.test(p) ? p.slice(0, 3) + ' ' + p.slice(3, 6) + ' ' + p.slice(6) : show };
}
// the app's own picture for a garment name (the photo from the old software is shown instead when there is one)
function oldIcon(name) {
  const n = String(name || '').toLowerCase();
  const pick = [[/jean/, 'jeans'], [/skirt/, 'skirt'], [/abaya/, 'abaya'], [/kand[ou]+ra|dishdash/, 'kandura'], [/curtain/, 'curtain'], [/scarf|shawl|sheila/, 'scarf'], [/blouse/, 'blouse'],
    [/pant|trouser|short/, 'trouser'], [/jump|dress|gown/, 'dress'], [/jacket|coat|blazer|vest|suit/, 'jacket'], [/shirt|top\b|tee/, 'shirt']];
  for (let i = 0; i < pick.length; i++) if (pick[i][0].test(n) && GARMENT_ICON_KEYS.indexOf(pick[i][1]) >= 0) return pick[i][1];
  return 'generic';
}
// the kind of work, for the reports: the old software filed nearly everything under "Alterations"
function oldGroup(m) {
  const n = String(m.name || '').trim(), c = String(m.category || '');
  if (/^tailor/i.test(c) || /\bmake\b|making|stitching new/i.test(n)) return 'Tailoring';
  if (/repair|zip/i.test(n)) return 'Repair';
  if (/iron/i.test(n)) return 'Add-ons';
  if (/^other$/i.test(n)) return 'Other';
  return 'Alterations';
}
const oldPicture = (src) => new Promise((resolve) => { if (!/^data:image\//.test(String(src || ''))) return resolve(null); shrinkImage(src, 320, resolve); });

// items → garments: each "modifier" is a job; one option is its price, several options are its choices
function oldCatalogue(items) {
  const byId = {};
  const cat = items.map((it) => {
    const gid = 'ns_' + oldSafeId(it.id);
    const tasks = [], ref = {}, used = {};
    const uniq = (base) => { let id = base, k = 2; while (used[id]) id = base + '_' + (k++); used[id] = 1; return id; };
    const clean = (s) => String(s || '').trim().replace(/\s+/g, ' ');
    (it.modifiers || []).forEach((m) => {
      const opts = (m.options || []).filter((op) => op && clean(op.name));
      if (!opts.length) return;
      const mname = clean(m.name) || 'Work', one = opts.length === 1;
      const tid = uniq(gid + '~' + oldSlug(mname));
      const t = { id: tid, group: oldGroup(m), name: one ? clean(opts[0].name) : mname, minutes: 0, price: one ? round2(num(opts[0].price)) : 0, variants: [] };
      if (!one) opts.forEach((op) => t.variants.push({ id: uniq(tid + '~' + oldSlug(op.name)), name: clean(op.name), minutes: 0, price: round2(num(op.price)) }));
      tasks.push(t);
      opts.forEach((op, j) => { ref[mname.toLowerCase() + '\u0001' + clean(op.name).toLowerCase()] = [t, one ? null : t.variants[j]]; });
    });
    if (!tasks.length) tasks.push({ id: gid + '~work', group: 'Other', name: 'Work', minutes: 0, price: round2(num(it.price)), variants: [] });
    const g = { id: gid, name: clean(it.name) || 'Item', icon: oldIcon(it.name), image: null, tasks: tasks };
    byId[it.id] = { g: g, ref: ref, pic: typeof it.image === 'string' ? it.image : '' };
    return g;
  });
  return { cat: cat, byId: byId };
}

// old staff names → this shop's staff ("Owner" is the admin); people not on the staff keep their name
function oldStaff() {
  const byName = {};
  S.staff.forEach((s) => { byName[String(s.name || '').trim().toLowerCase()] = s; });
  const owner = S.staff.find((s) => s.access === 'admin');
  const map = {};
  const who = (n) => {
    n = String(n || '').trim(); if (!n) return { id: '', name: '' };
    const k = n.toLowerCase(), s = byName[k] || (k === 'owner' ? owner : null);
    const r = s ? { id: s.id, name: s.name } : { id: 'ns_' + oldSlug(n), name: n };
    map[n] = r;
    return r;
  };
  who.map = map;
  return who;
}

// customers: the saved list, plus everyone who ordered with a phone number, one per number
function oldCustomers(file) {
  const list = [], byKey = {}, byNamePhone = {};
  const named = (rec, name, at) => { const k = name.toLowerCase(); const x = rec._names[k] || (rec._names[k] = { name: name, n: 0, last: '' }); x.n++; if (at > x.last) x.last = at; };
  sortBy(file.customers || [], (c) => oldTime(c.createdAt) || '').forEach((c) => {
    const name = String(c.name || '').trim() || 'Customer', ph = oldPhone(c.phone);
    if (ph.key && byKey[ph.key]) { named(byKey[ph.key], name, ''); return; }
    const rec = { id: 'ns_c' + (ph.key || '_' + oldSafeId(c.id)), name: name, phone: ph.show, card: '', notes: '', createdAt: oldTime(c.createdAt) || nowISO(), _saved: true, _names: {} };
    list.push(rec);
    if (ph.key) byKey[ph.key] = rec; else byNamePhone[name.toLowerCase() + '|' + digits(c.phone)] = rec;
  });
  sortBy(file.orders || [], (o) => oldTime(o.createdAt) || '').forEach((o) => {
    const name = String(o.customerName || '').trim(), ph = oldPhone(o.customerPhone), at = oldTime(o.createdAt) || '';
    if (!ph.key) return;
    let rec = byKey[ph.key];
    if (!rec) { rec = { id: 'ns_c' + ph.key, name: name || 'Customer', phone: ph.show, card: '', notes: '', createdAt: at || nowISO(), _saved: false, _names: {} }; list.push(rec); byKey[ph.key] = rec; }
    if (name) named(rec, name, at);
  });
  // the name: the saved one, or the one used most on the orders (the latest if tied); other spellings go in the notes
  list.forEach((rec) => {
    const names = Object.keys(rec._names).map((k) => rec._names[k]);
    if (!rec._saved && names.length) rec.name = sortBy(names, (x) => pad2(Math.min(99, x.n)) + x.last, true)[0].name;
    const other = names.filter((x) => x.name.toLowerCase() !== rec.name.toLowerCase()).map((x) => x.name);
    if (other.length) rec.notes = 'Also on old orders as: ' + other.slice(0, 4).join(', ');
  });
  const find = (o) => { const ph = oldPhone(o.customerPhone); return ph.key ? byKey[ph.key] : byNamePhone[String(o.customerName || '').trim().toLowerCase() + '|' + digits(o.customerPhone)] || null; };
  return { list: list.map((r) => { const c = Object.assign({}, r); delete c._names; delete c._saved; return c; }), find: (o) => { const r = find(o); return r ? { id: r.id, name: r.name } : null; }, saved: list.filter((r) => r._saved).length };
}

// one old order → one order here, with its own prices, payments and history
function oldOrder(o, cat, cust, who) {
  const id = 'ns_' + oldSafeId(o.id);
  const created = oldTime(o.createdAt) || nowISO();
  const ref = (itemId) => cat.byId[itemId] || null;
  const items = (o.items || []).map((it, i) => {
    const m = ref(it.itemId), iid = id + '_' + i;
    const tasks = (it.selections || []).map((x, j) => {
      const tn = String(x.taskName || '').trim().replace(/\s+/g, ' '), nm = String(x.name || '').trim().replace(/\s+/g, ' ');
      const opt = nm.indexOf(' / ') >= 0 ? nm.split(' / ').slice(1).join(' / ') : nm;
      const hit = m ? (m.ref[tn.toLowerCase() + '\u0001' + opt.toLowerCase()] || m.ref[tn.toLowerCase() + '\u0001' + nm.toLowerCase()]) : null;
      const t = hit ? hit[0] : null, v = hit ? hit[1] : null;
      return { id: iid + '_' + j, taskId: t ? t.id : '', variantId: v ? v.id : '', name: t ? t.name : (tn || nm || 'Work'), variant: v ? v.name : (!t && opt && opt !== tn ? opt : ''), group: t ? t.group : 'Other', minutes: 0, price: round2(num(x.price)) };
    });
    if (num(it.basePrice) > 0) tasks.unshift({ id: iid + '_base', taskId: '', variantId: '', name: 'Base price', variant: '', group: 'Other', minutes: 0, price: round2(num(it.basePrice)) });
    if (!tasks.length) tasks.push({ id: iid + '_0', taskId: '', variantId: '', name: 'Work', variant: '', group: 'Other', minutes: 0, price: 0 });
    return { id: iid, catId: m ? m.g.id : '', garment: String(it.name || (m && m.g.name) || 'Item').trim(), qty: Math.max(1, Math.round(num(it.qty)) || 1), note: '', tailorId: '', tasks: tasks };
  });
  const dv = round2(num(o.manualDiscountValue));
  const discount = dv > 0 ? (o.manualDiscountType === 'percent' ? { label: 'Discount', type: 'pct', value: Math.min(100, dv) } : { label: 'Discount', type: 'amt', value: dv })
    : num(o.discountPercent) > 0 ? { label: 'Discount', type: 'pct', value: Math.min(100, num(o.discountPercent)) } : null;
  // VAT as the old order had it: added on top when its total is the price after discount plus the tax, otherwise included
  const rate = num(o.taxRate), sub = num(o.subtotal), tax = num(o.taxAmount);
  const off = discount ? (discount.type === 'pct' ? sub * discount.value / 100 : discount.value) : 0;
  const vat = { rate: rate, incl: !(rate > 0 && tax > 0 && Math.abs(sub - off + tax - num(o.total)) < 0.02) };
  const status = o.status === 'collected' ? 'collected' : o.status === 'ready' ? 'done' : 'open';
  const readyAt = oldTime(o.readyAt), delAt = oldTime(o.deliveredAt), voided = !!o.voided;
  const raw = (o.payments || []).filter((p) => p && num(p.amount));
  const near = (a, b) => !!a && !!b && Math.abs(Date.parse(a) - Date.parse(b)) < 10 * 60000;
  // a voided order is not counted; what had been paid on it is written in its note instead
  const pays = voided ? [] : raw.map((p, k) => { const at = oldTime(p.at) || created, b = who(p.by); return { id: id + '_p' + k, amount: round2(num(p.amount)), method: oldMethod(p.method), at: at, note: near(at, created) ? 'Advance at order' : near(at, delAt) ? 'Paid on collection' : 'Payment', by: b.name, byId: b.id }; });
  const paidVoid = voided ? round2(raw.reduce((s, p) => s + num(p.amount), 0)) : 0;
  const c = cust.find(o), ph = oldPhone(o.customerPhone), booker = who(o.bookedBy);
  const order = {
    id: id, no: String(o.orderNumber), createdAt: created, createdBy: booker.id, createdByName: booker.name,
    customerId: c ? c.id : null, customerName: String(o.customerName || '').trim() || (c ? c.name : 'Walk-in'), customerPhone: ph.show,
    dueDate: /^\d{4}-\d{2}-\d{2}$/.test(String(o.dueDate || '')) ? o.dueDate : localDate(oldTime(o.estimatedReadyAt) || created),
    rush: false, discount: discount, note: String(o.notes || '').trim(), location: '', status: status, voided: voided,
    items: items, payments: pays, events: [], doneAt: null, collectedAt: null, notifiedAt: null, vat: vat, imported: { from: OLD_POS, no: o.orderNumber }
  };
  if (paidVoid) order.note = (order.note ? order.note + ' · ' : '') + 'Voided in the old software. ' + money(paidVoid) + ' had been paid on it there (' + raw.map((p) => oldMethod(p.method).toLowerCase()).filter((x, i, a) => a.indexOf(x) === i).join(', ') + '); it is not counted here.';
  if (status !== 'open') { const d = who(o.preparedBy || o.deliveredBy); order.doneAt = readyAt || delAt || created; order.doneBy = d.id; order.doneByName = d.name; }
  if (status === 'collected') { const d = who(o.deliveredBy); order.collectedAt = delAt || order.doneAt; order.collectedBy = d.id; order.collectedByName = d.name; }
  if (voided) { const d = who(o.voidedBy); order.voidedAt = oldTime(o.voidedAt) || created; order.voidedBy = d.id; order.voidReason = String(o.voidReason || '').trim(); }
  // the history, newest first (as the app writes it)
  const ev = [];
  const add = (at, text, p) => { if (at) ev.push({ at: at < created ? created : at, text: text, by: p.name, byId: p.id, n: ev.length }); };
  add(created, 'Order created · ' + plural(orderPieces(order), 'piece') + ' · ' + money(orderWork(order)) + ' of work', booker);
  pays.forEach((p) => add(p.at, 'Payment ' + money(p.amount) + ' (' + p.method.toLowerCase() + ')', { id: p.byId, name: p.by }));
  if (order.doneAt) add(order.doneAt, 'Marked done — ready for pickup', { id: order.doneBy, name: order.doneByName });
  if (order.collectedAt) { const bal = orderTotals(order).balance; add(order.collectedAt, 'Collected by customer' + (bal > 0 ? ' · ' + money(bal) + ' on account' : ''), { id: order.collectedBy, name: order.collectedByName }); }
  if (voided) add(order.voidedAt, 'Order voided' + (order.voidReason ? ' · ' + order.voidReason : ''), { id: order.voidedBy, name: who(o.voidedBy).name });
  order.events = ev.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : b.n - a.n)).map((e) => ({ at: e.at, text: e.text, by: e.by, byId: e.byId }));
  return { order: order, totalOk: Math.abs(orderTotals(order).total - num(o.total)) < 0.01 };
}

// clock-ins in the old software count as days at the shop
function oldAttendance(file, who) {
  const out = {};
  (file.timesheets || []).forEach((t) => {
    // someone not on the staff list yet keeps their days under their old-software id, for when they are added
    const p = who(t.employeeName), s = p.id ? findStaff(p.id) : null;
    if (s ? !isWorker(s) : !p.id || isOwnerName(p.name)) return;
    const sid = s ? s.id : p.id;
    const at = oldTime(t.clockIn); if (!at) return;
    const d = localDate(at), id = sid + '_' + d;
    if (!out[id] || at < out[id].seen) out[id] = { id: id, staffId: sid, date: d, mark: '', seen: at };
  });
  return Object.keys(out).map((k) => out[k]);
}
// the last time the old software's drawer was emptied, as a cash collection: the drawer here counts from then
function oldDrawer(file, orders, who) {
  const s = file.settings || {}, at = oldTime(s.drawerEmptiedAt);
  if (!at) return null;
  const b = who(s.drawerEmptiedBy || 'Owner'), left = round2(Math.max(0, num(s.drawerStartAmount)));
  let cashIn = 0, cashOut = 0, card = 0, count = 0;
  orders.forEach((o) => o.payments.forEach((p) => { if (p.at > at) return; if (p.method === 'Cash') { count++; if (p.amount > 0) cashIn += p.amount; else cashOut -= p.amount; } else card += p.amount; }));
  const expected = round2(cashIn - cashOut), counted = Math.max(expected, left);
  return { id: 'ns_drawer_' + oldSafeId(at), kind: 'cash', at: at, from: '', by: b.name, byId: b.id, float: 0, cashIn: round2(cashIn), cashOut: round2(cashOut), expenses: 0, expected: expected,
    counted: counted, diff: round2(counted - expected), taken: round2(counted - left), left: left, count: count, expCount: 0, card: round2(card), note: 'Drawer emptied in ' + OLD_POS + ', ' + money(left) + ' left in it' };
}
function oldShop(file) {
  const s = file.settings || {}, out = {};
  const name = String(s.businessName || file.businessName || '').trim(); if (name) out.shopName = name;
  const ph = oldPhone(s.phone); if (ph.show) out.phone = /^05\d{8}$/.test(ph.key) ? '+971 ' + ph.key.slice(1, 3) + ' ' + ph.key.slice(3, 6) + ' ' + ph.key.slice(6) : ph.show;
  const ad = String(s.address || '').trim(); if (ad) out.address = ad;
  const ft = String(s.receiptFooterNote || '').trim(); if (ft) out.receiptFooter = ft;
  return out;
}

// everything the file holds, converted, with the figures the confirmation shows
async function oldPlan(file) {
  const cat = oldCatalogue(file.items || []);
  await Promise.all(Object.keys(cat.byId).map(async (k) => { const m = cat.byId[k]; if (m.pic) m.g.image = await oldPicture(m.pic); }));
  const who = oldStaff(), cust = oldCustomers(file);
  const conv = (file.orders || []).map((o) => oldOrder(o, cat, cust, who));
  const orders = conv.map((x) => x.order);
  const live = orders.filter((o) => !o.voided);

  const dates = orders.map((o) => o.createdAt).sort(), nos = orders.map((o) => +o.no).filter((n) => isFinite(n)).sort((a, b) => a - b);

  return {

    stats: {

      voided: orders.length - live.length, voidPaid: round2(orders.reduce((s, o, i) => s + (o.voided ? round2((file.orders[i].payments || []).reduce((a, p) => a + num(p.amount), 0)) : 0), 0)),
      voidPaidN: orders.filter((o, i) => o.voided && (file.orders[i].payments || []).some((p) => num(p.amount))).length,
      owe: round2(T.owe), paid: round2(T.paid), methods: T.m, from: dates[0] || '', to: dates[dates.length - 1] || '', noFrom: nos[0], noTo: nos[nos.length - 1],
      totalsOff: conv.filter((x) => !x.totalOk).length, days: attendance.length,
      staff: Object.keys(who.map).map((n) => ({ old: n, id: who.map[n].id, name: who.map[n].name, here: !!findStaff(who.map[n].id) })),
      next: Math.max(num((file.settings || {}).nextOrderNumber), (nos[nos.length - 1] || 0) + 1)
    }
  };
}

// the shop's data with the old records added (the same ids are replaced, so a newer backup updates them)
function oldMerge(plan, opt) {
  const next = JSON.parse(JSON.stringify(S));
  if (opt.trial) { next.orders = next.orders.filter(isFromOld); next.customers = next.customers.filter(isFromOld); next.expenses = []; }
  if (opt.cat) { next.catalogue = plan.cat; next.draft = null; }
  const have = new Set(next.customers.map((c) => c.id));
  plan.customers.forEach((c) => { if (!have.has(c.id)) next.customers.push(c); });
  const at = new Map(next.orders.map((o, i) => [o.id, i]));
  plan.orders.forEach((o) => { if (at.has(o.id)) next.orders[at.get(o.id)] = o; else next.orders.push(o); });
  next.orders.sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
  next.customers.sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
  plan.attendance.forEach((a) => { const x = next.attendance.find((y) => y.id === a.id); if (!x) next.attendance.push(a); else if (!x.seen) x.seen = a.seen; });
  if (plan.drawer) { next.closures = next.closures.filter((c) => c.id !== plan.drawer.id); next.closures.push(plan.drawer); }
  if (opt.shop) Object.assign(next.settings, plan.shop);
  // new orders carry on after the highest number left (old trial numbers deleted earlier don't count)
  const prefix = next.settings.orderPrefix || '';
  const top = next.orders.reduce((m, o) => { const s = String(o.no || ''), d = s.indexOf(prefix) === 0 ? s.slice(prefix.length) : s; return /^\d+$/.test(d) ? Math.max(m, +d) : m; }, 0);
  next.settings.nextOrderNo = Math.max(plan.stats.next, top + 1);
  return next;
}

// the page's online database holds at most Cloud.CAP documents: say how much this uses, and stop if it would not fit
function oldRoom(plan, m) {
  if (Remote.kind !== 'cloud' || Cloud.mode !== 'artifact') return null;
  const next = oldMerge(plan, { cat: !!m.cat, trial: !!m.trial, shop: false });
  const n = 4 + Cloud.COLS.reduce((t, c) => t + (next[c] || []).length, 0) + next.catalogue.filter((g) => g.image).length;
  return { n: n, over: n > Cloud.CAP, text: n > Cloud.CAP ? 'This needs ' + n.toLocaleString('en-US') + ' records, but the online storage holds at most ' + Cloud.CAP.toLocaleString('en-US') + '. Untick “Remove …” only if you must, or ask for help moving to the shop PC version.' : 'Online storage after this: about ' + n.toLocaleString('en-US') + ' of the ' + Cloud.CAP.toLocaleString('en-US') + ' records it can hold.' };
}
async function oldApply(plan, opt) {
  const room = oldRoom(plan, opt);
  if (room && room.over) return toast('Not enough room in the online storage (' + room.n + ' of ' + Cloud.CAP + ' records)');
  const next = oldMerge(plan, opt);
  const n = plan.orders.length;
  Modal.open({ title: 'Bringing in your records', render: () => '<div class="imp-busy"><span class="imp-spin" aria-hidden="true"></span><div><b>Saving ' + plural(n, 'order') + ' and ' + plural(plan.customers.length, 'customer') + '…</b><div class="small muted">' + (Remote.kind === 'cloud' ? 'Every device gets them. Keep this page open until it finishes; it can take a few minutes.' : 'Keep this page open until it finishes.') + '</div><div class="small strong" id="imp-prog" aria-live="polite"></div></div></div>' });

  try {
    if (Remote.on) await Remote.restore(next);
    else { S = migrate(next); save(); }
    clearInterval(tick);
    Modal.close(); nav('#home');
    toast('Brought in ' + plural(n, 'order') + ', ' + plural(plan.customers.length, 'customer') + (opt.cat ? ' and ' + plural(plan.cat.length, 'item') : ''));

    clearInterval(tick);
    Modal.close();
    toast('Could not finish saving (' + ((e && (e.message || e.code)) || 'error') + '). Choose the file again to finish: nothing is added twice.');

function niceAxis(v, steps) {

  let best = null;

    const raw = v / n, p = Math.pow(10, Math.floor(Math.log10(raw)));

    if (!best || step * n < best.top * (1 - 1e-9)) best = { top: step * n, n: n };
  });

}

// a collection entered by mistake or as a test can be deleted by whoever may collect the cash
const closureDelBtn = (c) => (Auth.can('cashclose') ? '<button type="button" class="btn sm ghost icon" data-act="cash:del" data-id="' + c.id + '" aria-label="Delete this collection" title="Delete">' + ico('trash') + '</button>' : '');
Actions['cash:del'] = (d) => {
  const c = S.closures.find((x) => x.id === d.id); if (!c) return;
  const all = cashClosings(), latest = all[all.length - 1] === c, prev = latest ? all[all.length - 2] : null;
  const before = drawerNow().expected;
  // without the last collection, the drawer counts again from the one before it (or the start)
  let after = before;
  if (latest) { const keep = S.closures; S.closures = keep.filter((x) => x !== c); after = drawerNow().expected; S.closures = keep; }
  const what = '<b>' + esc(fmtDT(c.at)) + '</b> · ' + esc(c.by || '—') + ' took out <b>' + esc(money(num(c.taken))) + '</b>' + (c.note ? ' (“' + esc(c.note) + '”)' : '') + '.';
  const effect = latest
    ? 'Delete it only if that cash was not really taken out, for example a mistake or a test. The drawer then counts again from ' + (prev ? esc(fmtDT(prev.at)) : 'the start') + ': it should hold <b>' + esc(money(after)) + '</b> instead of ' + esc(money(before)) + '.'
    : 'It leaves the history of collections. The cash expected in the drawer now stays ' + esc(money(before)) + '.';
  Modal.confirm('Delete this cash collection?', '<p style="margin:0 0 8px">' + what + '</p><p class="small muted" style="margin:0">' + effect + '</p>', 'Delete collection', () => {
    S.closures = S.closures.filter((x) => x.id !== c.id); Modal.close(); commit(); toast('Collection deleted' + (latest ? ' · the drawer should hold ' + money(after) : ''));
  }, true);
};
// an admin counts the drawer, takes the cash and leaves some for change
Actions['cash:collect'] = () => {
  const n = drawerNow();
  const keep = n.last ? String(n.last.left) : '0';
  Modal.open({
    title: 'Count & collect cash', data: { counted: '', left: keep, note: '', print: true },
    render: (m) => '<div class="cc-exp"><span>Should be in the drawer</span><b class="num">' + esc(money(n.expected)) + '</b></div>' +
      '<label class="field" for="cc-count">Cash counted in the drawer</label><div class="prefix"><span>' + esc(S.settings.currency) + '</span><input id="cc-count" type="number" inputmode="decimal" min="0" step="1" data-bind="m.counted" data-refresh="modal-live" value="' + esc(m.counted) + '" placeholder="' + esc(String(n.expected)) + '" data-autofocus></div>' +
      '<label class="field" for="cc-left">Leave in the drawer for change</label><div class="prefix"><span>' + esc(S.settings.currency) + '</span><input id="cc-left" type="number" inputmode="decimal" min="0" step="1" data-bind="m.left" data-refresh="modal-live" value="' + esc(m.left) + '"></div>' +
      '<label class="field">Note <span class="hint">optional</span><input type="text" data-bind="m.note" value="' + esc(m.note) + '" placeholder="e.g. taken to the bank"></label>' +
      '<label class="switch"><input type="checkbox" data-bind="m.print"' + (m.print ? ' checked' : '') + '> Print a slip</label>' +
      '<div id="modal-live">' + collectLive(m, n) + '</div>',
    live: (m) => collectLive(m, n),
    footer: () => '<button type="button" class="btn" data-act="modal:close">Cancel</button><button type="button" class="btn primary" data-act="modal:ok">Collect cash</button>',
    onOk: (m) => {
      if (String(m.counted).trim() === '' || num(m.counted) < 0) return toast('Enter the cash you counted');
      if (num(m.left) < 0 || num(m.left) > num(m.counted)) return toast('You can’t leave more than you counted');
      const cl = closeDrawer(m.counted, m.left, m.note);

      toast('Cash collected · ' + money(cl.taken) + ' taken out' + (Math.abs(cl.diff) > 0.009 ? ' · ' + (cl.diff > 0 ? 'over ' : 'short ') + money(Math.abs(cl.diff)) : ''));
      if (m.print) Print.closure(cl);
    }
  });
};
function collectLive(m, n) {

  const c = round2(num(m.counted)), left = round2(num(m.left)), d = round2(c - n.expected), take = round2(c - left);
  return '<div class="cc-res"><div class="kv"><span>Difference</span><span class="' + (Math.abs(d) > 0.009 ? 'bad' : 'ok') + '">' + (Math.abs(d) > 0.009 ? (d > 0 ? 'Over by ' : 'Short by ') + esc(money(Math.abs(d))) : 'Matches') + '</span></div><div class="kv big"><span>You take out</span><span class="num">' + esc(money(Math.max(0, take))) + '</span></div></div>' + (take < 0 ? '<div class="banner red">' + ico('alert') + '<span>You can’t leave more than you counted.</span></div>' : '');
}

Views.reports.regions.r_team = function (b) {
  const from = b[0], to = b[1];
  const rows = S.staff.map((s) => Object.assign({ id: s.id, name: s.name, access: s.access }, myStats(s.id, from, to)));
  // work recorded under someone not on the staff list (a removed person, people from the old software), and with sign-in off
  const extra = {};
  const inR = (iso) => { if (!iso) return false; const d = localDate(iso); return d >= from && d <= to; };
  const line = (a) => {
    const k = creditKey(a); if (k && k.indexOf('name:') !== 0) return null; // on the staff list: counted above
    return extra[k] || (extra[k] = { id: k || '_', name: k ? formerName(k.slice(5)) : 'Not signed in', note: k ? formerRole(k.slice(5)) : 'Actions without a sign-in', access: '', booked: 0, bookedValue: 0, done: 0, doneValue: 0, collected: 0, payments: 0, paid: 0, discount: 0 });
  };
  S.orders.forEach((o) => {
    if (o.voided) return;
    let r;
    if (inR(o.createdAt) && (r = line(actor(o, 'created')))) { const t = orderTotals(o); r.booked++; r.bookedValue += t.total; r.discount += t.discount; }
    if (o.doneAt && inR(o.doneAt) && (r = line(actor(o, 'done')))) { r.done++; r.doneValue += orderWork(o); }
    if (o.collectedAt && inR(o.collectedAt) && (r = line(actor(o, 'collected')))) r.collected++;
    o.payments.forEach((p) => { if (inR(p.at) && (r = line({ id: p.byId || '', name: p.by || '' }))) { r.payments++; r.paid += p.amount; } });
  });

      '<td class="right">' + cellN(r.booked, r.bookedValue) + '</td><td class="right">' + (r.payments ? '<b class="num">' + esc(money(r.paid)) + '</b><div class="xsmall muted">' + plural(r.payments, 'payment') + '</div>' : '<span class="faint">–</span>') + '</td><td class="right">' + cellN(r.done, r.doneValue) + '</td><td class="right">' + cellN(r.collected) + '</td><td class="right num">' + (r.discount ? esc(money(r.discount)) : '<span class="faint">–</span>') + '</td></tr>').join('') +

// ---------- Reports → Day by day: each person's work done and orders booked, per day ----------

UI.dailyShow = UI.dailyShow || 'done';
Views.reports.regions.r_daily = function (b) {
  const from = b[0], to = b[1];
  const pid = creditKey;
  const inR = (iso) => { if (!iso) return null; const d = localDate(iso); return d >= from && d <= to ? d : null; };
  const grid = {}, seen = {};
  const cell = (d, p) => { seen[p] = 1; const r = grid[d] || (grid[d] = {}); return r[p] || (r[p] = { done: 0, doneN: 0, booked: 0, bookedN: 0 }); };
  S.orders.forEach((o) => {
    if (o.voided) return;
    const dc = inR(o.createdAt);
    if (dc) { const c = cell(dc, pid(actor(o, 'created'))); c.bookedN++; c.booked += orderTotals(o).total; }
    if (o.doneAt && o.status !== 'open') { const dd = inR(o.doneAt); if (dd) { const c = cell(dd, pid(actor(o, 'done'))); c.doneN++; c.done += orderWork(o); } }
  });
  // tailors and anyone else with work, then people not on the staff list under their own names, then work with sign-in off
  const people = S.staff.filter((s) => s.access === 'tailor' || seen[s.id]).map((s) => ({ id: s.id, name: s.name, sub: '' }))
    .concat(sortBy(Object.keys(seen).filter((k) => k.indexOf('name:') === 0), nameKey).map((k) => { const n = k.slice(5); return { id: k, name: isOwnerName(n) ? 'Owner' : n, sub: isOwnerName(n) ? '' : 'no longer on staff' }; }));
  if (seen['']) people.push({ id: '', name: 'Not signed in', sub: '' });
  const span = daysBetween(from, to) + 1;
  let days = [];
  if (span > 0 && span <= 62) { for (let d = to; d >= from; d = addDays(d, -1)) days.push(d); } else days = Object.keys(grid).sort().reverse();
  const show = UI.dailyShow === 'booked' ? 'booked' : 'done';
  const val = (c) => (show === 'done' ? c.done : c.booked), cnt = (c) => (show === 'done' ? c.doneN : c.bookedN);
  const zero = { done: 0, doneN: 0, booked: 0, bookedN: 0 };
  const get = (d, p) => (grid[d] && grid[d][p]) || zero;
  const tot = {}; people.forEach((p) => { tot[p.id] = { v: 0, n: 0 }; });
  let gv = 0, gn = 0, best = null;
  const rows = days.map((d) => {
    let dv = 0, dn = 0;
    const tds = people.map((p) => { const c = get(d, p.id); const v = round2(val(c)), n = cnt(c); dv += v; dn += n; tot[p.id].v += v; tot[p.id].n += n; return '<td class="right">' + (n ? '<b class="num">' + esc(money(v)) + '</b><div class="xsmall muted">' + plural(n, 'order') + '</div>' : '<span class="faint">–</span>') + '</td>'; }).join('');
    gv += dv; gn += dn; if (dn && (!best || dv > best.v)) best = { d: d, v: round2(dv) };
    return '<tr' + (dn ? '' : ' class="quiet"') + '><td><b>' + esc(fmtDay(d)) + '</b></td>' + tds + '<td class="right">' + (dn ? '<b class="num">' + esc(money(round2(dv))) + '</b><div class="xsmall muted">' + plural(dn, 'order') + '</div>' : '<span class="faint">–</span>') + '</td></tr>';
  }).join('');
  const all = { done: 0, doneN: 0, booked: 0, bookedN: 0 };
  Object.keys(grid).forEach((d) => Object.keys(grid[d]).forEach((p) => { const c = grid[d][p]; all.done += c.done; all.doneN += c.doneN; all.booked += c.booked; all.bookedN += c.bookedN; }));
  Reports.csv.daily = [['Day', 'Person', 'Orders booked', 'Booked value', 'Orders done', 'Work done (value)']];
  Object.keys(grid).sort().forEach((d) => people.forEach((p) => { const c = grid[d][p.id]; if (c) Reports.csv.daily.push([d, p.name + (p.sub ? ' (' + p.sub + ')' : ''), c.bookedN, round2(c.booked), c.doneN, round2(c.done)]); }));
  const kpis = '<div class="kpis">' + kpi('Work done', money(round2(all.done)), plural(all.doneN, 'order') + ' marked done', 'ok', null, 'check') + kpi('Orders booked', String(all.bookedN), money(round2(all.booked)) + ' booked', 'info', null, 'receipt') +
    kpi('Busiest day', best ? fmtDay(best.d) : '—', best ? money(best.v) + ' of ' + (show === 'done' ? 'work done' : 'orders booked') : 'nothing in this period', 'brass', null, 'calendar') + kpi('People', String(people.length), 'with work in the period', 'warn', null, 'team') + '</div>';
  const sw = '<div class="seg"><button type="button" class="' + (show === 'done' ? 'on' : '') + '" data-act="daily:show" data-v="done">Work done</button><button type="button" class="' + (show === 'booked' ? 'on' : '') + '" data-act="daily:show" data-v="booked">Orders booked</button></div>';
  const table = '<section class="card">' + cardHead(show === 'done' ? 'Work done, day by day' : 'Orders booked, day by day', show === 'done' ? 'value of orders each person marked done' : 'orders each person booked, at their total', sw + exportBtn('daily')) +
    (people.length && days.length ? '<div class="scroll-x"><table class="tbl daily-tbl"><thead><tr><th>Day</th>' + people.map((p) => '<th class="right">' + esc(p.name) + (p.sub ? '<div class="th-sub">' + esc(p.sub) + '</div>' : '') + '</th>').join('') + '<th class="right">All</th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>Total</td>' + people.map((p) => '<td class="right num">' + esc(money(round2(tot[p.id].v))) + '<div class="xsmall muted">' + plural(tot[p.id].n, 'order') + '</div></td>').join('') + '<td class="right num">' + esc(money(round2(gv))) + '<div class="xsmall muted">' + plural(gn, 'order') + '</div></td></tr></tfoot></table></div>' : '<div class="card-b">' + emptyState('calendar', 'Nothing in this period', '') + '</div>') +
    '<div class="card-f small muted">Work done is measured at catalogue prices (before rush fees and discounts), and goes to whoever marked the order done. Orders booked go to whoever was signed in when the order was taken. The CSV has both for every day and person.</div></section>';
  return kpis + table;
};

// ---------- Expenses ----------
// Anyone can add an expense. Only people with the "Edit & delete expenses" permission (admins) can change or delete one;
// everyone else asks for the change and an admin approves or turns it down. Expenses paid from the shop cash lower the
// cash expected in the drawer.
UI.expRange = UI.expRange || 'month';
const EXP_RANGES = [['month', 'This month'], ['last', 'Last month'], ['d30', 'Last 30 days'], ['year', 'This year'], ['all', 'All time']];
function expBounds() {
  const T = todayStr(), m1 = T.slice(0, 8) + '01';
  if (UI.expRange === 'last') { const lm = new Date(m1 + 'T00:00:00'); lm.setMonth(lm.getMonth() - 1); return [ymd(lm), addDays(m1, -1)]; }
  if (UI.expRange === 'd30') return [addDays(T, -29), T];
  if (UI.expRange === 'year') return [T.slice(0, 5) + '01-01', T];
  if (UI.expRange === 'all') return ['0000-01-01', '9999-12-31'];
  return [m1, T];
}
// with sign-in off everybody counts as the owner of every entry
const expMine = (e) => { const u = Auth.user(); if (!u) return true; return e.createdBy ? e.createdBy === u.id : e.createdByName === u.name; };
const expPending = () => S.expenses.filter((e) => e.request);
const EXP_FIELDS = [['amount', 'amount'], ['category', 'what for'], ['note', 'details'], ['date', 'date'], ['paidFrom', 'paid from']];
function expDiff(e, vals) { const ch = {}; EXP_FIELDS.forEach((f) => { if (String(vals[f[0]] == null ? '' : vals[f[0]]) !== String(e[f[0]] == null ? '' : e[f[0]])) ch[f[0]] = vals[f[0]]; }); return ch; }
function expShow(k, v) { if (k === 'amount') return money(v); if (k === 'date') return fmtDay(v); if (k === 'paidFrom') return v === 'cash' ? 'shop cash' : 'bank / other'; return v ? '“' + v + '”' : 'nothing'; }
const expChangeText = (e, ch) => Object.keys(ch || {}).map((k) => (EXP_FIELDS.find((f) => f[0] === k) || [k, k])[1] + ' ' + expShow(k, e[k]) + ' → ' + expShow(k, ch[k])).join(', ');

function expRow(e) {
  return '<div class="exr" data-act="exp:open" data-id="' + e.id + '" role="button" tabindex="0"><span class="exr-ic">' + ico('expense') + '</span>' +
    '<span class="exr-t"><b class="ellipsis">' + esc(e.category || 'Expense') + '</b><span class="cc-sub ellipsis">' + esc(e.note || '—') + '</span></span>' +
    '<span class="exr-m"><span class="small">' + esc(fmtDay(e.date)) + '</span><span class="cc-sub">' + esc(e.createdByName || '') + '</span></span>' +
    '<span class="exr-c"><span class="chip ' + (e.paidFrom === 'cash' ? 'brass' : 'outline') + '">' + esc(expPaidLabel(e)) + '</span>' + (e.request ? '<span class="chip warn">' + (e.request.type === 'delete' ? 'Delete asked' : 'Change asked') + '</span>' : '') + '</span>' +
    '<b class="num exr-a">' + esc(money(e.amount)) + '</b></div>';
}

// add / change / ask to change
function expForm(mode, e, from) {
  const cats = expenseCats();
  const data = e ? { amount: String(e.amount), category: e.category || '', note: e.note || '', date: e.date, paidFrom: e.paidFrom === 'other' ? 'other' : 'cash', reason: '' }
    : { amount: '', category: '', note: '', date: todayStr(), paidFrom: paidFromOf(from), reason: '' };
  Modal.open({
    title: mode === 'new' ? 'Add expense' : mode === 'edit' ? 'Change expense' : 'Ask to change this expense', data: data,
    render: (m) => (mode === 'ask' ? '<div class="banner info">' + ico('user') + '<span>An admin approves or turns down the change.</span></div>' : '') +
      '<label class="field" for="ex-amt">Amount</label><div class="prefix"><span>' + esc(S.settings.currency) + '</span><input id="ex-amt" type="number" inputmode="decimal" min="0" step="0.5" data-bind="m.amount" value="' + esc(m.amount) + '" placeholder="0"' + (mode === 'ask' ? '' : ' data-autofocus') + '></div>' +
      '<label class="field">What for<input type="text" list="exp-cats" data-bind="m.category" value="' + esc(m.category) + '" placeholder="e.g. Materials &amp; trims" autocomplete="off"></label><datalist id="exp-cats">' + cats.map((c) => '<option value="' + esc(c) + '"></option>').join('') + '</datalist>' +
      '<div class="exp-cats">' + cats.slice(0, 8).map((c) => '<button type="button" class="pill' + (m.category === c ? ' on' : '') + '" data-act="set" data-path="m.category" data-value="' + esc(c) + '" data-refresh="modal">' + esc(c) + '</button>').join('') + '</div>' +
      '<label class="field">Details <span class="hint">optional</span><input type="text" data-bind="m.note" value="' + esc(m.note) + '" placeholder="e.g. thread and buttons"></label>' +
      '<div class="form-grid"><label class="field">Date<input type="date" data-bind="m.date" value="' + esc(m.date) + '" max="' + todayStr() + '"></label>' +
      paidFromField('m.paidFrom', m.paidFrom) + '</div>' + paidFromHint(m.paidFrom, 'Taken from the cash drawer, so it lowers the cash expected there.') +
      (mode === 'ask' ? '<label class="field">Why <span class="hint">optional</span><input type="text" data-bind="m.reason" value="' + esc(m.reason) + '" placeholder="e.g. typed the wrong amount"></label>' : ''),
    footer: () => '<button type="button" class="btn" data-act="modal:close">Cancel</button><button type="button" class="btn primary" data-act="modal:ok">' + (mode === 'new' ? 'Save expense' : mode === 'edit' ? 'Save changes' : 'Send to admin') + '</button>',
    onOk: (m) => {
      const amt = round2(num(m.amount));
      if (!(amt > 0)) return toast('Enter the amount');
      if (!m.date) return toast('Pick the date');
      if (m.date > todayStr()) return toast('The date can’t be in the future');
      const vals = { amount: amt, category: String(m.category || '').trim() || 'Other', note: String(m.note || '').trim(), date: m.date, paidFrom: paidFromOf(m.paidFrom, e && e.paidFrom) };
      if (mode === 'new') {
        const ex = Object.assign({ id: uid(), createdAt: nowISO(), createdBy: whoId(), createdByName: who(), log: [] }, vals);
        expLog(ex, 'Added'); S.expenses.unshift(ex); Modal.close(); commit(); toast('Expense saved · ' + money(amt)); return;
      }
      const ch = expDiff(e, vals);
      if (!Object.keys(ch).length) return toast('Nothing changed');
      const txt = expChangeText(e, ch);
      if (mode === 'edit') { Object.assign(e, ch, { updatedAt: nowISO(), updatedBy: whoId(), updatedByName: who() }); if (e.request) e.request = null; expLog(e, 'Changed: ' + txt); Modal.close(); commit(); toast('Expense changed'); return; }
      e.request = { type: 'edit', at: nowISO(), by: who(), byId: whoId(), byName: who(), reason: String(m.reason || '').trim(), changes: ch };
      expLog(e, 'Asked to change: ' + txt + (e.request.reason ? ' (' + e.request.reason + ')' : '')); Modal.close(); commit(); toast('Sent to an admin');
    }
  });
}

  });
};
Actions['exp:cancel-req'] = (d) => { const e = findExpense(d.id); if (!e || !e.request) return; e.request = null; expLog(e, 'Request cancelled'); Modal.close(); commit(); toast('Request cancelled'); };
Actions['exp:approve'] = (d) => {

  const txt = expChangeText(e, r.changes);
  Object.assign(e, r.changes || {}, { updatedAt: nowISO(), updatedBy: whoId(), updatedByName: who() });
  e.request = null; expLog(e, 'Change approved (' + (r.byName || 'asked') + '): ' + txt); Modal.close(); commit(); toast('Change approved');

};

// ===== 11e-staff.js =====
// ---------- Staff & salary ----------
// Attendance comes from activity: a person who does anything in the POS on a day (books or edits an order, takes a payment,
// marks a job done, hands an order over, adds an expense, collects cash, or just signs in) worked that day. A working day
// with no activity is absent; their weekly day off is paid. An admin can correct any day. Days before attendance started
// being counted (the day sign-in was switched on) are "not tracked" and paid.
// Once clocking in and out is switched on (11f-clock.js), days from then on come from the clock instead, with pay
// lost for arriving late or leaving early.
// Salary: fixed monthly salary; daily rate = monthly ÷ 30; absent days and time lost by the clock are deducted;
// allowances and bonus are added; advances and other deductions are taken off. Advances and paid salaries are
// recorded as expenses.
UI.staffMonth = UI.staffMonth || todayStr().slice(0, 7);
UI.staffTab = UI.staffTab || 'attendance';
const ATT = {
  present: { label: 'Worked', short: '✓', cls: 'p' },
