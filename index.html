.biz-when b{color:var(--ink);font-weight:800;font-size:13.5px}

/* four cards in a row; two per row on a phone */
.biz-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.biz-kpis .kpi-top{min-height:36px}
.kpi .value.long{font-size:20px}
.kpi-d{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px;font-size:12px;font-weight:600;color:var(--muted)}
.kpi-d .delta{font-size:11.5px;padding:2px 7px}
.kpi.t-plain .kpi-ic{background:var(--surface-3);color:var(--ink-2)}

/* day by day: thin columns, the earlier period as a short dark line on each */
.bz-metric{margin-left:auto}
.bz-metric button{min-height:30px;padding:0 11px;font-size:12.5px}
.bzchart{position:relative;display:grid;grid-template-columns:auto 1fr;gap:8px;height:206px;padding-bottom:22px;margin-top:2px}
.bz-y{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:700;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;min-width:26px;transform:translateY(-7px);margin-bottom:-14px}
.bz-plot{position:relative;min-width:0}
.bz-grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.bz-grid i{display:block;height:0;border-top:1px solid var(--line)}
.bz-grid i:last-child{border-top-color:var(--line-3)}
.bz-cols{position:absolute;inset:0;display:flex;gap:4px;padding:0 2px}
.bzchart.dense .bz-cols{gap:2px}
.bz-col{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none;border-radius:4px 4px 0 0}
.bz-col.now{background:rgba(53,84,209,.07)}
.bz-col[data-tip]:hover,.bz-col[data-tip]:focus{background:var(--surface-3)}
.bz-col:focus-visible{box-shadow:0 0 0 2px var(--accent) inset}
.bz-bar{display:block;width:min(62%,24px);border-radius:4px 4px 0 0;background:var(--accent)}
.bzchart.m-work .bz-bar{background:var(--brass)}
.bz-pv{position:absolute;left:50%;transform:translateX(-50%);width:min(94%,34px);height:0;border-top:2px solid var(--ink-2);border-radius:1px;pointer-events:none;margin-bottom:-1px}
.bz-col.future .bz-pv{border-top-color:var(--line-3)}
.bz-x{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;pointer-events:none}
.bz-col.now .bz-x{color:var(--primary);font-weight:800}
.bz-x .x-s{display:none}
.bz-col[data-tip]:hover::after,.bz-col[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);width:max-content;max-width:230px;white-space:normal;text-align:left;background:var(--navy);color:#fff;font-size:12px;font-weight:600;line-height:1.4;padding:6px 10px;border-radius:8px;z-index:6;pointer-events:none;box-shadow:var(--sh-3)}
.bz-col[data-tip]:nth-child(-n+3)::after{left:0;transform:none}
.bz-col[data-tip]:nth-last-child(-n+3)::after{left:auto;right:0;transform:none}
.bz-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.bz-legend>span{display:inline-flex;align-items:center;gap:6px}
.bz-sw{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}
.bz-sw.m-work{background:var(--brass)}
.bz-tk{width:14px;height:0;border-top:2px solid var(--ink-2);flex:none}
.bz-legend .bz-unit{margin-left:auto;color:var(--faint);font-weight:600}

/* money summary: this period next to the one before */
.pl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.pl thead th{font-size:11px;font-weight:800;color:var(--ink-2);text-align:right;padding:0 0 6px 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.pl thead th.pl-pv{color:var(--muted)}
.pl tbody th{font-weight:600;color:var(--ink-2);text-align:left;padding:5px 0;vertical-align:top}
.pl tbody th a{color:inherit;text-decoration:none}
.pl tbody th a:hover{color:var(--accent)}
.pl td{text-align:right;padding:5px 0 5px 10px;white-space:nowrap;color:var(--ink);font-weight:700;vertical-align:top}
.pl td.pl-pv{color:var(--muted);font-weight:600}
.pl tr.pl-main th,.pl tr.pl-main td{border-top:1px solid var(--line);padding-top:8px}
.pl tr.pl-main th{color:var(--ink);font-weight:700}
.pl tr.pl-sub th{padding-left:12px;padding-top:2px;padding-bottom:2px;color:var(--muted);font-size:12.5px}
.pl tr.pl-sub td{padding-top:2px;padding-bottom:2px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pl tr.pl-sub td.pl-pv{color:var(--faint)}
.pl tr.pl-sec th{padding:14px 0 2px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pl tbody tr.pl-sec:first-child th{padding-top:2px}
.pl tr.pl-tot th,.pl tr.pl-tot td{border-top:2px solid var(--ink-2);padding-top:9px;font-size:15px;font-weight:800;color:var(--ink)}
.pl tr.pl-tot td.pl-pv{font-size:13px;color:var(--muted);font-weight:700}
.pl tr.pl-tot td.bad{color:var(--bad-ink)}
.pl tr.pl-note td{text-align:left;white-space:normal;padding:2px 0 0;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.4}
.biz-pace{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink-2);font-size:12.5px;line-height:1.45}
.biz-pace svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--accent)}
/* as of now: what customers still owe, cash in the drawer */
.biz-now{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:4px}
.kv.biz-line{align-items:center;padding:6px 0;font-weight:700;font-size:13px}
.biz-line>span:first-child{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.biz-line svg{width:16px;height:16px;color:var(--muted)}
.card-link.biz-more{margin-left:0;align-self:flex-start}

/* what sold */
.sold-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
.sold-h,.ctop-h{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sold-h{margin-bottom:10px}
.sold-more{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700}

/* customers */
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cstat{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);min-width:0}
.cstat b{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.cstat>span:nth-child(2){font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ctop{display:flex;flex-direction:column;margin-top:-6px}
.ctop-r{display:flex;align-items:center;gap:10px;padding:8px 6px;margin:0 -6px;border-radius:var(--r-sm);color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ctop-r:last-child{border-bottom:0}
.ctop-r:hover{background:var(--hover);color:inherit}
.ctop-n{width:16px;text-align:center;font-size:12px;font-weight:800;color:var(--faint);flex:none}
.ctop-m{flex:1;min-width:0;display:flex;flex-direction:column}
.ctop-m b{font-size:13.5px}
.ctop-r>.num{white-space:nowrap;font-size:13.5px}

/* below a wide computer screen the cards stack in one column: the work in the shop first, people last */
@media (max-width:1180px){
  .home-biz{flex-direction:column;align-items:stretch}
  .home-biz>.col-main,.home-biz>.col-side{display:contents}
  .hb-work{order:1}
  .hb-chart{order:2}
  .hb-prod{order:3}
  .hb-money{order:4}
  .hb-sold{order:5}
  .hb-cust{order:6}
  .hb-feed{order:7}
}
@media (max-width:900px){
  .biz-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .value.long{font-size:17px}
}
@media (max-width:760px){
  .biz-seg{display:grid;grid-template-columns:repeat(5,auto);width:100%}
  .biz-seg button{padding:0 6px;min-height:36px}
  .biz-seg .rb-l{display:none}
  .biz-seg .rb-s{display:inline}
  .biz-when{font-size:12px}
  .bzchart{height:176px}
  .bz-x .x-l{display:none}
  .bz-x .x-s{display:inline}
  .bz-metric{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .sold-2{grid-template-columns:1fr}
  .pl{font-size:12.5px}
  .pl tr.pl-tot th,.pl tr.pl-tot td{font-size:14px}
}

/* ---------- several shops (online version): the switcher and the All shops page ---------- */
/* phone: a small square with the shop's letter at the left of every page's top bar */
.shop-chip{display:none}
@media (max-width:900px){
  .shop-chip{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 5px;margin-right:-2px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);flex:none;cursor:pointer}
  .shop-chip:hover{border-color:var(--line-3)}
  .shop-chip>svg{width:14px;height:14px;color:var(--faint)}
}
.shop-chip-l{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#D2A24F,var(--brass) 55%,var(--brass-2));color:#fff;font-weight:800;font-size:13px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.shop-chip-l svg{width:16px;height:16px}
/* computer: the shop's name in the side menu opens the switcher */
.brand-sw{display:flex;align-items:center;gap:12px;flex:1;min-width:0;margin:-6px;padding:6px;border:0;border-radius:12px;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.brand-sw:hover{background:rgba(255,255,255,.06)}
.brand-sw>svg{width:15px;height:15px;flex:none;color:#7D89A3}
.brand-sw .brand-t{flex:1;min-width:0}
.brand-sw .brand-mark{font-family:var(--mono);font-size:15px}
.side-mini .brand-sw{flex:none;justify-content:center;margin:0;padding:0}
.side-mini .brand-sw>svg{display:none}
/* the switcher list */
.shop-pick-b.on{border-color:var(--accent);background:var(--accent-soft)}
.shop-pick-l.all{background:var(--brass-soft);color:var(--brass-2)}
.shop-pick-l.all svg{width:18px;height:18px}
.shop-pick-l.sm{width:26px;height:26px;border-radius:8px;font-size:12px}

/* All shops: metrics down the side, shops across, the totals last */
.shops-card{padding:0;overflow:hidden}
.shops-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.shops-t{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.shops-t th,.shops-t td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
.shops-t thead th{vertical-align:bottom;background:var(--surface-2);padding-top:12px;padding-bottom:10px}
.shops-t tbody tr:last-child>*{border-bottom:0}
.shops-t th:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2);white-space:normal;min-width:96px}
.shops-t thead th:first-child{background:var(--surface-2);font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.shops-t td b{display:block;font-size:15.5px;font-weight:800;color:var(--ink)}
.shops-t td b.bad{color:var(--bad-ink)}
.shops-t td small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.shops-t .tot{background:var(--surface-2);border-left:1px solid var(--line)}
.shops-t thead .tot{font-size:12px;font-weight:800;color:var(--ink-2)}
.shops-t th.on .shop-pick-l{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--accent)}
.shops-h{display:inline-flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:132px;padding:0;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:right}
.shops-h:hover .shops-hn{color:var(--primary);text-decoration:underline}
.shops-hn{font-size:12.5px;font-weight:800;line-height:1.25;white-space:normal}
.shops-now{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.02em;vertical-align:1px}
.shops-wait{display:inline-block;color:var(--faint);animation:shops-wait 1.2s ease-in-out infinite}
@keyframes shops-wait{50%{opacity:.35}}
@media (max-width:600px){
  .shops-t th,.shops-t td{padding:10px 9px}
  .shops-t th:first-child{min-width:84px;padding-left:12px;font-size:12.5px}
  .shops-t td b{font-size:14.5px}
  .shops-h{max-width:86px}
  .shops-hn{font-size:11.5px}
}

/* sign-in screen: a shop device signs in with a one-time code */
.login-alt{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:center;font-size:13px;color:var(--muted)}
.login-alt svg{width:15px;height:15px;flex:none}
.login-card .code-in{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.login-card .code-in::placeholder{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
/* the code shown to the owner or partner */
.dev-code{font-family:var(--mono);font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;padding:16px 10px;margin-bottom:14px;border-radius:var(--r-lg);background:var(--surface-2);border:1px dashed var(--line-3);color:var(--ink);user-select:all}
.shop-row .avatar{flex:none}
.shop-pick-l svg{width:18px;height:18px}

/* ---------- Orders list ---------- */
#r-orders{display:flex;flex-direction:column;gap:16px}
.otools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.otools .search{height:42px}
.otools .seg button{display:inline-flex;align-items:center;gap:6px}
.otools .seg svg{width:15px;height:15px}
.ofilters{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .sel{height:38px}
.ofil-note{padding:2px 2px 0}

.olist{display:flex;flex-direction:column;overflow:hidden}
.orow{display:grid;grid-template-columns:30px 64px minmax(150px,1.3fr) minmax(150px,1.4fr) 140px 100px 92px 92px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.orow.nosel{grid-template-columns:64px minmax(150px,1.3fr) minmax(150px,1.4fr) 140px 100px 92px 92px}
.orow.head .ono{font-size:inherit;color:inherit;font-weight:inherit}
.orow:hover{background:var(--hover)}
.orow.is-sel{background:var(--accent-soft)}
.orow.head{cursor:default;font-size:var(--fs-xs);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:11px;padding-bottom:11px;background:var(--surface-2)}
.orow.head:hover{background:var(--surface-2)}
.orow.voided{opacity:.55}
.orow.voided .ono{text-decoration:line-through}
.orow .ono{font-weight:700;font-size:13px;color:var(--ink)}
.orow .ono:hover{color:var(--accent)}
.ocust{display:flex;align-items:center;gap:10px;min-width:0}
.ocust-t{display:flex;flex-direction:column;min-width:0}
.ocust-n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocust-p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.oitems{display:flex;align-items:center;gap:10px;min-width:0;font-size:13px}
.oitems-t{display:flex;flex-direction:column;min-width:0}
.oitems-m{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.gstack{display:inline-flex;flex:none}
.gs{width:30px;height:30px;border-radius:9px;background:var(--surface-3);border:2px solid var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);overflow:hidden}
.gs+.gs{margin-left:-10px}
.gs svg{width:20px;height:20px}
.gs img{width:100%;height:100%;object-fit:cover}
.orow .omoney{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.orow .oact{text-align:right}
.ocheck{display:flex;align-items:center;justify-content:center;min-height:28px}
.sumbar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:13px 20px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600}
.sumbar b{color:var(--ink)}
.sumbar b.bad{color:var(--bad-ink)}

/* floating selection bar */
.bulk{position:fixed;left:calc(50% + var(--side-w) / 2);bottom:24px;transform:translateX(-50%);z-index:40;display:flex;gap:8px;align-items:center;padding:8px 8px 8px 14px;border-radius:14px;background:var(--navy);color:#fff;box-shadow:var(--sh-3);animation:rise .18s ease-out;max-width:calc(100vw - 32px);flex-wrap:wrap}
.bulk-n{min-width:26px;height:26px;border-radius:8px;background:var(--brass);display:inline-block;line-height:26px;text-align:center;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.bulk-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}
.bulk .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.bulk .btn:hover{background:rgba(255,255,255,.16);color:#fff}

/* compact rows (Home "Today's work", customer page) */
.olist.compact .orow{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"no cust due money" "no items items act";gap:6px 14px;padding:14px 20px}
.olist.compact .orow .ono{grid-area:no;align-self:start;padding-top:8px}
.olist.compact .orow .ocust{grid-area:cust}
.olist.compact .orow .odue{grid-area:due;text-align:right}
.olist.compact .orow .omoney{grid-area:money}
.olist.compact .orow .oitems{grid-area:items;padding-left:46px}
.olist.compact .orow .oitems .gstack{display:none}
.olist.compact .orow .ostat{display:none}
.olist.compact .orow .oact{grid-area:act}
.olist.compact .orow:last-child{border-bottom:0}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.bcol{background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 230px)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.bcol-h h3{font-size:13.5px}
.bdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.bc-bad .bdot{background:var(--bad)}
.bc-warn .bdot{background:var(--warn)}
.bc-info .bdot{background:var(--accent)}
.bc-ok .bdot{background:var(--ok)}
.bc-bad .bcol-h h3{color:var(--bad-ink)}
.bcol-b{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;overflow-y:auto}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh-1);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.bcard:hover{border-color:var(--line-3);box-shadow:var(--sh-2)}
.bcard.rush{box-shadow:inset 3px 0 0 var(--bad),var(--sh-1)}
.bcard-h{display:flex;align-items:center;gap:6px}
.bcard-h a{color:var(--ink);font-size:13px}
.bcard-h .gs{width:26px;height:26px}
.bcard-h .gs svg{width:17px;height:17px}
.bcard-c{display:flex;align-items:center;gap:9px;min-width:0}
.bcard-f{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.bcard-f .due{font-size:12px}
.bcard-f .btn{min-height:28px;padding:0 8px;margin-left:auto}
.bcard-h .num{font-size:12.5px}
.bcard-c .gstack{margin-left:auto}
.bempty{padding:18px 8px;text-align:center;font-size:12.5px;color:var(--faint);font-weight:600;border:1px dashed var(--line-2);border-radius:var(--r)}

/* ---------- order screen ---------- */
.status-card{overflow:hidden}
.ssteps{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sstep{display:flex;align-items:center;gap:10px;color:var(--faint);min-width:0}
.sstep .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;background:var(--surface)}
.sstep .dot svg{width:16px;height:16px}
.sstep-t{display:flex;flex-direction:column;line-height:1.25}
.sstep-t b{font-size:14px;color:inherit}
.sstep-t span{font-size:12px;font-weight:600}
.sstep.on{color:var(--ink)}
.sstep.on .dot{background:var(--ok);border-color:var(--ok)}
.sstep.on .sstep-t span{color:var(--muted)}
.sstep.next{color:var(--ink-2)}
.sstep.next .dot{border-color:var(--primary);box-shadow:0 0 0 4px var(--accent-soft)}
.sline{flex:1 1 30px;min-width:24px;height:2px;border-radius:2px;background:var(--line)}
.sline.on{background:var(--ok)}
.primary-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pr-note{display:flex;flex-direction:column;gap:2px}
.oitem{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.oitem:last-child{border-bottom:0}
.oitem-ic{width:44px;height:44px;border-radius:12px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink-2);overflow:hidden}
.oitem-ic svg{width:30px;height:30px}
.oitem-ic img{width:100%;height:100%;object-fit:cover}
.oitem-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.oitem-h{display:flex;align-items:baseline;gap:8px;font-size:15px}
.otask{display:flex;align-items:baseline;gap:10px;font-size:13.5px;padding:2px 0}
.otask-n{flex:1;min-width:0;font-weight:600;color:var(--ink-2)}
.otask-m{font-size:12px;color:var(--faint);font-weight:600;margin-left:8px}
.oitem-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.oitem-f .sel{height:32px;font-size:12.5px}
.oitem-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);background:var(--brass-soft);padding:4px 10px;border-radius:var(--r-sm);font-weight:600}
.oitem-note svg{width:13px;height:13px;color:var(--brass-2)}
.order-note{display:flex;flex-direction:column;gap:4px;padding:14px 20px;background:var(--surface-2);border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg);font-weight:600}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;display:flex;gap:14px;padding:0 0 16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-3);flex:none;margin-top:4px;position:relative}
.tl li:first-child .tl-dot{border-color:var(--primary);background:var(--primary)}
.tl-b{display:flex;flex-direction:column;gap:1px;font-size:13.5px;font-weight:600;min-width:0}
.pay-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pay-paid{font-size:17px;font-weight:800;color:var(--ok-ink)}
.pay-bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.pay-bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ok),#34C38F)}
.paylines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.payline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.payline:last-child{border-bottom:0}
.pl-ic{width:30px;height:30px;border-radius:9px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.pl-ic svg{width:15px;height:15px}
.cust-line{display:flex;align-items:center;gap:12px}
.cust-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cust-stats>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.cust-stats b{font-size:14px}
.cust-note{font-size:13px;color:var(--ink-2);background:var(--brass-soft);border-radius:var(--r);padding:10px 12px;font-weight:600}
.pay-sum{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .orow{grid-template-columns:34px 72px minmax(150px,1fr) minmax(150px,1.2fr) 136px 104px 104px}
  .orow.nosel{grid-template-columns:72px minmax(150px,1fr) minmax(150px,1.2fr) 136px 104px 104px}
  .orow .ostat{display:none}
}
@media (max-width:900px){
  .bulk{left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  /* an order as a small card: number + ready date, customer + money, garments + the Done/Collect button */
  .orow,.olist.compact .orow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"chk no due stat" "cust cust cust money" "items items items act";gap:8px 10px;padding:13px var(--gutter);align-items:center}
  .orow.nosel,.olist.compact .orow.nosel{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no due stat" "cust cust money" "items items act"}
  .orow.head{display:none}
  .orow .ocheck{grid-area:chk;min-height:0}
  .orow .ono{grid-area:no;padding-top:0!important}
  .orow .odue{grid-area:due;text-align:left!important;min-width:0;font-size:12.5px}
  .orow .odue .due{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;max-width:100%}
  .orow .ostat{grid-area:stat;display:block!important;justify-self:end}
  .orow .ocust{grid-area:cust}
  .orow .omoney{grid-area:money;align-self:center}
  .orow .oitems{grid-area:items;padding-left:0!important}
  .orow .oitems .gstack{display:none}
  .orow .oact{grid-area:act;justify-self:end}
  .orow .oact:empty{display:none}
  .olist.compact .orow .ostat{display:none!important}
  .sumbar{gap:12px}
  .board{grid-template-columns:repeat(5,minmax(260px,82vw));scroll-snap-type:x mandatory}
  .bcol{scroll-snap-align:start;max-height:none}
  /* ready for pickup: name and balance on top, waiting days and the buttons under them */
  .prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av main chip" "av meta act";gap:6px 12px;padding:12px var(--gutter)}
  .prow>.avatar{grid-area:av;align-self:start}
  .prow-main{grid-area:main}
  .prow>.chip{grid-area:chip;justify-self:end}
  .prow-meta{grid-area:meta;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 8px;text-align:left;min-width:0}
  .prow-act{grid-area:act;justify-self:end}
  .wl-track{height:96px}
  .cust-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sline{display:none}
  .tabs-pill{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .pill{flex:none}
  .ssteps{gap:14px}
}
.bulk-lbl{white-space:nowrap}
.bulk-lbl .bulk-n{margin-right:6px;vertical-align:middle}
.bcard{min-width:0;overflow:hidden}
.bcard-h,.bcard-f{flex-wrap:wrap;row-gap:6px}
.bcard-h .num,.bcard-f .due{white-space:nowrap}
.bcard-f .due{flex:1 1 auto}
.tag.only-ic{padding:0 4px;gap:0}
.bcard-h{flex-wrap:nowrap}
.bcard-h .num{margin-left:auto}
@media (max-width:760px){
  /* order page on a phone: what to do, the garments and the money first, the history last */
  .order-page{flex-direction:column;align-items:stretch}
  .order-page>.col-main,.order-page>.col-side{display:contents}
  .order-page .status-card{order:1}
  .order-page .op-items{order:2}
  .order-page .op-pay{order:3}
  .order-page .op-cust{order:4}
  .order-page .op-det{order:5}
  .order-page .op-act{order:6}
}

/* =====================================================================
   New order counter & checkout
   Desktop: catalogue canvas on the left, full-height ticket on the right.
   ===================================================================== */
.gthumb{object-fit:cover;border-radius:var(--r);flex:none;display:block}
/* the search field draws its own focus ring; the input inside it should not add a second one */
.search input:focus-visible{box-shadow:none}

/* topbar extras */
.pos-steps{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--faint)}
.pos-steps>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pos-steps i{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:var(--surface-3);color:var(--muted)}
.pos-steps i svg{width:11px;height:11px}
.pos-steps .on{color:var(--ink)}
.pos-steps .on i{background:var(--primary);color:#fff}
.pos-steps .done{color:var(--ok-ink)}
.pos-steps .done i{background:var(--ok-soft);color:var(--ok-ink)}
.pos-steps-sep{width:22px;height:1px;background:var(--line-2)}
.pos-no{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.pos-no b{font-size:14px;color:var(--ink);font-weight:700}

/* ---------- layout ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,420px);align-items:start;flex:1 1 auto;min-width:0}
.pos-main{min-width:0;padding:20px var(--gutter) 40px}
.pos-ticket{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));min-width:0;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(14,22,38,.04)}
.tk-panel,.ticket-in{display:flex;flex-direction:column;height:100%;min-height:0}
.mobile-bar{display:none}

/* ---------- catalogue ---------- */
.picker{display:flex;flex-direction:column;gap:16px;min-width:0}
.pk-top{display:flex;gap:10px;align-items:center}
.pk-top .search{height:48px;border-radius:12px;box-shadow:var(--sh-1);padding:0 16px}
.pk-top .search svg{width:19px;height:19px}
.pk-top .search input{font-size:15px}
.pk-crumbs{display:flex;flex-direction:column;gap:12px}
.pk-crumbs:empty{display:none}
.pk-body{display:flex;flex-direction:column;gap:20px;min-width:0}
.pk-label,.pk-count{font-size:var(--fs-xs);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:-8px}
.pk-back{display:flex;align-items:center;gap:10px}
.pk-backbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:12.5px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--accent-2);cursor:pointer;box-shadow:var(--sh-1)}
.pk-backbtn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.pk-backbtn svg{width:14px;height:14px}
.gchip-all .gchip-ic{background:var(--accent-soft);color:var(--accent-2)}
.gchip-all .gchip-ic svg{width:16px;height:16px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.crumbs>svg{width:14px;height:14px;color:var(--faint)}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 10px;border-radius:var(--r-sm);color:var(--accent);font-weight:700;font-size:13.5px}
.crumb svg{width:15px;height:15px}
button.crumb:hover{background:var(--accent-soft)}
.crumb.on{color:var(--ink);background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--line)}

/* garment tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 16px 14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);text-align:left;min-height:156px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--line-3);box-shadow:var(--sh-2);transform:translateY(-2px)}
.tile:active{transform:none}
.tile.has{border-color:var(--brass-line)}
.tile-ic{width:68px;height:68px;border-radius:18px;background:linear-gradient(160deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);overflow:hidden;margin-bottom:10px}
.tile-ic svg{width:46px;height:46px}
.tile-ic img{width:100%;height:100%;object-fit:cover}
.tile:hover .tile-ic{color:var(--primary)}
/* the picture fills the tile, the name is a small caption under it */
.tiles{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.tiles .tile{padding:0;gap:0;min-height:0;overflow:hidden;align-items:stretch;text-align:center}
.tiles .tile-ic{width:100%;height:auto;aspect-ratio:1/1;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:radial-gradient(120% 90% at 50% 20%,#fff,var(--surface-2) 60%,var(--surface-3))}
.tiles .tile-ic svg{width:72%;height:72%}
.tiles .tile-ic svg.gpic{width:92%;height:92%}
.tiles .tile-ic svg *{vector-effect:non-scaling-stroke}
.tiles .tile-ic img{width:100%;height:100%;object-fit:cover}
.tiles .tile-name{display:block;padding:9px 8px 10px;font-size:13px;font-weight:700;line-height:1.25;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles .tile.has{box-shadow:0 0 0 1px var(--brass-line),var(--sh-1)}
.tiles .tile-badge{top:8px;right:8px}
.tile-name{font-weight:800;font-size:15px;line-height:1.25;letter-spacing:-.01em}
.tile-meta{font-size:12px;color:var(--muted);font-weight:600}
.tile-badge{position:absolute;top:12px;right:12px;min-width:24px;height:24px;border-radius:999px;background:var(--brass);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;box-shadow:0 2px 6px rgba(185,134,47,.35);font-variant-numeric:tabular-nums}

/* target notice: which garment the jobs are added to */
.target{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);flex-wrap:wrap;overflow:hidden}
.target::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-3)}
.target.on{background:var(--brass-soft);border-color:var(--brass-line)}
.target.on::before{background:var(--brass)}
.target-ic{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-2);flex:none}
.target-ic svg{width:28px;height:28px}
.target-ic img{width:100%;height:100%;object-fit:cover}
.target-t{min-width:0;flex:1 1 200px;display:flex;flex-direction:column}
.target-t b{font-size:14px;font-weight:800}
.target-t span{font-size:12.5px;color:var(--muted);font-weight:600}
.target-a{display:flex;gap:8px;flex-wrap:wrap}

/* job & type tiles */
.tgroup{display:flex;flex-direction:column;gap:10px}
.tgroup-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tgroup-h::after{content:"";flex:1;height:1px;background:var(--line)}
.tgroup-n{min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}
.vtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.vtile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:88px;padding:13px 14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);text-align:left;transition:border-color .12s,box-shadow .12s,background .12s}
.vtile:hover{border-color:var(--line-3);box-shadow:var(--sh-2)}
.vtile.on{border-color:var(--primary);background:var(--accent-soft);box-shadow:0 0 0 1px var(--primary)}
.vname{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;line-height:1.3;padding-right:24px;letter-spacing:-.005em}
.chev{display:inline-flex}
.chev svg{width:14px;height:14px;color:var(--faint)}
.vchosen{font-size:12px;font-weight:700;color:var(--accent-2);margin-top:-4px}
.vtypes{font-size:12px;font-weight:600;color:var(--faint);margin-top:-4px}
.vmeta{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.vtime{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.vtime svg{width:13px;height:13px;color:var(--faint)}
.vprice{color:var(--ink);font-weight:800;font-size:13.5px;white-space:nowrap}
.vprice small{font-size:11px;font-weight:600;color:var(--muted)}
.tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(26,43,87,.3)}
.tick svg{width:12px;height:12px;stroke-width:3}

/* search results */
.results{display:flex;flex-direction:column;gap:8px}
.result{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:60px;text-align:left;box-shadow:var(--sh-1);transition:border-color .12s,box-shadow .12s}
.result:hover{border-color:var(--line-3);box-shadow:var(--sh-2)}
.r-ic{width:40px;height:40px;border-radius:11px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-2);flex:none}
.r-ic svg{width:28px;height:28px}
.r-ic img{width:100%;height:100%;object-fit:cover}
.r-t{flex:1;min-width:0;display:flex;flex-direction:column}
.r-t b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-t span{font-size:12px;color:var(--muted);font-weight:600}
.r-time{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.r-time svg{width:13px;height:13px;color:var(--faint)}
.r-price{font-weight:800;min-width:76px;text-align:right;white-space:nowrap}
.r-add{width:30px;height:30px;border-radius:9px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.r-add svg{width:16px;height:16px}
.result:hover .r-add{background:var(--primary);color:#fff}

/* ---------- ticket ---------- */
.tk-head{padding:16px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;flex:none}
.tk-title{display:flex;align-items:baseline;gap:10px}
.tk-title h2{font-size:var(--fs-lg)}
.tk-meta{margin-left:auto;font-size:var(--fs-sm);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tk-cust{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.tk-cust .chip{flex:none}
.tk-cust-t{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left;color:inherit}
.tk-cust-t b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-cust-t span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.tk-cust-t:hover b{color:var(--accent)}
.tk-cust-add{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;border-radius:12px;border:1px dashed var(--line-3);background:var(--surface);color:var(--ink);text-align:left;transition:border-color .12s,background .12s}
.tk-cust-add:hover{border-color:var(--accent);background:var(--accent-soft)}
.tk-cust-add>svg{width:18px;height:18px;color:var(--accent);flex:none}
.tk-cust-add-ic{width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.tk-cust-add-ic svg{width:17px;height:17px}
.tk-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tk-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:40px 28px;color:var(--muted);font-size:13px;font-weight:500}
.tk-empty b{color:var(--ink);font-size:14px}
.tk-empty-ic{width:64px;height:64px;border-radius:18px;background:var(--surface-2);border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--faint);margin-bottom:6px}
.tk-empty-ic svg{width:40px;height:40px}

.citem{position:relative;padding:9px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.citem.target-on{background:linear-gradient(90deg,var(--brass-soft),rgba(247,238,220,.25))}
.citem.target-on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
.citem-h{display:flex;align-items:center;gap:8px;min-height:34px}
.citem-ic{width:32px;height:32px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-2);flex:none}
.citem-ic svg{width:22px;height:22px}
.citem-ic img{width:100%;height:100%;object-fit:cover}
.citem.target-on .citem-ic{background:var(--surface);box-shadow:0 0 0 1px var(--brass-line)}
.citem-name{flex:1;min-width:0;display:flex;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:6px;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.citem-name b{font-size:14px;font-weight:800;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.citem-name em{font-style:normal;font-size:11px;font-weight:700;color:var(--brass-2);white-space:nowrap}
.citem-h .qty button{width:24px;height:26px;font-size:14px}
.citem-h .qty span{min-width:20px;font-size:12.5px}
.citem-amt{min-width:62px;text-align:right}
.citem-rm{margin-right:-6px;color:var(--muted)}
.citem-rm:hover{color:var(--bad-ink)}
.citem-name:hover b{color:var(--accent)}
.citem-q{color:var(--brass-2)}
.citem-sub{font-size:12px;color:var(--muted);font-weight:600}
.citem-sub em{font-style:normal;color:var(--brass-2)}
.citem-amt{font-weight:800;font-size:14px;white-space:nowrap}
.ctasks{display:flex;flex-direction:column;padding-left:40px;padding-right:2px}
.ctask{display:flex;align-items:center;gap:4px;font-size:12.5px;min-height:24px}
.ctask:first-child{border-top:0}
.ctask-n{flex:1;min-width:0;color:var(--ink-2);font-weight:700}
.ctask-v{color:var(--muted);font-weight:600}
.ctask-t{font-size:11.5px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
.price-btn{border:1px dashed transparent;background:none;padding:1px 6px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ctask .btn.icon.xs{width:24px;min-height:22px;color:var(--faint)}
.ctask .btn.icon.xs:hover{color:var(--bad-ink)}
.ctask .btn.icon.xs svg{width:13px;height:13px}
.price-btn:hover{border-color:var(--line-3);background:var(--surface)}
.citem-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:52px;margin-top:2px}
.citem-f .sel{height:30px;font-size:12px;flex:0 1 150px;border-radius:var(--r-sm)}
.citem-f .qty button{width:26px;height:28px}
.citem-f .qty span{min-width:24px;font-size:13px}
.citem-acts{display:inline-flex;margin-left:auto}
.note-in{height:30px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;font-size:12.5px;font-weight:500;flex:1 1 100%;min-width:0;background:var(--surface)}
.note-in::placeholder{color:var(--faint)}

.tk-foot{flex:none;border-top:1px solid var(--line);padding:14px 20px 18px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.tk-opts{display:flex;gap:8px;flex-wrap:wrap}
.tk-toggle{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--ink-2);max-width:100%}
.tk-toggle span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-toggle svg{width:15px;height:15px;flex:none}
.tk-toggle:hover{border-color:var(--line-3)}
.tk-toggle.rush{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.tk-toggle.disc{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.cart-totals>div{padding:2px 0}
.cart-totals .grand{margin-top:6px;padding-top:10px}
.cart-totals .grand .big{font-size:26px}
.disc-line>span:last-child{color:var(--ok-ink)}
.vat-line{font-size:12px!important;color:var(--muted)!important}
.vat-line>span:last-child{font-weight:600!important}
.tk-cta{justify-content:space-between;padding:0 18px 0 22px}
.tk-cta-r{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14)}
.tk-cta-r svg{width:18px;height:18px}

/* discount window */
.disc-presets{display:flex;flex-direction:column;gap:8px}
.disc-preset{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px 8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:700;box-shadow:var(--sh-1)}
.disc-preset:hover{border-color:var(--line-3)}
.disc-preset.on{border-color:var(--primary);background:var(--accent-soft);box-shadow:0 0 0 1px var(--primary)}
.disc-ic{width:34px;height:34px;border-radius:10px;background:var(--ok-soft);color:var(--ok-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.disc-ic svg{width:17px;height:17px}
.disc-t{flex:1;min-width:0}
.disc-v{font-size:12.5px;color:var(--ok-ink);font-weight:800;white-space:nowrap}
.disc-custom{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.disc-custom .prefix{flex:1 1 140px;height:42px}
.disc-custom .prefix input{font-size:16px}

/* customer lists (checkout + window) */
.cm-seg{align-self:flex-start}
.cust-rows{display:flex;flex-direction:column;gap:6px}
.cust-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 10px 8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;color:inherit;transition:border-color .12s,background .12s}
.cust-row:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.cust-row-t{flex:1;min-width:0;display:flex;flex-direction:column}
.cust-row-t b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust-row-t span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust-row-go{display:inline-flex;color:var(--faint)}
.cust-row-go svg{width:16px;height:16px}
.pos-hint{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.pos-hint svg{width:15px;height:15px;color:var(--faint);flex:none}

/* ---------- checkout ---------- */
.co-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,410px);gap:20px;align-items:start}
.co-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.co-side{position:sticky;top:calc(var(--top-h) + 20px);min-width:0}
.co .card-h h2 svg{width:18px;height:18px;color:var(--muted)}
.co-cust{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.co-cust-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px;align-items:flex-start}
.co-cust-t b{font-size:var(--fs-md);font-weight:800}
.co-cust-t>span:not(.chip){font-size:12.5px;color:var(--muted);font-weight:600}
.co-cust-t .chip{margin-top:4px}
.co-note{font-style:italic}
.co-cust-a{display:flex;gap:6px}
.co-find{display:flex;flex-direction:column;gap:12px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:space-between}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-m{min-width:150px;text-align:center;font-weight:800;font-size:15px;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:10.5px;font-weight:800;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.08em;padding-bottom:2px}
.day{position:relative;min-height:66px;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;padding:8px 9px 8px;background:var(--surface);text-align:left;color:var(--ink);transition:border-color .12s,box-shadow .12s,background .12s;min-width:0}
.day .dn{font-weight:800;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.day .dl{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.dbar{display:block;width:100%;height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.dbar.none{background:transparent}
.dbar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.day.lv-busy .dbar i{background:var(--warn)}
.day.lv-full .dbar i{background:var(--bad)}
.day.lv-busy .dl{color:var(--warn-ink)}
.day.lv-full .dl{color:var(--bad-ink)}
.day.lv-closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface-3) 6px 7px);color:var(--faint)}
.day.lv-closed .dl{color:var(--faint)}
.day:not([disabled]):hover{border-color:var(--line-3);box-shadow:var(--sh-2)}
.day[disabled]{background:transparent;border-color:transparent;color:var(--line-3);box-shadow:none;cursor:default}
.day.today{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
.day.today::after{content:"Today";position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.day.sel{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(26,43,87,.25)}
.day.sel .dl{color:rgba(255,255,255,.75)}
.day.sel .dbar{background:rgba(255,255,255,.2)}
.day.sel .dbar i{background:#fff}
.day.sel.today::after{color:rgba(255,255,255,.8)}
.day-pad{min-height:1px}
.legend{gap:16px}
.legend .lg{display:inline-block;width:14px;height:5px;border-radius:3px;border:0;vertical-align:2px;margin-right:6px}
.lg-free{background:var(--ok)}
.lg-busy{background:var(--warn)}
.lg-full{background:var(--bad)}
.lg-closed{background:repeating-linear-gradient(135deg,var(--surface-3) 0 3px,var(--line-3) 3px 4px)!important;height:10px!important;vertical-align:-1px!important}
.lg-note{color:var(--faint)}
.cal-detail{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:8px}
.cd-day{display:flex;align-items:center;gap:8px}
.cd-day svg{width:16px;height:16px;color:var(--muted);flex:none}
.cd-meter{display:flex;align-items:center;gap:10px}
.cd-track{position:relative;flex:1;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.cd-track i{position:absolute;top:0;bottom:0}
.cd-booked{left:0;background:var(--line-3)}
.cd-this{background:var(--accent)}
.cd-this.ok{background:var(--ok)}
.cd-this.warn{background:var(--warn)}
.cd-this.bad{background:var(--bad)}
.cd-txt{color:var(--ink-2);font-weight:500;line-height:1.5}

/* payment panel */
.paycard{overflow:hidden}
.paycard>div+div{border-top:1px solid var(--line)}
.paycard .card-h{border-bottom:0;padding-bottom:6px;min-height:0}
.paycard .card-h h2 svg{width:18px;height:18px;color:var(--muted)}
.sum-b{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.sum-lines{display:flex;flex-direction:column;gap:10px}
.sum-line{display:flex;align-items:flex-start;gap:10px}
.sum-ic{width:32px;height:32px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-2);flex:none}
.sum-ic svg{width:22px;height:22px}
.sum-ic img{width:100%;height:100%;object-fit:cover}
.sum-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sum-t b{font-size:13.5px;font-weight:800}
.sum-t span{font-size:12px;color:var(--muted);font-weight:600}
.sum-amt{font-weight:800;white-space:nowrap}
.sum-b .totals{border-top:1px solid var(--line);padding-top:8px}
.pay-paid{font-size:12px;color:var(--muted);font-weight:600}
.pay-paid b{color:var(--ink)}
.pay-b{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.pay-meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pay-meter i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .2s}
.pay-lines{display:flex;flex-direction:column;gap:6px}
.pay-line{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.pay-line.now{background:var(--ok-soft);border-color:var(--ok-line)}
.pay-ic{width:28px;height:28px;border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.pay-ic svg{width:15px;height:15px}
.pay-t{flex:1;min-width:0;font-weight:700}
.pay-t span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.pay-line .num{font-weight:800}
.pay-methods{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn.method{justify-content:flex-start;gap:10px;padding:0 12px}
.btn.method .mi{width:28px;height:28px;border-radius:8px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.btn.method .mi svg{width:16px;height:16px}
.btn.method:hover .mi{background:var(--primary);color:#fff}
.pay-b .balance-row{font-size:14px}
.pay-b .balance-row .big{font-size:26px}
.pay-b .balance-row .big.bad{color:var(--bad-ink)}
.pay-b .balance-row .big.ok{color:var(--ok-ink)}
.pay-b .banner{font-size:12.5px;padding:10px 12px}
.pay-save{padding:16px 20px 18px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.print-opts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}

/* ---------- tablet ---------- */
@media (max-width:1180px){
  .pos{grid-template-columns:minmax(0,1fr) 360px}
  .co-grid{grid-template-columns:minmax(0,1fr) 340px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}

/* ---------- phone ---------- */
@media (max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .pos-main{padding:14px var(--gutter) 18px}
  .pos-ticket{position:static;height:auto;border-left:0;box-shadow:none;border-top:1px solid var(--line);margin:0 var(--gutter);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .tk-body{overflow:visible}
  .pos-steps{font-size:11.5px}
  .pos-steps-sep{width:12px}
  .pos-no{height:34px;padding:0 10px}
  .pos-no>span{display:none}
  .pk-top .search{height:46px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .tile{min-height:0;padding:12px;align-items:center;text-align:center}
  .tile-ic{width:54px;height:54px;border-radius:14px;margin-bottom:6px}
  .tile-ic svg{width:36px;height:36px}
  .tile-name{font-size:13.5px}
  .tile-badge{top:8px;right:8px}
  .vtiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .vtile{min-height:80px}
  .target-a{width:100%}
  .target-a .btn{flex:1}
  .result{flex-wrap:wrap}
  .r-time{display:none}
  .citem{padding:9px 14px 8px}
  .tk-head,.tk-foot{padding-left:14px;padding-right:14px}
  .tk-cta{display:none}
  .mobile-bar{display:flex;gap:10px;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(14,22,38,.06)}
  .mobile-bar:empty{display:none}
  .mobile-bar .btn{flex:0 0 auto;padding:0 18px}
  .mb-sum{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .mb-n{min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--brass);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .mb-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
  .mb-t span{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .mb-t b{font-size:16px;font-weight:800}
  .co-grid{grid-template-columns:minmax(0,1fr)}
  .content.co{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .co-side{position:static}
  .cal{gap:4px}
  .day{min-height:52px;padding:6px 5px;border-radius:9px}
  .day .dn{font-size:13.5px}
  .day .dl{font-size:9.5px}
  .day.lv-closed .dl{visibility:hidden}
  .day.today::after{content:"";top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .day.sel.today::after{background:#fff}
  .cal-h{justify-content:center}
  .cal-h>.btn{width:100%}
  .methods,.seg.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
  .co-cust-a{width:100%}
}

/* ---------- settings: side menu + sections ---------- */
.set-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.set-nav{position:sticky;top:calc(var(--top-h) + 20px);display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.set-nav-i{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:10px;color:var(--ink);transition:background .12s}
.set-nav-i:hover{background:var(--hover);color:var(--ink)}
.set-nav-i.on{background:var(--accent-soft)}
.set-nav-ic{width:34px;height:34px;border-radius:9px;background:var(--surface-3);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.set-nav-ic svg{width:17px;height:17px}
.set-nav-i.on .set-nav-ic{background:var(--primary);color:#fff}
.set-nav-t{display:flex;flex-direction:column;min-width:0}
.set-nav-t b{font-size:13.5px;font-weight:700}
.set-nav-t span{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.set-main>.row{gap:20px}
.set-card{overflow:hidden}
.set-card-h{display:flex;align-items:flex-start;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.set-card-h p{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px;max-width:70ch}
.set-card-ic{width:36px;height:36px;border-radius:10px;background:var(--brass-soft);color:var(--brass-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.set-card-ic svg{width:18px;height:18px}
.ph{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-3);border-radius:5px;padding:0 5px;margin:1px 0}
.set-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,1.4fr);gap:24px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row.wide{align-items:start}
.set-lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-lbl b{font-size:13.5px;font-weight:700}
.set-lbl span{font-size:12.5px;color:var(--muted);font-weight:500}
.set-ctl{min-width:0;display:flex;align-items:center;gap:10px}
.set-ctl .input{max-width:420px}
.set-ctl .input.short{max-width:160px}
.set-ctl textarea.input{height:auto;min-height:72px;padding:10px 12px;line-height:1.45;resize:vertical;max-width:none;font-size:13.5px}
.set-unit{display:flex;align-items:center;max-width:180px;width:100%}
.set-unit .input{border-radius:var(--r) 0 0 var(--r)}
.set-unit span{height:40px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid var(--line-2);border-left:0;border-radius:0 var(--r) var(--r) 0;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.set-intro{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.set-intro>div{flex:1 1 320px;min-width:0}
.set-intro h2{font-size:var(--fs-lg)}
.set-intro p{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px;max-width:72ch}
.set-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.danger-zone{border-color:var(--bad-line)}
.danger-zone .set-card-h{background:var(--bad-soft);border-bottom-color:var(--bad-line)}
.danger-zone .set-card-ic{background:var(--surface);color:var(--bad-ink)}
.danger-zone h2{color:var(--bad-ink)}
.tips{display:flex;flex-direction:column;gap:10px}
.tips>div{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:13.5px}
.tips svg{width:16px;height:16px;color:var(--ok);flex:none;margin-top:3px}

/* catalogue */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.gcard{display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.gcard:hover{border-color:var(--line-3);box-shadow:var(--sh-2)}
.gcard-top{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.gcard-pic{width:52px;height:52px;border-radius:12px;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;color:var(--ink-2)}
.gcard-pic img{width:52px!important;height:52px!important;border-radius:12px!important}
.gcard-t{flex:1;min-width:0;display:flex;flex-direction:column}
.gcard-name{font-weight:800;font-size:15px;color:var(--ink)}
.gcard-name:hover{color:var(--accent)}
.gcard-price{font-size:12.5px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:flex-start}
.gcard-jobs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px;flex:1;align-content:flex-start}
.gcard-jobs .chip{font-size:11.5px;min-height:22px;padding:0 9px;font-weight:600}
.gcard-f{display:flex;align-items:center;gap:4px;padding:10px 12px 10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}

/* garment editor */
.ge-side{display:flex;flex-direction:column;gap:16px}
.ge-pic{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ge-pic-b{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ge-foot{display:flex;gap:10px;justify-content:flex-end}
.etasks{display:flex;flex-direction:column;gap:12px}
.etask{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);transition:border-color .12s}
.etask:hover,.etask:focus-within{border-color:var(--line-3)}
.etask-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etask-h .sel{flex:0 0 120px}
.etask-h .name-in{flex:1 1 100px;width:auto;font-size:14px;font-weight:700;height:38px}
.evar .name-in{flex:1 1 120px;width:auto}
.etask .num-in{padding:0 8px}
.etask-note{font-size:12.5px;color:var(--muted);font-weight:600;min-width:150px}
.etask-btns{display:flex;gap:2px;margin-left:auto}
.etask-add{align-self:flex-start;font-size:12.5px}
.evars{display:flex;flex-direction:column;gap:8px;margin-left:10px;padding-left:16px;border-left:2px solid var(--accent-line)}
.evar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.pic-prev{width:84px;height:84px;border:1px solid var(--line);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;background:var(--surface-2);overflow:hidden;flex:none;color:var(--ink-2)}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.icon-pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:10.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.icon-pick button:hover{border-color:var(--line-3);color:var(--ink)}
.icon-pick button svg{width:32px;height:32px;color:var(--ink-2)}
.icon-pick button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft);color:var(--accent-2)}

/* staff */
.srows{display:flex;flex-direction:column}
.srow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line)}
.srow.add{border-bottom:0;align-items:flex-end;background:var(--surface-2)}
.sname{display:flex;align-items:center;gap:12px;flex:1 1 150px;min-width:0}
.sname-in{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sname-in .name-in{flex:none;height:30px}
.sname-n{font-weight:800;font-size:14px}
.sname .name-in{border-color:transparent;background-color:transparent;padding:0 6px;margin-left:-6px;max-width:260px}
.sname .name-in:hover{border-color:var(--line-2)}
.sname .name-in:focus{border-color:var(--accent);background-color:var(--surface)}
.sname .name-in.small{color:var(--muted);font-weight:600}
.add-f{gap:12px}
.add-f .field{flex:1 1 140px}
.add-note{flex:1 1 220px}
.shours{display:flex;gap:6px;flex-wrap:wrap}
.hcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.02em}
.hcell input{width:46px;height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);text-align:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface)}
.hcell input:focus{border-color:var(--accent);box-shadow:var(--ring)}
.hcell.off input{background:var(--surface-3);color:var(--faint);border-color:var(--line)}
.sweek{display:flex;flex-direction:column;min-width:96px;font-size:12px;font-weight:600;color:var(--muted)}
.sweek b{font-size:15px;color:var(--ink)}
.caps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.caps div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok-ink);font-size:13px;font-weight:700}
.caps div b{font-size:11.5px;letter-spacing:.02em;color:var(--muted)}
.caps div.off{background:var(--surface-3);color:var(--faint)}

/* discounts */
.drows{display:flex;flex-direction:column;gap:8px}
.drow,.drow-hd{display:grid;grid-template-columns:minmax(140px,1fr) 120px 110px 34px;gap:8px;align-items:center}
.drow-hd{font-size:var(--fs-xs);font-weight:800;color:var(--muted);letter-spacing:.04em}
.drow .name-in{width:100%}
.drow .num-in{width:100%}
.drow-f{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}

@media (max-width:1100px){
  .set-layout{grid-template-columns:220px minmax(0,1fr);gap:18px}
  .set-nav-t span{display:none}
}
@media (max-width:900px){
  .set-layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:6px;gap:6px}
  .set-nav::-webkit-scrollbar{display:none}
  .set-nav-i{flex:none;padding:6px 10px 6px 6px;gap:8px}
  .set-nav-ic{width:28px;height:28px}
  .set-nav-t b{font-size:12.5px;white-space:nowrap}
  .set-card-h{padding:14px 16px}
  .set-row{grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 16px}
  .set-ctl .input,.set-ctl .input.short{max-width:none}
  .srow{padding:12px 14px;gap:12px}
  .shours{width:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .hcell input{width:100%}
  .caps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .drow,.drow-hd{grid-template-columns:minmax(0,1fr) 92px 72px 32px}
  .gcards{grid-template-columns:minmax(0,1fr)}
}

.hcell.cap input{width:52px;font-size:13px;padding:0 2px}
@media (min-width:901px){
  .srows .srow{flex-wrap:nowrap}
  .srows .sweek{flex:0 0 120px;min-width:0}
  .srows .shours{flex-wrap:nowrap;flex:none}
}
.set-static{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700;min-height:40px}
.set-static .linkbtn{font-weight:700}
.set-last{display:flex;align-items:center;gap:8px;padding-bottom:0!important;font-size:13px;font-weight:600;color:var(--muted)}
.set-last svg{width:15px;height:15px}
.shours.sowner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);border:1px dashed var(--line-2);font-size:13px;color:var(--muted);font-weight:600}
.shours.sowner b{color:var(--ink-2)}
.shours.sowner svg{width:16px;height:16px;flex:none}

/* bringing in records from the old software */
.imp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.imp-head b{font-size:15px}
.imp-sum{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.imp-l{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.imp-l>svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--accent)}
.imp-l .small{margin-top:2px}
.imp-opts{display:flex;flex-direction:column;gap:8px}
.imp-opts .switch{align-items:flex-start;line-height:1.4}
.imp-opts .switch input{margin-top:2px}
.imp-note{line-height:1.45}
.imp-busy{display:flex;gap:14px;align-items:center;padding:8px 0}
.imp-spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:imp-spin .8s linear infinite;flex:none}
@keyframes imp-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.imp-spin{animation-duration:2.4s}}

/* ---------- customers ---------- */
.kpis-3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cust-card{overflow:hidden}
.cust-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.cust-tools .search{flex:1 1 280px;max-width:460px}
.ctbl{display:flex;flex-direction:column}
.ctbl-h,.ctbl-r{display:grid;grid-template-columns:minmax(220px,2fr) minmax(130px,1fr) 90px minmax(120px,1fr) 120px 130px 92px;gap:14px;align-items:center;padding:0 20px}
.ctbl-h{min-height:40px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:var(--fs-xs);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctbl-r{min-height:64px;border-bottom:1px solid var(--line);transition:background .12s}
.ctbl-r:last-child{border-bottom:0}
.ctbl-r:hover{background:var(--hover)}
.cc-name{display:flex;align-items:center;gap:12px;min-width:0;color:var(--ink)}
.cc-name:hover{color:var(--ink)}
.cc-name:hover b{color:var(--accent)}
.cc-txt{display:flex;flex-direction:column;min-width:0}
.cc-line{display:flex;align-items:center;gap:8px;min-width:0}
.cc-line b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.cc-line .chip{min-height:20px;padding:0 8px;font-size:11px}
.cc-sub{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cc-phone{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cc-phone svg{width:14px;height:14px;color:var(--faint);flex:none}
.cc-orders b{font-size:14px}
.cc-last a{font-weight:600;font-size:13px}
.cc-life{font-weight:700;font-size:13.5px}
.cc-act{display:flex;justify-content:flex-end}
.cc-ol{display:none}
/* customer profile */
.cprof{padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.cprof-top{display:flex;align-items:center;gap:16px}
.cprof-name{font-size:20px;line-height:1.2}
.cprof-tag{margin-top:6px}
.cprof-facts{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
.cprof-facts .kv{align-items:center}
.cprof-facts .kv>span:first-child{display:inline-flex;align-items:center;gap:8px}
.cprof-facts .kv svg{width:15px;height:15px;color:var(--faint)}
.cprof-facts .kv .cc-sub{text-align:right}
.cprof-notes{background:var(--brass-soft);border:1px solid var(--brass-line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cprof-notes .eyebrow{color:var(--brass-2)}
.cprof-notes p{color:var(--ink-2);font-weight:600;font-size:13.5px}
.cprof-notes.empty-note{background:var(--surface-2);border-style:dashed;border-color:var(--line-2)}
@media (max-width:1180px){
  .ctbl-h,.ctbl-r{grid-template-columns:minmax(200px,2fr) minmax(120px,1fr) 80px 120px 130px 92px}
  .ctbl .cc-life,.ctbl-h span:nth-child(5){display:none}
}
@media (max-width:900px){
  .cust-tools{padding:12px 14px}
  .cust-tools .search{max-width:none;min-width:0}
  .ctbl-h{display:none}
  .ctbl-r{grid-template-columns:1fr auto;grid-template-areas:"name bal" "phone act" "orders last";gap:6px 12px;padding:12px 14px}
  .cc-name{grid-area:name}
  .cc-bal{grid-area:bal}
  .cc-phone{grid-area:phone;padding-left:48px}
  .cc-act{grid-area:act}
  .cc-orders{grid-area:orders;text-align:left;padding-left:48px;display:flex;gap:6px;align-items:baseline;font-size:12px}
  .cc-orders b{font-size:12px}
  .cc-orders .cc-ol{display:inline;font-weight:600;color:var(--muted)}
  .cc-orders .cc-sub{display:inline}
  .cc-last{grid-area:last;text-align:right;display:flex;gap:6px;justify-content:flex-end;align-items:baseline}
  .cc-last .cc-sub{display:inline}
  .ctbl .cc-life{display:none}
}

/* customer page: order history */
.hlist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:60px minmax(0,1fr) 150px 110px 100px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.hrow:last-of-type{border-bottom:0}
.hrow:hover{background:var(--hover)}
.hrow.voided{opacity:.55}
.hrow.voided .ono{text-decoration:line-through}
.hrow .ono{font-weight:700;font-size:13px;color:var(--ink)}
.hrow .ono:hover{color:var(--accent)}
.hrow-w{display:flex;align-items:center;gap:10px;min-width:0}
.hrow-t{display:flex;flex-direction:column;min-width:0;font-size:13.5px;font-weight:600}
.hrow-d{min-width:0;font-size:13px}
.hrow .omoney{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.hrow .ostat{justify-self:end}
.hlist .list-more{border-top:1px solid var(--line)}
@media (max-width:760px){
  .hrow{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no d stat" "w w money";gap:6px 10px;padding:12px var(--gutter)}
  .hrow .ono{grid-area:no}
  .hrow-d{grid-area:d}
  .hrow .ostat{grid-area:stat}
  .hrow-w{grid-area:w}
  .hrow .omoney{grid-area:money}
  .hrow-w .gstack{display:none}
}
@media (max-width:760px){
  .kpis-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* a mobile number already saved for another customer: a short warning under the number, with that customer one tap away */
.dup-slot:empty{display:none}
.form-grid>.span-all{grid-column:1/-1}
.dialog-b>.dup-slot{margin-top:-2px}
.banner.dup{padding:9px 12px;gap:10px;font-size:13px;font-weight:600;line-height:1.35}
.banner.dup svg{width:18px;height:18px}
.banner.dup b{font-weight:800}
.banner.dup .btn{flex:none}
.dup-ask{margin:0;line-height:1.5}

/* ---------- reports ---------- */
.rep-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:12px var(--gutter)}
.rep-groups{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.rep-grp{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.rep-grp-l{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);flex:none}
.rep-tabs{display:flex;flex-wrap:wrap;max-width:100%}
.rep-tabs .pill{white-space:nowrap;flex:none}
.rep-tabs .pill svg{width:15px;height:15px;opacity:.8}
/* phone: one list of every report */
.rep-pick{display:none;position:relative;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1)}
.rep-pick:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.rep-pick-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.rep-pick-ic svg{width:17px;height:17px}
.rep-pick select{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;font-weight:800;color:var(--ink);height:44px;appearance:none;-webkit-appearance:none;padding:0;cursor:pointer;outline:none}
.rep-pick>svg{width:16px;height:16px;color:var(--muted);pointer-events:none;flex:none}
/* empty chart */
.rchart-empty{min-height:200px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface-2)}
.rchart-empty .empty{padding:20px}
/* overview: what customers owe, one tap to the list */
.rep-owe{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--bad-line,var(--line));border-radius:var(--r-lg);background:var(--bad-soft);color:var(--bad-ink);font:inherit;cursor:pointer;box-shadow:var(--sh-1)}
.rep-owe:hover{filter:brightness(.98);box-shadow:var(--sh-2)}
.rep-owe-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.rep-owe-ic svg{width:18px;height:18px}
.rep-owe-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rep-owe-t b{font-size:15px}
.rep-owe-t span{font-size:12.5px;font-weight:600;opacity:.85}

// ===== 01-store.js =====
// ---------- persistence: IndexedDB with localStorage fallback ----------
const Store = (() => {
  const DB_NAME = 'tailorpos', STORE = 'kv', KEY = 'state_v2';
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB unavailable'));
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('blocked'));
    });
    return dbp;
  }
  async function get() {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const r = tx.objectStore(STORE).get(KEY);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => rej(r.error);
      });
    } catch (e) {
      try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e2) { return null; }
    }
  }
  async function set(value) {
    try {
      const db = await open();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, KEY);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      try { localStorage.setItem(KEY, JSON.stringify(value)); } catch (e2) { console.warn('Could not save', e2); }
    }
  }
  return { get, set };
})();

      window.addEventListener('online', () => { if (this.dirty()) this.push(); });
    }
    if (this.supa) {
      window.addEventListener('offline', () => Remote.setOnline(false, 'No internet'));
      window.addEventListener('online', () => { if (this.dirty()) this.push(); });

  // ----- live updates from other devices -----
  listen() {

  onCol(c, q) {

    const m = this.snap.cols[c];

    q.docChanges().forEach((ch) => {
      const id = ch.doc.id;
      const i = S[c].findIndex((x) => x.id === id);

  onApp(q) {

      const dn = ch.doc.id;
      if (this.DOCS.indexOf(dn) < 0 || ch.type === 'removed') return;
      const body = ch.doc.data();
      if (!body || body.value === undefined) return;
      const val = clone(body.value);
      if (dn === 'staff') fixStaff(val); // a list saved by an older version
      const js = canon(val);
      const local = canon(this.docValue(dn));

  },
  onPhotos(q) {
    if (this.restoring) return;
    let changed = false;

      const gid = ch.doc.id;
      const im = ch.type === 'removed' ? null : ((ch.doc.data() || {}).image || null);
      const g = findCat(gid);

  },
  // another device's new order: the next number moves past it (the shared counter itself is read only now and then)
  seenNo(no) {

  onCounter(d) {
    const next = d.exists ? num((d.data() || {}).next) : 0;

    const userEdit = num(S.settings.nextOrderNo) !== this.counterNext;
    this.counterNext = next;
